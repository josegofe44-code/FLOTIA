function colConfigKey(){
  return 'flotia.cols.' + (currentUser && currentUser.username ? currentUser.username : 'anon');

function saveColConfig(){
  try{
    localStorage.setItem(colConfigKey(), JSON.stringify({order:forecastColOrder, visible:forecastColVisible}));
  }catch(e){ /* si el navegador no permite almacenamiento, la configuración dura solo la sesión */ }
}
function loadColConfig(){
  // por defecto se muestran todas las columnas
  forecastColOrder = FORECAST_COLS.map(c=>c.key);
  forecastColVisible = {};
  FORECAST_COLS.forEach(c=>{ forecastColVisible[c.key] = true; });
  try{
    const raw = localStorage.getItem(colConfigKey());
    if(!raw) return;
    const cfg = JSON.parse(raw);
    if(Array.isArray(cfg.order)){
      // conserva solo claves válidas y añade al final las columnas nuevas que no estuvieran guardadas
      const valid = cfg.order.filter(k=>FORECAST_COLS.some(c=>c.key===k));
      FORECAST_COLS.forEach(c=>{ if(!valid.includes(c.key)) valid.push(c.key); });
      forecastColOrder = valid;
    }
    if(cfg.visible && typeof cfg.visible==='object'){
      FORECAST_COLS.forEach(c=>{
        if(c.fixed) { forecastColVisible[c.key] = true; return; }
        if(typeof cfg.visible[c.key]==='boolean') forecastColVisible[c.key] = cfg.visible[c.key];
      });
    }
  }catch(e){ /* configuración corrupta o sin acceso: se queda la de por defecto */ }
}

function preavisoSortValue(v,t){
  if(t.fechaPreaviso) return daysUntil(t.fechaPreaviso);
  if(t.limiteType==='km' && t.kmLimite!=null) return Math.round((t.kmLimite - v.estimatedKm)/(v.avgKmDia||AVG_KM_PER_DAY));
  if(t.fechaLimite) return daysUntil(t.fechaLimite);
  return 999999;
}
function venceDiasEquiv(v,t){
  // días hasta el vencimiento: directo si es por fecha, o proyectado usando el uso medio del vehículo si es por km
  if(t.limiteType==='km') return Math.round(((t.kmLimite||0) - v.estimatedKm)/(v.avgKmDia||AVG_KM_PER_DAY));
  if(t.fechaLimite) return daysUntil(t.fechaLimite);
  return null;
}
function remanenteTask(v,t){
  if(t.limiteType==='km'){
    const kmLeft = Math.round((t.kmLimite||0) - v.estimatedKm);
    const virtualDays = venceDiasEquiv(v,t);
    return {text:`${formatKm(kmLeft)}`, sortValue:virtualDays, info:urgencyInfo(virtualDays)};
  }
  if(!t.fechaLimite) return {text:'—', sortValue:999999, info:{color:'var(--muted)', label:'—'}};
  const daysLeft = daysUntil(t.fechaLimite);
  return {text: daysLeft<0?`VENCIDA (${Math.abs(daysLeft)}d)`:`${daysLeft} días`, sortValue:daysLeft, info:urgencyInfo(daysLeft)};
}

function taskDetailHTML(v, it){
  const t = it.t;
  if(t.isObd){
    return `
      <div class="task-meta">${v.dtcs.map(d=>`${d.code} — ${d.desc}`).join(' · ')}</div>
      <button class="toggle-inactive-btn" style="margin-top:8px;" data-goto-scanner="${v.id}">Ir al escáner</button>
    `;
  }
  const refsOpen = !!forecastExpandedRefs[t.id];
  return `
    <div class="task-meta">
      ${t.limiteType==='km' ? `Límite: ${formatKm(t.kmLimite||0)}` : `Límite: ${t.fechaLimite?formatDate(t.fechaLimite):'—'}${t.fechaPreaviso?' · Preaviso: '+formatDate(t.fechaPreaviso):''}`}
    </div>
    <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;">
      <select class="resp-select" data-vid="${v.id}" data-tid="${t.id}">
        <option value="">Responsable: —</option>
        ${responsablesList.map(r=>`<option value="${r}" ${t.responsable===r?'selected':''}>${r}</option>`).join('')}
      </select>
      <select class="centro-select" data-vid="${v.id}" data-tid="${t.id}">
        <option value="">Centro: —</option>
        ${centrosList.map(c=>`<option value="${c}" ${t.centro===c?'selected':''}>${c}</option>`).join('')}
      </select>
    </div>
    ${t.tipo==='Revisión' ? `
      <div style="margin-top:6px;">
        <select class="mat-select" data-vid="${v.id}" data-tid="${t.id}">
          <option value="A" ${t.materiales==='A'?'selected':''}>${MATERIALES_REVISION.A}</option>
          <option value="B" ${t.materiales==='B'?'selected':''}>${MATERIALES_REVISION.B}</option>
        </select>
        <span class="refs-toggle" data-tid="${t.id}">${refsOpen?'▾ Ocultar referencias':'▸ Ver referencias'}</span>
        ${refsOpen ? `<div class="mat-refs">${revisionParts(t.materiales||'A').map(p=>`<div>${p}: ${materialRefFor(v,p)}</div>`).join('')}</div>` : ''}
      </div>
    ` : ''}
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button class="toggle-inactive-btn" data-complete-tid="${t.id}">Reporting back</button>
      <button class="toggle-inactive-btn" data-extend-tid="${t.id}">Extender</button>
    </div>
    ${completionFormHTML(t)}
    ${extendFormHTML(t)}
  `;
}
function completionFormHTML(t){
  if(forecastCompletingTaskId!==t.id) return '';
  const form = forecastCompleteForm;
  return `
    <div class="reg-form" style="margin-top:8px;">
      ${t.limiteType==='km' ? `
        <div class="form-row"><label>¿A cuántos km más hay que repetirlo?</label><input type="number" id="completeKmIncrement" value="${form.kmIncrement}" placeholder="Ej: 10000"></div>
      ` : `
        <div class="form-row"><label>Fecha límite del próximo evento</label><input type="date" id="completeFechaLimite" value="${form.fechaLimite}"></div>
        <div class="form-row"><label>Fecha de preaviso</label><input type="date" id="completeFechaPreaviso" value="${form.fechaPreaviso}"></div>
      `}
      <div class="form-row">
        <label>Coste real (€)${t.costeEstimado!=null?` <span style="text-transform:none;letter-spacing:0;color:var(--muted);font-weight:400;">· estimado: ${t.costeEstimado} €</span>`:''}</label>
        <input type="number" id="completeCosteReal" value="${t.costeReal!=null?t.costeReal:''}" placeholder="Importe facturado">
      </div>
      <div class="form-row">
        <label>Factura</label>
        <input type="file" accept="image/*" id="completeFactura">
        ${t.facturaFoto ? `<div style="margin-top:7px;"><img src="${t.facturaFoto}" style="max-width:100%;border-radius:8px;border:1px solid var(--border);"></div>` : ''}
      </div>
      <button class="save-btn" id="confirmCompleteBtn">Confirmar</button>
    </div>
  `;
}
function extendFormHTML(t){
  if(forecastExtendingTaskId!==t.id) return '';
  const form = forecastExtendForm;
  return `
    <div class="reg-form" style="margin-top:8px;">
      ${t.limiteType==='km' ? `
        <div class="form-row"><label>Nuevo km límite</label><input type="number" id="extendKmLimite" value="${form.kmLimite||t.kmLimite||''}" placeholder="Ej: ${(t.kmLimite||0)+10000}"></div>
      ` : `
        <div class="form-row"><label>Nueva fecha límite</label><input type="date" id="extendFechaLimite" value="${form.fechaLimite}"></div>
        <div class="form-row"><label>Nueva fecha de preaviso</label><input type="date" id="extendFechaPreaviso" value="${form.fechaPreaviso}"></div>
      `}
      <button class="save-btn" id="confirmExtendBtn">Confirmar ampliación</button>
    </div>
  `;
}

function colFilterIcon(col){
  const active = forecastColFilters[col] && forecastColFilters[col].size>0;
  return `<span class="col-filter-btn ${active?'active':''}" data-col="${col}">▾</span>`;
}

function renderForecastScreen(){
  const content = document.getElementById('content');
  content.classList.add('no-pad');

  let baseItems = forecastObdMode==='active' ? [] : buildForecastItems();
  if(forecastObdMode==='active') baseItems = buildObdItems();
  else if(forecastObdMode==='mixed') baseItems = baseItems.concat(buildObdItems());

  if(!forecastShowInactive) baseItems = baseItems.filter(it => it.v.active!==false);

  // filtro por plazo temporal (siempre deja pasar los eventos ya vencidos y los OBD activos)
  if(forecastHorizon!=='all'){
    const maxDays = parseInt(forecastHorizon);
    baseItems = baseItems.filter(it => it.remanente.sortValue <= maxDays);
  }

  // filtro por texto (matrícula, conductor, licencia o tarea)
  if(forecastSearch.trim()!==''){
    const q = forecastSearch.toLowerCase();
    baseItems = baseItems.filter(it => it.v.plate.toLowerCase().includes(q) || it.v.driver.toLowerCase().includes(q) || (it.v.licencia||'').toLowerCase().includes(q) || it.tarea.toLowerCase().includes(q));
  }

  // valores distintos disponibles para cada columna, calculados ANTES de aplicar los filtros de columna
  // (así siempre puedes volver a marcar un valor que hayas ocultado)
  const COLS = ['plate','licencia','tarea','responsable','centro','estado','flota','conductor','dueno','respCoche'];
  const distinctByCol = {};
  COLS.forEach(col=>{ distinctByCol[col] = Array.from(new Set(baseItems.map(it=>colValue(it,col)))).sort(); });

  // aplica los filtros tipo Excel de cada columna
  let items = baseItems.filter(it => COLS.every(col => !forecastColFilters[col].has(colValue(it,col))));

  function arrow(key){ return forecastSort.key===key ? `<span class="arrow">${forecastSort.dir===1?'▲':'▼'}</span>` : ''; }

  let rows, theadHTML, colspan, footCount;

  if(forecastGrouped){
    // vista agrupada: una línea por vehículo, con sus eventos desplegables
    const groupsMap = new Map();
    items.forEach(it=>{
      if(!groupsMap.has(it.v.id)) groupsMap.set(it.v.id, {v:it.v, items:[]});
      groupsMap.get(it.v.id).items.push(it);
    });
    let groups = Array.from(groupsMap.values()).map(g=>{
      const worst = g.items.reduce((a,b)=> a.remanente.sortValue <= b.remanente.sortValue ? a : b);
      const worstPreaviso = Math.min(...g.items.map(it=>it.preaviso));
      return Object.assign(g, {worst, worstPreaviso});
    });
    groups.sort((a,b)=>{
      let av, bv;
      if(forecastSort.key==='plate'){ av=a.v.plate; bv=b.v.plate; }
      else if(forecastSort.key==='licencia'){ av=a.v.licencia||''; bv=b.v.licencia||''; }
      else if(forecastSort.key==='remanente'){ av=a.worst.remanente.sortValue; bv=b.worst.remanente.sortValue; }
      else { av=a.worstPreaviso; bv=b.worstPreaviso; }
      if(av<bv) return -1*forecastSort.dir;
      if(av>bv) return 1*forecastSort.dir;
      return 0;
    });
    colspan = 5;
    theadHTML = `<tr>
      <th data-key="plate"><div class="col-head-row"><span>Matrícula${arrow('plate')}</span>${colFilterIcon('plate')}</div></th>
      <th data-key="licencia"><div class="col-head-row"><span>Licencia/VTC${arrow('licencia')}</span>${colFilterIcon('licencia')}</div></th>
      <th>Eventos</th>
      <th data-key="remanente">Remanente más urgente${arrow('remanente')}</th>
      <th><div class="col-head-row"><span>Estado</span>${colFilterIcon('estado')}</div></th>
    </tr>`;
    rows = groups.map(g=>{
      const v = g.v;
      const info = g.worst.remanente.info;
      const expanded = !!forecastExpandedVeh[v.id];
      const mainRow = `
        <tr class="amos-veh-row ${v.active===false?'amos-inactive-row':''}" data-vid="${v.id}">
          <td><span class="row-expand">${expanded?'▾':'▸'}</span><span class="plain-plate-cell"><span class="plain-plate-text">${v.plate}</span></span></td>
          <td>${v.licencia || '—'}</td>
          <td>${g.items.length} evento${g.items.length===1?'':'s'} · más urgente: ${g.worst.tarea}</td>
          <td style="color:${info.color};font-weight:700;">${g.worst.remanente.text}</td>
          <td><span class="amos-chip" style="color:${info.color};background:${info.color}22;border:1px solid ${info.color}55;">${info.label}</span></td>
        </tr>
      `;
      if(!expanded) return mainRow;
      const detailRows = g.items.map(it=>{
        const tinfo = it.remanente.info;
        return `
          <div class="task-row">
            <div class="task-row-top">
              <span class="task-tipo">${it.tarea}</span>
              <span style="color:${tinfo.color};font-weight:700;font-size:12px;">${it.t.isObd?tinfo.label:it.remanente.text}</span>
            </div>
            ${taskDetailHTML(v, it)}
          </div>
        `;
      }).join('');
      return mainRow + `<tr class="amos-detail-row"><td colspan="5"><div class="amos-detail-wrap">${detailRows}</div></td></tr>`;
    }).join('');
    footCount = `${groups.length} vehículo${groups.length===1?'':'s'} · ${items.length} evento${items.length===1?'':'s'}`;
  } else {
    // vista por evento (por defecto): una línea por avería/tarea, con todas las columnas
    items.sort((a,b)=>{
      let av, bv;
      if(forecastSort.key==='plate'){ av=a.v.plate; bv=b.v.plate; }
      else if(forecastSort.key==='licencia'){ av=a.v.licencia||''; bv=b.v.licencia||''; }
      else if(forecastSort.key==='remanente'){ av=a.remanente.sortValue; bv=b.remanente.sortValue; }
      else { av=a.preaviso; bv=b.preaviso; }
      if(av<bv) return -1*forecastSort.dir;
      if(av>bv) return 1*forecastSort.dir;
      return 0;
    });
    const COLS_V = visibleCols();
    colspan = COLS_V.length;
    const thFor = (c)=>{
      if(c.key==='tipo') return '<th class="th-tipo">Tipo</th>';
      if(c.key==='plate') return `<th data-key="plate"><div class="col-head-row"><span>Matrícula${arrow('plate')}</span>${colFilterIcon('plate')}</div></th>`;
      if(c.key==='licencia') return `<th data-key="licencia"><div class="col-head-row"><span>Licencia/VTC${arrow('licencia')}</span>${colFilterIcon('licencia')}</div></th>`;
      if(c.key==='evento') return `<th><div class="col-head-row"><span>Evento</span>${colFilterIcon('tarea')}</div></th>`;
      if(c.key==='remanente') return `<th data-key="remanente">Remanente${arrow('remanente')}</th>`;
      if(c.key==='responsable') return `<th><div class="col-head-row"><span>Responsable</span>${colFilterIcon('responsable')}</div></th>`;
      if(c.key==='centro') return `<th><div class="col-head-row"><span>Centro</span>${colFilterIcon('centro')}</div></th>`;
      if(c.key==='estado') return `<th><div class="col-head-row"><span>Estado</span>${colFilterIcon('estado')}</div></th>`;
      if(c.key==='flota') return `<th><div class="col-head-row"><span>Flota</span>${colFilterIcon('flota')}</div></th>`;
      if(c.key==='dueno') return `<th><div class="col-head-row"><span>Dueño</span>${colFilterIcon('dueno')}</div></th>`;
      if(c.key==='respCoche') return `<th><div class="col-head-row"><span>Responsable coche</span>${colFilterIcon('respCoche')}</div></th>`;
      if(c.key==='conductores') return `<th><div class="col-head-row"><span>Conductores</span>${colFilterIcon('conductor')}</div></th>`;
      return `<th>${c.label}</th>`;
    };
    theadHTML = `<tr>${COLS_V.map(c=>{
      const raw = thFor(c);
      // cada cabecera es arrastrable para reordenar columnas
      return raw.replace('<th', `<th draggable="true" data-dragcol="${c.key}"`);
    }).join('')}</tr>`;
    rows = items.map(it=>{
      const v = it.v, t = it.t;
      const info = it.remanente.info;
      const refsOpen = !!forecastExpandedRefs[t.id];
      const expanded = !!forecastExpandedTask[t.id];
      const materialesCell = t.isObd ? '—' : (t.tipo==='Revisión'
        ? `<select class="mat-select" data-vid="${v.id}" data-tid="${t.id}">
             <option value="A" ${t.materiales==='A'?'selected':''}>${MATERIALES_REVISION.A}</option>
             <option value="B" ${t.materiales==='B'?'selected':''}>${MATERIALES_REVISION.B}</option>
           </select>
           <span class="refs-toggle" data-tid="${t.id}">${refsOpen?'▾':'▸'}</span>
           ${refsOpen ? `<div class="mat-refs">${revisionParts(t.materiales||'A').map(p=>`<div>${p}: ${materialRefFor(v,p)}</div>`).join('')}</div>` : ''}`
        : `<input type="text" class="cell-input matlibre-input" data-vid="${v.id}" data-tid="${t.id}" value="${t.materialesLibres||''}" placeholder="—">`);
      const respCell = t.isObd ? '—' : `
        <select class="resp-select" data-vid="${v.id}" data-tid="${t.id}">
          <option value="">—</option>
          ${responsablesList.map(r=>`<option value="${r}" ${t.responsable===r?'selected':''}>${r}</option>`).join('')}
        </select>`;
      const centroCell = t.isObd ? '—' : `
        <select class="centro-select" data-vid="${v.id}" data-tid="${t.id}">
          <option value="">—</option>
          ${centrosList.map(c=>`<option value="${c}" ${t.centro===c?'selected':''}>${c}</option>`).join('')}
        </select>`;
      const venceKmCell = t.isObd ? '—' : (t.limiteType==='km'
        ? `<input type="number" class="cell-input kmlim-input" data-vid="${v.id}" data-tid="${t.id}" value="${t.kmLimite||''}" placeholder="—">`
        : '—');
      const diasEquiv = venceDiasEquiv(v,t);
      let venceDiasCell = '—';
      if(diasEquiv!==null){
        const fechaPrevista = t.limiteType==='km'
          ? new Date(Date.now() + diasEquiv*86400000)
          : t.fechaLimite;
        const fechaColor = diasEquiv<0 ? 'var(--red)' : 'inherit';
        const fechaWeight = diasEquiv<0 ? '700' : 'normal';
        venceDiasCell = t.limiteType==='km'
          ? `<span style="color:${fechaColor};font-weight:${fechaWeight};">${formatDate(fechaPrevista)}</span><span style="color:var(--muted);font-size:8px;"> (est.)</span>`
          : `<input type="date" class="cell-input date-input flim-input" data-vid="${v.id}" data-tid="${t.id}" value="${toDateInputValue(t.fechaLimite)}" style="color:${fechaColor};font-weight:${fechaWeight};">`;
      }
      const planCell = t.isObd ? '—' : `<input type="date" class="cell-input date-input plan-input" data-vid="${v.id}" data-tid="${t.id}" value="${toDateInputValue(t.planificado)}">`;
      const eventoCell = t.isObd
        ? `${it.tarea} · <span class="obd-goto-link" data-goto-scanner2="${v.id}">Ir al escáner</span>`
        : `<select class="cell-select tipo-select" data-vid="${v.id}" data-tid="${t.id}">
             ${TAREA_CHIPS.filter(c=>c.val!=='OBD').map(c=>`<option value="${c.val}" ${t.tipo===c.val?'selected':''}>${c.val}</option>`).join('')}
           </select>`;
      const horasCell = t.isObd ? '—' : `<input type="number" class="cell-input horas-input" data-vid="${v.id}" data-tid="${t.id}" value="${t.horasParado!=null?t.horasParado:''}" placeholder="—"><span class="horas-days-hint">${formatHorasParado(t.horasParado)}</span>`;
      const notasCell = t.isObd ? '—' : `<input type="text" class="cell-input notas-input" data-vid="${v.id}" data-tid="${t.id}" value="${t.notas||''}" placeholder="—">`;
      const cellFor = (key)=>{
        switch(key){
          case 'tipo': return `<td class="td-tipo">${tipoIconCell(t)}</td>`;
          case 'plate': return `<td><span class="plain-plate-cell">${t.isObd?'':`<span class="row-expand">${expanded?'▾':'▸'}</span>`}<span class="plain-plate-text">${v.plate}</span></span></td>`;
          case 'licencia': return `<td>${v.licencia || '—'}</td>`;
          case 'evento': return `<td class="editable-cell">${eventoCell}</td>`;
          case 'materiales': return `<td class="editable-cell">${materialesCell}</td>`;
          case 'venceKm': return `<td class="editable-cell">${venceKmCell}</td>`;
          case 'caducidad': return `<td class="editable-cell">${venceDiasCell}</td>`;
          case 'planificado': return `<td class="editable-cell">${planCell}</td>`;
          case 'remanente': return `<td style="color:${info.color};font-weight:700;">${it.remanente.text}</td>`;
          case 'horas': return `<td class="editable-cell">${horasCell}</td>`;
          case 'notas': return `<td class="editable-cell">${notasCell}</td>`;
          case 'responsable': return `<td class="editable-cell">${respCell}</td>`;
          case 'centro': return `<td class="editable-cell">${centroCell}</td>`;
          case 'estado': return `<td><span class="amos-chip" style="color:${info.color};background:${info.color}22;border:1px solid ${info.color}55;">${estadoCategoria(it)}</span></td>`;
          case 'costeEst': return `<td class="editable-cell">${t.isObd?'—':`<input type="number" class="cell-input costeest-input" data-vid="${v.id}" data-tid="${t.id}" value="${t.costeEstimado!=null?t.costeEstimado:''}" placeholder="—">`}</td>`;
          case 'costeReal': return `<td class="editable-cell">${t.isObd?'—':`<input type="number" class="cell-input costereal-input" data-vid="${v.id}" data-tid="${t.id}" value="${t.costeReal!=null?t.costeReal:''}" placeholder="—">`}${t.facturaFoto?'<span class="fact-dot" title="Factura adjunta"></span>':''}</td>`;
          case 'dueno': return `<td>${v.dueno||'—'}${v.dueno?`<span style="color:var(--muted);font-size:8px;"> (${v.duenoTipo||'—'})</span>`:''}</td>`;
          case 'respCoche': return `<td>${v.responsable||'—'}</td>`;
          case 'conductores': return `<td>${conductoresDe(v)}</td>`;
          case 'flota': return `<td>${v.flota||'—'}</td>`;
          default: return '<td>—</td>';
        }
      };
      const mainRow = `
        <tr class="${v.active===false?'amos-inactive-row':''} ${t.isObd?'':'amos-veh-row'}" ${t.isObd?'':`data-tid2="${t.id}"`}>
          ${COLS_V.map(c=>cellFor(c.key)).join('')}
        </tr>
      `;
      if(t.isObd || !expanded) return mainRow;
      return mainRow + `<tr class="amos-detail-row"><td colspan="${colspan}"><div class="amos-detail-wrap"><div class="task-row">
        <div style="display:flex;gap:8px;">
          <button class="toggle-inactive-btn" data-complete-tid="${t.id}">Reporting back</button>
          <button class="toggle-inactive-btn" data-extend-tid="${t.id}">Extender</button>
        </div>
        ${completionFormHTML(t)}
        ${extendFormHTML(t)}
      </div></div></td></tr>`;
    }).join('');
    footCount = `${items.length} evento${items.length===1?'':'s'}`;
  }

  content.innerHTML = `
    <div class="sub-header">
      <button class="back-btn" id="backBtn">← Menú</button>
      <div class="sub-title">Previsión de flota</div>
    </div>
    <div class="amos-window">
      <div class="amos-titlebar">TABLA DE PREVISIÓN — EVENTOS DE FLOTA</div>
      <div class="filter-titlebar">FILTROS DE PREVISIÓN</div>
      <div class="filter-bar">
        <div class="filter-group">
          <div class="filter-group-label">Tipo de evento</div>
          <div class="filter-group-or clickable" data-orcol="tarea" title="Desmarcar todos">OR</div>
          <div class="filter-chip-row">
            ${TAREA_CHIPS.map(c=>filterChip('tarea', c.val, c.label, c.color, c.icon)).join('')}
          </div>
        </div>
        <div class="filter-group">
          <div class="filter-group-label">Estado</div>
          <div class="filter-group-or clickable" data-orcol="estado" title="Desmarcar todos">OR</div>
          <div class="filter-chip-row">
            ${ESTADO_CHIPS.map(c=>filterChip('estado', c.val, c.label, c.color)).join('')}
          </div>
        </div>
        <div class="filter-group">
          <div class="filter-group-label">Flota</div>
          <div class="filter-group-or clickable" data-orcol="flota" title="Desmarcar todos">OR</div>
          <div class="filter-chip-row">
            ${[...new Set(vehicles.map(v=>v.flota||'—'))].sort().map((f,i)=>filterChip('flota', f, shortLabel(f,10), paletteFor(i), ICON_FLOTA)).join('')}
          </div>
        </div>
        <div class="filter-group">
          <div class="filter-group-label">Conductor</div>
          <div class="filter-group-or clickable" data-orcol="conductor" title="Desmarcar todos">OR</div>
          <div class="filter-chip-row">
            ${[...new Set(conductores().map(d=>d.nombre))].sort().map((n,i)=>filterChip('conductor', n, shortLabel(n,9), paletteFor(i+2), ICON_CONDUCTOR)).join('')}
            ${filterChip('conductor','—','S/ASIG','#6B7280', ICON_CONDUCTOR)}
          </div>
        </div>
        <div class="filter-group">
          <div class="filter-group-label">Dueño</div>
          <div class="filter-group-or clickable" data-orcol="dueno" title="Desmarcar todos">OR</div>
          <div class="filter-chip-row">
            ${[...new Set(vehicles.map(v=>v.dueno||'—'))].sort().map((d,i)=>filterChip('dueno', d, shortLabel(d,11), paletteFor(i+4), ICON_DUENO)).join('')}
          </div>
        </div>
        <div class="filter-group">
          <div class="filter-group-label">Vista</div>
          <div class="filter-chip-row">
            <span class="filter-chip ${forecastGrouped?'':'off'}" id="chipAgrupar" style="--chip-color:#41547a;">AGRUP</span>
            <span class="filter-chip ${forecastShowInactive?'':'off'}" id="chipInactivos" style="--chip-color:#41547a;">INACT</span>
          </div>

              <path d="M8.8 1.6h2.4l.35 2.05c.42.14.82.31 1.19.53l1.73-1.18 1.7 1.7-1.18 1.73c.22.37.39.77.53 1.19l2.05.35v2.4l-2.05.35c-.14.42-.31.82-.53 1.19l1.18 1.73-1.7 1.7-1.73-1.18c-.37.22-.77.39-1.19.53L11.2 18.4H8.8l-.35-2.05c-.42-.14-.82-.31-1.19-.53l-1.73 1.18-1.7-1.7 1.18-1.73a5.9 5.9 0 01-.53-1.19L1.6 11.2V8.8l2.05-.35c.14-.42.31-.82.53-1.19L3 5.53l1.7-1.7 1.73 1.18c.37-.22.77-.39 1.19-.53L8.8 1.6z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>

        <div style="display:flex;gap:8px;">

    </div>
    ${forecastColsPanelOpen ? `
      <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-modal">
          <div class="settings-head">
            <span>Configuración de columnas</span>
            <span class="settings-close" id="settingsClose">✕</span>
          </div>
          <div class="settings-sub">Marca las columnas que quieres ver. También puedes arrastrar el título de una columna en la tabla para moverla de sitio.</div>
          <div class="settings-list">
            ${forecastColOrder.map(k=>{
              const c = FORECAST_COLS.find(x=>x.key===k);
              if(!c) return '';
              return `<label class="settings-item ${c.fixed?'fixed':''}">
                <input type="checkbox" data-colvis="${c.key}" ${forecastColVisible[c.key]?'checked':''} ${c.fixed?'disabled':''}>
                <span>${c.label}</span>
                ${c.fixed?'<span class="cols-fixed-tag">fija</span>':''}
              </label>`;
            }).join('')}
          </div>
          <div class="settings-actions">
            <button class="toggle-inactive-btn" id="colsAllBtn">Mostrar todas</button>
            <button class="toggle-inactive-btn" id="colsResetBtn">Restablecer orden</button>
            <button class="save-btn" id="settingsSaveBtn" style="width:auto;padding:8px 18px;">Guardar</button>
          </div>
        </div>
      </div>
    ` : ''}
    <div id="printArea" style="display:none;"></div>
  `;

  document.getElementById('backBtn').onclick = ()=>{ screen='home'; renderScreen(); };
  document.getElementById('forecastSearchInput').oninput = (e)=>{ forecastSearch = e.target.value; renderScreen(); };

  document.getElementById('chipInactivos').onclick = ()=>{ forecastShowInactive = !forecastShowInactive; renderScreen(); };
  content.querySelectorAll('[data-obdmode]').forEach(chip=>{
    chip.onclick = ()=>{ forecastObdMode = chip.dataset.obdmode; renderScreen(); };
  });
  content.querySelectorAll('[data-horizon]').forEach(chip=>{
    chip.onclick = ()=>{ forecastHorizon = chip.dataset.horizon; renderScreen(); };
  });
  // El rótulo OR funciona como "desmarcar todos" del grupo, para marcar uno solo rápido
  content.querySelectorAll('[data-orcol]').forEach(el=>{
    el.onclick = ()=>{
      const col = el.dataset.orcol;
      const valores = [...content.querySelectorAll(`.filter-chip[data-chipcol="${col}"]`)].map(c=>c.dataset.chipval);
      const todosFuera = valores.every(v=>forecastColFilters[col].has(v));
      forecastColFilters[col] = todosFuera ? new Set() : new Set(valores);
      renderScreen();
    };
  });
  content.querySelectorAll('.filter-chip[data-chipcol]').forEach(chip=>{
    chip.onclick = ()=>{
      const col = chip.dataset.chipcol, val = chip.dataset.chipval;
      const set = forecastColFilters[col];
      if(set.has(val)) set.delete(val); else set.add(val);
      renderScreen();
    };
  });
  document.getElementById('clearFiltersBtn').onclick = ()=>{
    forecastSearch=''; forecastShowInactive=false; forecastHorizon='all';
    COLS.forEach(col=>forecastColFilters[col]=new Set());
    forecastOpenColFilter=null; forecastColFilterSearch='';
    renderScreen();
  };
  content.querySelectorAll('.col-filter-btn').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const col = btn.dataset.col;
      forecastOpenColFilter = (forecastOpenColFilter===col) ? null : col;
      forecastColFilterSearch = '';
      renderScreen();
    };
  });
  const colFilterClose = document.getElementById('colFilterClose');
  if(colFilterClose) colFilterClose.onclick = ()=>{ forecastOpenColFilter=null; renderScreen(); };
  const colFilterSearchInput = document.getElementById('colFilterSearchInput');
  if(colFilterSearchInput) colFilterSearchInput.oninput = (e)=>{ forecastColFilterSearch = e.target.value; renderScreen(); };
  const colFilterAllBtn = document.getElementById('colFilterAllBtn');
  if(colFilterAllBtn) colFilterAllBtn.onclick = ()=>{ forecastColFilters[forecastOpenColFilter] = new Set(); renderScreen(); };
  const colFilterNoneBtn = document.getElementById('colFilterNoneBtn');
  if(colFilterNoneBtn) colFilterNoneBtn.onclick = ()=>{
    forecastColFilters[forecastOpenColFilter] = new Set(distinctByCol[forecastOpenColFilter]);
    renderScreen();
  };
  content.querySelectorAll('.colfilter-only').forEach(el=>{
    el.onclick = ()=>{
      const val = el.dataset.onlyval;
      forecastColFilters[forecastOpenColFilter] = new Set(distinctByCol[forecastOpenColFilter].filter(v=>v!==val));
      renderScreen();
    };
  });
  content.querySelectorAll('.colfilter-item input[type=checkbox]').forEach(cb=>{
    cb.onchange = ()=>{
      const val = cb.dataset.colval;
      const set = forecastColFilters[forecastOpenColFilter];
      if(cb.checked) set.delete(val); else set.add(val);
      renderScreen();
    };
  });
  content.querySelectorAll('[data-goto-scanner]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      selectedId = parseInt(btn.dataset.gotoScanner);
      screen='mantenimiento'; pickerOpen.mant=false; scannerMenu='root'; showAssistant=false;
      renderScreen();
    };
  });
  content.querySelectorAll('[data-goto-scanner2]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      selectedId = parseInt(el.dataset.gotoScanner2);
      screen='mantenimiento'; pickerOpen.mant=false; scannerMenu='root'; showAssistant=false;
      renderScreen();
    };
  });
  document.getElementById('toggleAddPanelBtn').onclick = ()=>{ forecastAddPanelOpen = !forecastAddPanelOpen; renderScreen(); };
  document.getElementById('colsSettingsBtn').onclick = ()=>{ forecastColsPanelOpen = true; renderScreen(); };
  if(forecastColsPanelOpen){
    const closeSettings = ()=>{ forecastColsPanelOpen=false; saveColConfig(); renderScreen(); };
    const closeBtn = document.getElementById('settingsClose');
    if(closeBtn) closeBtn.onclick = closeSettings;
    const saveBtn = document.getElementById('settingsSaveBtn');
    if(saveBtn) saveBtn.onclick = closeSettings;
    const overlay = document.getElementById('settingsOverlay');
    if(overlay) overlay.onclick = (e)=>{ if(e.target===overlay) closeSettings(); };
    const allBtn = document.getElementById('colsAllBtn');
    if(allBtn) allBtn.onclick = ()=>{ FORECAST_COLS.forEach(c=>forecastColVisible[c.key]=true); saveColConfig(); renderScreen(); };
    const resetBtn = document.getElementById('colsResetBtn');
    if(resetBtn) resetBtn.onclick = ()=>{
      forecastColOrder = FORECAST_COLS.map(c=>c.key);
      FORECAST_COLS.forEach(c=>forecastColVisible[c.key]=true);
      saveColConfig();
      renderScreen();
    };
    content.querySelectorAll('[data-colvis]').forEach(cb=>{
      cb.onchange = ()=>{ forecastColVisible[cb.dataset.colvis] = cb.checked; saveColConfig(); renderScreen(); };
    });
  }
  // Reordenar columnas arrastrando directamente el título de la columna
  let dragColKey = null;
  content.querySelectorAll('[data-dragcol]').forEach(th=>{
    th.ondragstart = (e)=>{
      dragColKey = th.dataset.dragcol;
      th.classList.add('th-dragging');
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', dragColKey); }catch(err){}
    };
    th.ondragend = ()=>{
      th.classList.remove('th-dragging');
      content.querySelectorAll('[data-dragcol]').forEach(x=>x.classList.remove('th-drop-left','th-drop-right'));
    };
    th.ondragover = (e)=>{
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      if(!dragColKey || dragColKey===th.dataset.dragcol) return;
      const from = forecastColOrder.indexOf(dragColKey);
      const to = forecastColOrder.indexOf(th.dataset.dragcol);
      th.classList.remove('th-drop-left','th-drop-right');
      th.classList.add(to < from ? 'th-drop-left' : 'th-drop-right');
    };
    th.ondragleave = ()=>{ th.classList.remove('th-drop-left','th-drop-right'); };
    th.ondrop = (e)=>{
      e.preventDefault();
      th.classList.remove('th-drop-left','th-drop-right');
      const targetKey = th.dataset.dragcol;
      const src = dragColKey || (e.dataTransfer ? e.dataTransfer.getData('text/plain') : null);
      if(!src || src===targetKey) return;
      const from = forecastColOrder.indexOf(src);
      const to = forecastColOrder.indexOf(targetKey);
      if(from<0 || to<0) return;
      forecastColOrder.splice(from,1);
      forecastColOrder.splice(to,0,src);
      dragColKey = null;
      saveColConfig();
      renderScreen();
    };
  });
  const addRespBtnEl = document.getElementById('addRespBtn');
  if(addRespBtnEl) addRespBtnEl.onclick = ()=>{
    const val = document.getElementById('newRespInput').value.trim();
    if(val && !responsablesList.includes(val)){ responsablesList.push(val); renderScreen(); }
  };
  const addCentroBtnEl = document.getElementById('addCentroBtn');
  if(addCentroBtnEl) addCentroBtnEl.onclick = ()=>{
    const val = document.getElementById('newCentroInput').value.trim();
    if(val && !centrosList.includes(val)){ centrosList.push(val); renderScreen(); }
  };
  content.querySelectorAll('.amos-table th[data-key]').forEach(th=>{
    th.onclick = (e)=>{
      if(e.target.closest('.col-filter-btn')) return;
      const key = th.dataset.key;
      if(forecastSort.key===key) forecastSort.dir *= -1;
      else forecastSort = {key, dir:1};
      renderScreen();
    };
  });
  content.querySelectorAll('.amos-veh-row[data-vid]').forEach(row=>{
    row.onclick = ()=>{
      const vid = parseInt(row.dataset.vid);
      forecastExpandedVeh[vid] = !forecastExpandedVeh[vid];
      forecastCompletingTaskId = null;
      renderScreen();
    };
  });
  content.querySelectorAll('.amos-veh-row[data-tid2]').forEach(row=>{
    row.onclick = ()=>{
      const tid = parseInt(row.dataset.tid2);
      forecastExpandedTask[tid] = !forecastExpandedTask[tid];
      forecastCompletingTaskId = null;
      renderScreen();
    };
  });
  content.querySelectorAll('.refs-toggle').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const tid = parseInt(el.dataset.tid);
      forecastExpandedRefs[tid] = !forecastExpandedRefs[tid];
      renderScreen();
    };
  });
  content.querySelectorAll('.resp-select').forEach(sel=>{
    sel.onclick = (e)=>e.stopPropagation();
    sel.onchange = (e)=>{
      const v = vehicles.find(x=>x.id===parseInt(sel.dataset.vid));
      const t = v.tasks.find(x=>x.id===parseInt(sel.dataset.tid));
      if(t) t.responsable = e.target.value;
      renderScreen();
    };
  });
  content.querySelectorAll('.centro-select').forEach(sel=>{
    sel.onclick = (e)=>e.stopPropagation();
    sel.onchange = (e)=>{
      const v = vehicles.find(x=>x.id===parseInt(sel.dataset.vid));
      const t = v.tasks.find(x=>x.id===parseInt(sel.dataset.tid));
      if(t) t.centro = e.target.value;
      renderScreen();
    };
  });
  content.querySelectorAll('.mat-select').forEach(sel=>{
    sel.onclick = (e)=>e.stopPropagation();
    sel.onchange = (e)=>{
      const v = vehicles.find(x=>x.id===parseInt(sel.dataset.vid));
      const t = v.tasks.find(x=>x.id===parseInt(sel.dataset.tid));
      if(t) t.materiales = e.target.value;
      renderScreen();
    };
  });
  content.querySelectorAll('.horas-input').forEach(inp=>{
    inp.onclick = (e)=>e.stopPropagation();
    inp.onchange = (e)=>{
      const v = vehicles.find(x=>x.id===parseInt(inp.dataset.vid));
      const t = v.tasks.find(x=>x.id===parseInt(inp.dataset.tid));
      const val = parseFloat(e.target.value);
      if(t) t.horasParado = !isNaN(val) ? val : null;
      renderScreen();
    };
  });
  content.querySelectorAll('.notas-input').forEach(inp=>{
    inp.onclick = (e)=>e.stopPropagation();
    inp.onchange = (e)=>{
      const v = vehicles.find(x=>x.id===parseInt(inp.dataset.vid));
      const t = v.tasks.find(x=>x.id===parseInt(inp.dataset.tid));
      if(t) t.notas = e.target.value;
    };
  });
  const taskOf = (el)=>{
    const v = vehicles.find(x=>x.id===parseInt(el.dataset.vid));
    return v ? v.tasks.find(x=>x.id===parseInt(el.dataset.tid)) : null;
  };
  content.querySelectorAll('.matlibre-input').forEach(inp=>{
    inp.onclick = (e)=>e.stopPropagation();
    inp.onchange = (e)=>{ const t = taskOf(inp); if(t) t.materialesLibres = e.target.value; };
  });
  content.querySelectorAll('.plan-input').forEach(inp=>{
    inp.onclick = (e)=>e.stopPropagation();
    inp.onchange = (e)=>{ const t = taskOf(inp); if(t) t.planificado = e.target.value ? new Date(e.target.value) : null; };
  });
  content.querySelectorAll('.flim-input').forEach(inp=>{
    inp.onclick = (e)=>e.stopPropagation();
    inp.onchange = (e)=>{ const t = taskOf(inp); if(t && e.target.value) t.fechaLimite = new Date(e.target.value); renderScreen(); };
  });
  content.querySelectorAll('.kmlim-input').forEach(inp=>{
    inp.onclick = (e)=>e.stopPropagation();
    inp.onchange = (e)=>{ const t = taskOf(inp); const n = parseInt(e.target.value); if(t && !isNaN(n)) t.kmLimite = n; renderScreen(); };
  });
  content.querySelectorAll('.costeest-input').forEach(inp=>{
    inp.onclick = (e)=>e.stopPropagation();
    inp.onchange = (e)=>{ const t = taskOf(inp); const n = parseFloat(e.target.value); if(t) t.costeEstimado = !isNaN(n)?n:null; };
  });
  content.querySelectorAll('.costereal-input').forEach(inp=>{
    inp.onclick = (e)=>e.stopPropagation();
    inp.onchange = (e)=>{ const t = taskOf(inp); const n = parseFloat(e.target.value); if(t) t.costeReal = !isNaN(n)?n:null; };
  });
  content.querySelectorAll('.tipo-select').forEach(sel=>{
    sel.onclick = (e)=>e.stopPropagation();
    sel.onchange = (e)=>{ const t = taskOf(sel); if(t) t.tipo = e.target.value; renderScreen(); };
  });
  content.querySelectorAll('[data-complete-tid]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      forecastCompletingTaskId = parseInt(btn.dataset.completeTid);
      forecastExtendingTaskId = null;
      forecastCompleteForm = {fechaLimite:'', fechaPreaviso:'', kmIncrement:''};
      renderScreen();
    };
  });
  const confirmBtn = document.getElementById('confirmCompleteBtn');
  if(confirmBtn){
    confirmBtn.onclick = (e)=>{
      e.stopPropagation();
      const found = items.find(it=>it.t.id===forecastCompletingTaskId);
      const t = found.t, v = found.v;
      const newVals = {};
      if(t.limiteType==='km'){
        const inc = parseInt(document.getElementById('completeKmIncrement').value) || 0;
        newVals.kmLimite = Math.round(v.estimatedKm + inc);
      } else {
        const fl = document.getElementById('completeFechaLimite').value;
        const fp = document.getElementById('completeFechaPreaviso').value;
        newVals.fechaLimite = fl ? new Date(fl) : t.fechaLimite;
        newVals.fechaPreaviso = fp ? new Date(fp) : t.fechaPreaviso;
      }
      const costeRealVal = parseFloat(document.getElementById('completeCosteReal').value);
      if(!isNaN(costeRealVal)){
        t.costeReal = costeRealVal;
        // el coste real se registra como gasto del vehículo, para los informes
        v.gastos.push({fecha:new Date(), concepto:`${t.tipo}`, importe: costeRealVal});
      }
      const fileInput = document.getElementById('completeFactura');
      if(fileInput && fileInput.files && fileInput.files[0]){
        const reader = new FileReader();
        reader.onload = ev=>{ t.facturaFoto = ev.target.result; };
        reader.readAsDataURL(fileInput.files[0]);
      }
      completeTask(v, t, newVals);
      renderScreen();
    };
  }
  content.querySelectorAll('[data-extend-tid]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      forecastExtendingTaskId = parseInt(btn.dataset.extendTid);
      forecastCompletingTaskId = null;
      forecastExtendForm = {fechaLimite:'', fechaPreaviso:'', kmLimite:''};
      renderScreen();
    };
  });
  const confirmExtendBtn = document.getElementById('confirmExtendBtn');
  if(confirmExtendBtn){
    confirmExtendBtn.onclick = (e)=>{
      e.stopPropagation();
      const found = items.find(it=>it.t.id===forecastExtendingTaskId);
      const t = found.t, v = found.v;
      const newVals = {};
      if(t.limiteType==='km'){
        const km = parseInt(document.getElementById('extendKmLimite').value);
        newVals.kmLimite = !isNaN(km) ? km : t.kmLimite;
      } else {
        const fl = document.getElementById('extendFechaLimite').value;
        const fp = document.getElementById('extendFechaPreaviso').value;
        newVals.fechaLimite = fl ? new Date(fl) : t.fechaLimite;
        newVals.fechaPreaviso = fp ? new Date(fp) : t.fechaPreaviso;
      }
      extendTask(v, t, newVals);
      renderScreen();
    };
  }
  document.getElementById('exportExcelBtn').onclick = ()=>exportForecastToExcel(items);
  document.getElementById('exportPdfBtn').onclick = ()=>exportForecastToPdf(items);
}


function exportForecastToExcel(items){
  const data = items.map(it=>({
    'Matrícula': it.v.plate,
    'Licencia/VTC': it.v.licencia || '',
    'Tipo de vehículo': it.v.type,
    'Tarea': it.tarea,
    'Materiales': it.t.tipo==='Revisión' ? MATERIALES_REVISION[it.t.materiales||'A'] : (it.t.materialesLibres||''),
    'Referencias': it.t.tipo==='Revisión' ? revisionParts(it.t.materiales||'A').map(p=>`${p}: ${materialRefFor(it.v,p)}`).join(' | ') : '',
    'Fecha límite': it.t.fechaLimite ? formatDate(it.t.fechaLimite) : (it.t.kmLimite!=null ? formatKm(it.t.kmLimite) : ''),
    'Planificado': it.t.planificado ? formatDate(it.t.planificado) : '',
    'Horas parado': it.t.horasParado!=null ? it.t.horasParado : '',
    'Notas': it.t.notas || '',
    'Preaviso': it.t.fechaPreaviso ? formatDate(it.t.fechaPreaviso) : '',
    'Remanente': it.remanente.text,
    'Responsable': it.t.responsable || '',
    'Centro': it.t.centro || '',
    'Estado': it.remanente.sortValue < 0 ? 'VENCIDA' : (it.remanente.sortValue <= 30 ? 'PRÓXIMA' : 'OK'),
    'Activo': it.v.active===false ? 'NO' : 'SÍ'
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Previsión flota');
  XLSX.writeFile(wb, `prevision_flota_${new Date().toISOString().slice(0,10)}.xlsx`);
}

          </div>
        ` : ''}
      `;};
      tabBody = `
        <div style="font-size:11.5px;color:var(--muted);margin-bottom:10px;">Fotos o escaneados de la documentación del vehículo. El análisis por IA es una simulación de demo (no hay llamada real a Claude).</div>
        ${docSlot('fichaTecnica','Ficha técnica')}
        ${docSlot('permisoCirculacion','Permiso de circulación')}
        ${docSlot('licenciaVtc','Licencia / autorización VTC')}
        ${docSlot('otros','Otros documentos (seguro, ITV...)')}
      `;
    } else if(vehiculosSubTab==='materiales'){
      tabBody = `
        <div class="section-label" style="margin:0 0 4px 2px;">Materiales de este vehículo (${(v.materiales||[]).length})</div>
        <div style="font-size:11.5px;color:var(--muted);margin-bottom:10px;">Referencias y marcas habituales para el mantenimiento de esta matrícula (se usan también en Mantenimiento y en Previsión de flota).</div>
        ${(v.materiales||[]).map(m=>`
          <div class="material-row">
            <div style="flex:1;">
              <div class="material-part">${m.parte}</div>
              <div class="material-detail">${m.marca} · Ref: ${m.ref}</div>
            </div>
            <button class="material-del" data-mid="${m.id}">✕</button>
          </div>
        `).join('')}
        <button class="add-vehicle-btn" id="toggleMaterialForm">${vehiculosMaterialFormOpen?'✕ Cancelar':'+ Añadir material'}</button>
        ${vehiculosMaterialFormOpen ? `
          <div class="reg-form">
            <div class="form-row"><label>Pieza / recambio</label><input type="text" id="matParteInput" placeholder="Ej: Filtro de aire"></div>
            <div class="form-row"><label>Marca</label><input type="text" id="matMarcaInput" placeholder="Ej: Mann-Filter"></div>
            <div class="form-row"><label>Referencia</label><input type="text" id="matRefInput" placeholder="Ej: C 25 114"></div>
            <button class="save-btn" id="saveMaterialBtn">Guardar</button>
          </div>
        ` : ''}
      `;
    } else if(vehiculosSubTab==='mantenimiento'){
      const proyectado = Math.round(v.kmReal + v.avgKmDia * daysSinceDate(v.kmRealDate));
      const maintCard = (code, titulo)=>`
        <div class="mant-card">
          <div class="mant-card-title">${titulo}</div>
          <div class="mant-card-refs">
            ${revisionParts(code).map(p=>`${p}: ${materialRefFor(v,p)}`).join('<br>')}
          </div>
          ${vehiculosMaintCreating===code ? `
            <div class="reg-form">
              <div class="form-row"><label>Km límite de esta revisión</label><input type="number" id="maintKmInput_${code}" placeholder="Ej: ${v.estimatedKm+10000}" value="${vehiculosMaintForm.kmLimite}"></div>
              <button class="save-btn" data-maintsave="${code}">Crear revisión</button>
            </div>
          ` : `<button class="toggle-inactive-btn" data-maintcreate="${code}">+ Crear revisión (${code==='A'?'2':'4'} filtros)</button>`}
        </div>
      `;
      tabBody = `
        <div class="odo-box">
          <div class="odo-item">
            <div class="odo-label">Km reales</div>
            <div class="odo-value">${formatKm(v.kmReal)}</div>
            <div class="odo-sub">actualizado ${formatDate(v.kmRealDate)}</div>
          </div>
          <div class="odo-item">
            <div class="odo-label">Km estimados hoy</div>
            <div class="odo-value" style="color:var(--orange);">${formatKm(v.estimatedKm)}</div>
            <div class="odo-sub">uso medio: ${v.avgKmDia} km/día</div>
          </div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
          <button class="toggle-inactive-btn" id="odoManualBtn">Actualizar a mano</button>
          <button class="toggle-inactive-btn" id="odoLiveBtn">Sincronizar con datos en vivo</button>
          <button class="toggle-inactive-btn" id="odoAvgBtn">Recalcular por uso medio</button>
        </div>
        ${vehiculosOdoManualOpen ? `
          <div class="reg-form">
            <div class="form-row"><label>Km reales (lectura actual)</label><input type="number" id="odoManualInput" placeholder="Ej: ${v.kmReal}"></div>
            <button class="save-btn" id="odoManualSave">Guardar lectura</button>
          </div>
        ` : ''}
        <div class="reg-form" style="margin-bottom:14px;">
          <div class="form-row"><label>Uso medio estimado (km/día)</label><input type="number" id="avgKmDiaInput" value="${v.avgKmDia}"></div>
        </div>
        <div class="section-label" style="margin:4px 0 8px 2px;">Revisiones vinculadas a materiales</div>
        ${maintCard('A','Revisión 2 filtros')}
        ${maintCard('B','Revisión 4 filtros')}
      `;
    }

    inner = cabecera + tabBody;
  }

  content.innerHTML = `
    <div class="sub-header">
      <button class="back-btn" id="backBtn">← Volver</button>
      <div class="sub-title">Vehículos</div>
    </div>
    <div style="padding:16px;">${inner}</div>
  `;

  document.getElementById('backBtn').onclick = ()=>{ screen='home'; renderScreen(); };

  if(vehiculosMode==='lookup'){
    const buscarVeh = ()=>{ vehiculosBusqueda = document.getElementById('vehBuscar').value; renderScreen(); };
    document.getElementById('vehBuscarBtn').onclick = buscarVeh;
    document.getElementById('vehBuscar').onkeydown = e=>{ if(e.key==='Enter') buscarVeh(); };
    content.querySelectorAll('[data-vehtipo]').forEach(el=>{
      el.onclick = ()=>{ vehFiltroTipo = el.dataset.vehtipo; renderScreen(); };
    });
    content.querySelectorAll('[data-vehflota]').forEach(el=>{
      el.onclick = ()=>{ vehFiltroFlota = el.dataset.vehflota; renderScreen(); };
    });
    content.querySelectorAll('[data-openveh]').forEach(el=>{
      el.onclick = ()=>{
        vehiculosFoundId = parseInt(el.dataset.openveh);
        vehiculosMode='tasks'; vehiculosSubTab='tareas';
        vehiculosNewTaskOpen=false; vehiculosInactivating=false;
        renderScreen();
      };
    });
    document.getElementById('plateLookupBtn').onclick = ()=>{
      const plate = document.getElementById('plateLookupInput').value.trim();
      vehiculosPlateInput = plate;
      if(!plate) return;
      const found = vehicles.find(x=>x.plate.toLowerCase()===plate.toLowerCase());
      if(found){ vehiculosFoundId = found.id; vehiculosMode = 'tasks'; vehiculosNewTaskOpen=false; vehiculosInactivating=false; vehiculosSubTab='tareas'; }
      else { resetVehiculosDraft(plate); vehiculosMode = 'create'; }
      renderScreen();
    };
    document.getElementById('plateLookupInput').onkeydown = (e)=>{ if(e.key==='Enter') document.getElementById('plateLookupBtn').click(); };
    document.getElementById('newVehicleBtn').onclick = ()=>{
      resetVehiculosDraft(vehiculosPlateInput);
      vehiculosMode = 'create';
      renderScreen();
    };
  }

  if(vehiculosMode==='create'){
    document.getElementById('backToLookup').onclick = ()=>{ vehiculosMode='lookup'; renderScreen(); };
    ['fichaTecnica','permisoCirculacion','licenciaVtc','otros'].forEach(key=>{
      document.getElementById(`photo-${key}`).onchange = (e)=>{
        Array.from(e.target.files).forEach(f=>{ vehiculosDraft.photosByTipo[key].push({url:URL.createObjectURL(f), name:f.name}); });
        renderScreen();
      };
    });
    document.getElementById('saveDraftVehicle').onclick = ()=>{
      const plate = document.getElementById('draftPlate').value.trim() || vehiculosDraft.plate || '0000 XYZ';
      const type = document.getElementById('draftType').value;
      const licencia = document.getElementById('draftLicencia').value.trim();
      const otros = document.getElementById('draftOtros').value.trim();
      const itvVal = document.getElementById('draftItv').value;
      const seguroVal = document.getElementById('draftSeguro').value;
      const itv = itvVal ? new Date(itvVal) : null;
      const seguro = seguroVal ? new Date(seguroVal) : null;
      const extra = {
        marca: document.getElementById('draftMarca').value.trim(),
        modelo: document.getElementById('draftModelo').value.trim(),
        bastidor: document.getElementById('draftBastidor').value.trim(),
        anio: parseInt(document.getElementById('draftAnio').value) || null,
        motor: document.getElementById('draftMotor').value,
        cilindrada: document.getElementById('draftCilindrada').value.trim(),
        color: document.getElementById('draftColor').value.trim(),
        plazas: document.getElementById('draftPlazas').value.trim(),
        duenoTipo: document.getElementById('draftDuenoTipo').value,
        dueno: document.getElementById('draftDueno').value.trim(),
        responsable: document.getElementById('draftResponsable').value.trim(),
        flota: document.getElementById('draftFlota').value.trim(),
        conductores: document.getElementById('draftConductores').value.split(',').map(s=>s.trim()).filter(Boolean),
      };
      const v = createVehicle(plate, type, licencia, otros, itv, seguro, extra);
      v.photosByTipo = vehiculosDraft.photosByTipo;
      addLog(`${v.plate} → vehículo dado de alta en la flota`, 'clear');
      vehiculosFoundId = v.id; vehiculosMode = 'tasks'; vehiculosNewTaskOpen=false; vehiculosSubTab='tareas';
      renderScreen();
    };
  }

  if(vehiculosMode==='tasks'){
    const v = vehicles.find(x=>x.id===vehiculosFoundId);
    document.getElementById('backToLookup').onclick = ()=>{ vehiculosMode='lookup'; vehiculosPlateInput=''; renderScreen(); };
    document.getElementById('toggleActiveBtn').onclick = ()=>{
      if(v.active===false){ v.active=true; v.inactiveReason=''; addLog(`${v.plate} → reactivado`, 'clear'); renderScreen(); }
      else { vehiculosInactivating = !vehiculosInactivating; renderScreen(); }
    };
    const confirmBtn = document.getElementById('confirmInactiveBtn');
    if(confirmBtn) confirmBtn.onclick = ()=>{
      const reason = document.getElementById('inactiveReasonInput').value.trim() || 'Sin causa indicada';
      v.active = false; v.inactiveReason = reason; vehiculosInactivating=false;
      addLog(`${v.plate} → marcado como inactivo (${reason})`, 'fault');
      renderScreen();
    };
    content.querySelectorAll('.veh-tab[data-subtab]').forEach(tab=>{
      tab.onclick = ()=>{
        vehiculosSubTab = tab.dataset.subtab;
        vehiculosNewTaskOpen=false; vehiculosMaterialFormOpen=false; vehiculosOdoManualOpen=false; vehiculosMaintCreating=null; vehiculosOcrResult={}; vehiculosAskClaudeOpen=false;
        renderScreen();
      };
    });

    // ---- Tareas y vencimientos ----
    const toggleTaskFormBtn = document.getElementById('toggleTaskForm');
    if(toggleTaskFormBtn){
      toggleTaskFormBtn.onclick = ()=>{
        vehiculosNewTaskOpen = !vehiculosNewTaskOpen;
        vehiculosNewTask = {tipo:'ITV caducidad', limiteType:'fecha', fechaLimite:'', fechaPreaviso:'', kmLimite:'', horasParado:'', notas:'', costeEstimado:''};
        renderScreen();
      };
    }
    content.querySelectorAll('.task-del').forEach(btn=>{
      btn.onclick = ()=>{ v.tasks = v.tasks.filter(t=>t.id!==parseInt(btn.dataset.tid)); renderScreen(); };
    });
    const askClaudeVehBtn = document.getElementById('askClaudeVehBtn');
    if(askClaudeVehBtn) askClaudeVehBtn.onclick = ()=>{ vehiculosAskClaudeOpen = !vehiculosAskClaudeOpen; renderScreen(); };
    if(vehiculosNewTaskOpen){
      document.getElementById('taskTipoSelect').onchange = (e)=>{ vehiculosNewTask.tipo = e.target.value; renderScreen(); };
      content.querySelectorAll('.radio-opt[data-limite]').forEach(opt=>{
        opt.onclick = ()=>{ vehiculosNewTask.limiteType = opt.dataset.limite; renderScreen(); };
      });
      document.getElementById('saveTaskBtn').onclick = ()=>{
        const tipo = document.getElementById('taskTipoSelect').value;
        const limiteType = vehiculosNewTask.limiteType;
        const opts = {limiteType};
        if(limiteType==='fecha'){
          const fl = document.getElementById('taskFechaLimite').value;
          const fp = document.getElementById('taskFechaPreaviso').value;
          opts.fechaLimite = fl ? new Date(fl) : null;
          opts.fechaPreaviso = fp ? new Date(fp) : null;
        } else {
          opts.kmLimite = parseInt(document.getElementById('taskKmLimite').value) || 0;
        }
        if(tipo==='Revisión') opts.materiales = 'A';
        const horasVal = parseFloat(document.getElementById('taskHoras').value);
        opts.horasParado = !isNaN(horasVal) ? horasVal : null;
        opts.notas = document.getElementById('taskNotas').value.trim();
        const costeVal = parseFloat(document.getElementById('taskCoste').value);
        opts.costeEstimado = !isNaN(costeVal) ? costeVal : null;
        v.tasks.push(makeTask(tipo, opts));
        addLog(`${v.plate} → tarea añadida: ${tipo}`, 'clear');
        vehiculosNewTaskOpen = false;
        renderScreen();
      };
    }

    // ---- Guantera ----
    ['fichaTecnica','permisoCirculacion','licenciaVtc','otros'].forEach(key=>{
      const inp = document.getElementById(`guant-${key}`);
      if(inp) inp.onchange = (e)=>{
        v.photosByTipo[key] = v.photosByTipo[key] || [];
        Array.from(e.target.files).forEach(f=>{ v.photosByTipo[key].push({url:URL.createObjectURL(f), name:f.name}); });
        addLog(`${v.plate} → documento añadido a la guantera (${key})`, 'clear');
        renderScreen();
      };
    });
    content.querySelectorAll('[data-ocr-key]').forEach(btn=>{
      btn.onclick = ()=>{
        const key = btn.dataset.ocrKey;
        vehiculosOcrResult[key] = generateOcrFields(v, key);
        addLog(`${v.plate} → documento analizado con IA (OCR simulado): ${key}`, 'clear');
        renderScreen();
      };
    });
    content.querySelectorAll('[data-applydate]').forEach(btn=>{
      btn.onclick = ()=>{
        const tipo = btn.dataset.applydate;
        const fechaDetectada = vehiculosOcrResult.otros ? vehiculosOcrResult.otros['Fecha de caducidad detectada'] : new Date(Date.now()+30*86400000);
        let task = v.tasks.find(t=>t.tipo===tipo);
        if(!task){ task = makeTask(tipo, {limiteType:'fecha'}); v.tasks.push(task); }
        task.fechaLimite = fechaDetectada;
        task.fechaPreaviso = new Date(fechaDetectada.getTime() - 15*86400000);
        addLog(`${v.plate} → fecha de "${tipo}" actualizada desde el documento escaneado`, 'clear');
        renderScreen();
      };
    });

    // ---- Materiales ----
    const toggleMaterialFormBtn = document.getElementById('toggleMaterialForm');
    if(toggleMaterialFormBtn){
      toggleMaterialFormBtn.onclick = ()=>{ vehiculosMaterialFormOpen = !vehiculosMaterialFormOpen; renderScreen(); };
    }
    if(vehiculosMaterialFormOpen){
      document.getElementById('saveMaterialBtn').onclick = ()=>{
        const parte = document.getElementById('matParteInput').value.trim();
        const marca = document.getElementById('matMarcaInput').value.trim();
        const ref = document.getElementById('matRefInput').value.trim();
        if(!parte) return;
        v.materiales = v.materiales || [];
        v.materiales.push({id:nextMaterialId++, parte, marca:marca||'—', ref:ref||'—'});
        vehiculosMaterialFormOpen = false;
        renderScreen();
      };
    }
    content.querySelectorAll('.material-del').forEach(btn=>{
      btn.onclick = ()=>{ v.materiales = (v.materiales||[]).filter(m=>m.id!==parseInt(btn.dataset.mid)); renderScreen(); };
    });

    // ---- Mantenimiento (odómetro doble + revisiones vinculadas a materiales) ----
    const odoManualBtn = document.getElementById('odoManualBtn');
    if(odoManualBtn) odoManualBtn.onclick = ()=>{ vehiculosOdoManualOpen = !vehiculosOdoManualOpen; renderScreen(); };
    const odoLiveBtn = document.getElementById('odoLiveBtn');
    if(odoLiveBtn) odoLiveBtn.onclick = ()=>{
      syncKmFromLive(v);
      addLog(`${v.plate} → km reales sincronizados con datos en vivo (${formatKm(v.kmReal)})`, 'clear');
      renderScreen();
    };
    const odoAvgBtn = document.getElementById('odoAvgBtn');
    if(odoAvgBtn) odoAvgBtn.onclick = ()=>{
      syncKmFromAvgUsage(v);
      addLog(`${v.plate} → km estimados recalculados por uso medio (${formatKm(v.estimatedKm)})`, 'clear');
      renderScreen();
    };
    const odoManualSave = document.getElementById('odoManualSave');
    if(odoManualSave) odoManualSave.onclick = ()=>{
      const val = parseInt(document.getElementById('odoManualInput').value);
      if(!isNaN(val) && val>=0){
        syncKmManual(v, val);
        addLog(`${v.plate} → km reales actualizados a mano (${formatKm(val)})`, 'clear');
        vehiculosOdoManualOpen = false;
        renderScreen();
      }
    };
    const avgKmDiaInput = document.getElementById('avgKmDiaInput');
    if(avgKmDiaInput) avgKmDiaInput.onchange = (e)=>{
      const val = parseInt(e.target.value);
      if(!isNaN(val) && val>0) v.avgKmDia = val;
    };
    content.querySelectorAll('[data-maintcreate]').forEach(btn=>{
      btn.onclick = ()=>{
        vehiculosMaintCreating = btn.dataset.maintcreate;
        vehiculosMaintForm = {kmLimite: String(v.estimatedKm + 10000)};
        renderScreen();
      };
    });
    content.querySelectorAll('[data-maintsave]').forEach(btn=>{
      btn.onclick = ()=>{
        const code = btn.dataset.maintsave;
        const kmInput = document.getElementById(`maintKmInput_${code}`);
        const kmLimite = parseInt(kmInput.value) || (v.estimatedKm + 10000);
        v.tasks.push(makeTask('Revisión', {limiteType:'km', kmLimite, materiales:code, horasParado: code==='B' ? Math.round(randRange(4,8)*10)/10 : Math.round(randRange(2,4)*10)/10}));
        addLog(`${v.plate} → revisión creada (${code==='A'?'2':'4'} filtros), límite ${formatKm(kmLimite)}`, 'clear');
        vehiculosMaintCreating = null;
        renderScreen();
      };
    });
  }
}

// ============ PANTALLA: DAÑOS (diagrama 2D) ============
function carDiagramSVG(v){
  const dots = v.damagePoints.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="#E5342E" stroke="#fff" stroke-width="1" class="damage-dot" data-idx="${i}"/>`).join('');
  return `
  <svg viewBox="0 0 200 110" id="carSvg" style="width:100%;height:auto;background:#101012;border-radius:12px;border:1px solid var(--border);touch-action:none;">
    <ellipse cx="100" cy="95" rx="70" ry="6" fill="#000" opacity="0.4"/>
    <rect x="20" y="25" width="160" height="60" rx="20" fill="#2a2b2f" stroke="#4a4a50" stroke-width="1.5"/>
    <rect x="62" y="16" width="76" height="34" rx="10" fill="#35363c" stroke="#4a4a50" stroke-width="1.2"/>
    <line x1="100" y1="16" x2="100" y2="50" stroke="#4a4a50" stroke-width="1"/>
    <circle cx="40" cy="27" r="7" fill="#0a0a0b" stroke="#4a4a50"/>
    <circle cx="160" cy="27" r="7" fill="#0a0a0b" stroke="#4a4a50"/>
    <circle cx="40" cy="83" r="7" fill="#0a0a0b" stroke="#4a4a50"/>
    <circle cx="160" cy="83" r="7" fill="#0a0a0b" stroke="#4a4a50"/>
    ${dots}
  </svg>`;
}
function renderDamageScreen(){
  const content = document.getElementById('content');
  content.classList.remove('no-pad');
  const v = vehicles.find(x=>x.id===selectedId);

  if(!v){
    content.innerHTML = `
      <div class="sub-header">
        <button class="back-btn" id="backBtn">← Volver</button>
        <div class="sub-title">Daños</div>
      </div>
      <div style="padding:16px;">
        ${vehiclePickerHTML('damage')}
        <div style="color:var(--muted);font-size:12.5px;margin-top:10px;">Selecciona un vehículo de la lista para ver su diagrama de daños.</div>
      </div>
    `;
    document.getElementById('backBtn').onclick = ()=>{ screen='home'; renderScreen(); };
    wireVehiclePicker('damage');
    return;
  }

  const score = Math.max(0, 100 - v.damagePoints.length*12);
  const scoreColor = score>=70 ? 'var(--green)' : (score>=40 ? 'var(--orange)' : 'var(--red)');
  const scoreText = score>=70 ? 'buen estado' : (score>=40 ? 'estado regular' : 'mal estado');

  content.innerHTML = `
    <div class="sub-header">
      <button class="back-btn" id="backBtn">← Volver</button>
      <div class="sub-title">Daños</div>
    </div>
    <div style="padding:16px;">
      ${vehiclePickerHTML('damage')}

      <div class="damage-score-bar"><div class="damage-score-fill" style="width:${score}%;background:${scoreColor};"></div></div>
      <div class="damage-score-label" style="color:${scoreColor};">${score}% — ${scoreText}</div>

      ${carDiagramSVG(v)}
      <div class="damage-hint">Toca el diagrama para marcar un golpe. Toca un punto rojo para borrarlo.</div>
      <div class="damage-list">${v.damagePoints.length===0 ? 'Sin daños registrados en este vehículo.' : `${v.damagePoints.length} golpe(s) marcado(s).`}</div>
    </div>
  `;

  document.getElementById('backBtn').onclick = ()=>{ screen='home'; renderScreen(); };
  wireVehiclePicker('damage');

  const svg = document.getElementById('carSvg');
  svg.addEventListener('click', (e)=>{
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
    if(e.target.classList.contains('damage-dot')){
      const idx = parseInt(e.target.dataset.idx);
      v.damagePoints.splice(idx,1);
    } else {
      v.damagePoints.push({x:Math.round(loc.x), y:Math.round(loc.y)});
    }
    addLog(`${v.plate} → daños actualizados (${v.damagePoints.length} marcados)`, 'fault');
    renderScreen();
  });
}


// ============ PANTALLA: RECURSOS HUMANOS ============
let rrhhTab = 'plantilla';        // 'plantilla' | 'candidatos'
let rrhhFiltroRol = 'all';
let plantillaBusqueda = '';
let conductorFormOpen = false;
let conductorEditingId = null;
let candidatoFormOpen = false;
let candidatoEditingId = null;
let candidatoBusqueda = '';

function renderConductoresScreen(){
  const content = document.getElementById('content');

function rrhhPlantillaHTML(){
  const editing = conductorEditingId ? drivers.find(d=>d.id===conductorEditingId) : null;
  const esConductor = editing ? editing.rol==='Conductor' : true;
  const qp = plantillaBusqueda.trim().toLowerCase();
  const lista = drivers.filter(d=>{
    if(rrhhFiltroRol!=='all' && d.rol!==rrhhFiltroRol) return false;
    if(!qp) return true;
    const veh = vehicles.find(x=>x.id===d.vehicleId);
    return `${d.nombre} ${d.rol} ${d.telefono||''} ${d.email||''} ${d.direccion||''} ${d.notas||''} ${veh?veh.plate:''}`.toLowerCase().includes(qp);
  });
  const estadoColor = {Activo:'var(--green)', Vacaciones:'var(--orange)', Librando:'#6B7280', 'Baja laboral':'var(--red)'};

  const formHTML = !conductorFormOpen ? '' : `
    <div class="reg-form">

function wireRrhhPlantilla(){
  const content = document.getElementById('content');
  document.getElementById('toggleDriverForm').onclick = ()=>{
    conductorFormOpen = !conductorFormOpen; conductorEditingId = null; renderConductoresScreen();
  };
  const buscarPl = ()=>{ plantillaBusqueda = document.getElementById('plBuscar').value; renderConductoresScreen(); };
  document.getElementById('plBuscarBtn').onclick = buscarPl;
  document.getElementById('plBuscar').onkeydown = e=>{ if(e.key==='Enter') buscarPl(); };
  content.querySelectorAll('[data-rolfiltro]').forEach(el=>{
    el.onclick = ()=>{ rrhhFiltroRol = el.dataset.rolfiltro; renderConductoresScreen(); };
  });
  content.querySelectorAll('[data-editdrv]').forEach(btn=>{
    btn.onclick = ()=>{ conductorEditingId = parseInt(btn.dataset.editdrv); conductorFormOpen = true; renderConductoresScreen(); };
  });
  content.querySelectorAll('[data-histdrv]').forEach(btn=>{
    btn.onclick = ()=>{
      histDriverId = btn.dataset.histdrv;
      histAmbito='conductor'; histVehicleId='all'; histCentro='all'; histRango='all';
      screen='historial'; renderScreen();
    };
  });
  content.querySelectorAll('[data-deldrv]').forEach(btn=>{
    btn.onclick = ()=>{
      drivers = drivers.filter(d=>d.id!==parseInt(btn.dataset.deldrv));
      renderConductoresScreen();
    };
  });
  if(!conductorFormOpen) return;

  // el coche asignado solo tiene sentido para quien conduce
  const rolSel = document.getElementById('drvRol');
  const syncVehicleRow = ()=>{
    document.getElementById('drvVehicleRow').style.display = rolSel.value==='Conductor' ? '' : 'none';
  };
  rolSel.onchange = syncVehicleRow;
  syncVehicleRow();

  document.getElementById('saveDriverBtn').onclick = ()=>{
    const nombre = document.getElementById('drvNombre').value.trim();
    const direccion = document.getElementById('drvDireccion').value.trim();
    const errorEl = document.getElementById('drvFormError');
    if(!nombre || !direccion){
      errorEl.textContent = 'Nombre y dirección son obligatorios.';
      errorEl.style.display = 'block';
      return;
    }
    const rol = rolSel.value;
    const datos = {
      nombre, rol, direccion,
      telefono: document.getElementById('drvTelefono').value.trim(),
      email: document.getElementById('drvEmail').value.trim(),
      altaFecha: document.getElementById('drvAlta').value,
      estado: document.getElementById('drvEstado').value,
      turno: document.getElementById('drvTurno').value,
      horario: document.getElementById('drvHorario').value.trim(),
      notas: document.getElementById('drvNotas').value.trim(),
      vehicleId: rol==='Conductor' && document.getElementById('drvVehicle').value
        ? parseInt(document.getElementById('drvVehicle').value) : null,
    };
    if(conductorEditingId){
      Object.assign(drivers.find(d=>d.id===conductorEditingId), datos);
      addLog(`Personal actualizado: ${nombre} (${rol})`, 'clear');
    } else {
      const nuevo = Object.assign({
        id: nextDriverId++, diasTrabajados:0, diasBaja:0, diasLibres:0, diasAusencia:0
      }, datos);
      drivers.push(nuevo);
      addHistorial({
        fecha: datos.altaFecha ? new Date(datos.altaFecha+'T09:00:00') : new Date(),
        tipo:'Alta de personal', ambito:'conductor', driverId: nuevo.id, vehicleId: nuevo.vehicleId,
        centro:'', importe:0, descripcion:`Alta en plantilla como ${rol}`, horas:null, notas:''
      });
      addLog(`Personal dado de alta: ${nombre} (${rol})`, 'clear');
    }
    conductorFormOpen = false; conductorEditingId = null;
    renderConductoresScreen();
  };
}

function wireRrhhCandidatos(){
  const content = document.getElementById('content');
  document.getElementById('toggleCandidatoForm').onclick = ()=>{
    candidatoFormOpen = !candidatoFormOpen; candidatoEditingId = null; renderConductoresScreen();
  };
  const buscar = ()=>{ candidatoBusqueda = document.getElementById('cdBuscar').value; renderConductoresScreen(); };
  document.getElementById('cdBuscarBtn').onclick = buscar;
  document.getElementById('cdBuscar').onkeydown = e=>{ if(e.key==='Enter') buscar(); };

  content.querySelectorAll('[data-editcd]').forEach(btn=>{
    btn.onclick = ()=>{ candidatoEditingId = parseInt(btn.dataset.editcd); candidatoFormOpen = true; renderConductoresScreen(); };
  });
  content.querySelectorAll('[data-delcd]').forEach(btn=>{
    btn.onclick = ()=>{ candidatos = candidatos.filter(c=>c.id!==parseInt(btn.dataset.delcd)); renderConductoresScreen(); };
  });
  content.querySelectorAll('[data-hirecd]').forEach(btn=>{
    btn.onclick = ()=>{
      const c = candidatos.find(x=>x.id===parseInt(btn.dataset.hirecd));
      if(!c) return;
      c.estado = 'Contratado';
      const nuevo = {
        id: nextDriverId++, nombre:c.nombre, rol: ROLES_PERSONAL.includes(c.puesto)?c.puesto:'Otros',
        telefono:c.telefono, email:c.email, direccion:'(pendiente de completar)',
        turno:'Mañana', vehicleId:null, estado:'Activo', horario:'',
        altaFecha: toDateInputValue(new Date()), notas:`Procedente de candidatura · ${c.notas||''}`.trim(),
        diasTrabajados:0, diasBaja:0, diasLibres:0, diasAusencia:0
      };
      drivers.push(nuevo);
      addHistorial({
        tipo:'Alta de personal', ambito:'conductor', driverId:nuevo.id, vehicleId:null,
        centro:'', importe:0, descripcion:`Contratado como ${nuevo.rol} tras candidatura`, horas:null, notas:''
      });
      addLog(`${c.nombre} contratado como ${nuevo.rol}`, 'clear');
      showToast('Candidato contratado', `${c.nombre} se ha añadido a la plantilla. Completa su dirección en la ficha.`);
      rrhhTab = 'plantilla';
      renderConductoresScreen();
    };
  });

  if(!candidatoFormOpen) return;
  document.getElementById('saveCandidatoBtn').onclick = ()=>{
    const nombre = document.getElementById('cdNombre').value.trim();
    const errorEl = document.getElementById('cdFormError');
    if(!nombre){ errorEl.textContent='El nombre es obligatorio.'; errorEl.style.display='block'; return; }
    const datos = {
      nombre,
      puesto: document.getElementById('cdPuesto').value,
      telefono: document.getElementById('cdTelefono').value.trim(),
      email: document.getElementById('cdEmail').value.trim(),
      fechaCV: document.getElementById('cdFecha').value || toDateInputValue(new Date()),
      fuente: document.getElementById('cdFuente').value.trim(),
      estado: document.getElementById('cdEstado').value,
      notas: document.getElementById('cdNotas').value.trim(),
    };
    const file = document.getElementById('cdArchivo').files[0];
    const guardar = (archivo)=>{
      if(candidatoEditingId){
        const c = candidatos.find(x=>x.id===candidatoEditingId);
        Object.assign(c, datos, archivo?{cvArchivo:archivo}:{});
        addLog(`Candidato actualizado: ${nombre}`, 'clear');
      } else {
        const nuevo = Object.assign({id: nextCandidatoId++, cvArchivo: archivo||''}, datos);
        candidatos.push(nuevo);
        // el CV queda archivado en el histórico para poder buscarlo después
        addHistorial({
          fecha: new Date(datos.fechaCV+'T09:00:00'),
          tipo:'CV', ambito:'candidato', candidatoId:nuevo.id, driverId:null, vehicleId:null,
          centro:'', importe:0,
          descripcion:`CV de ${nombre} para ${datos.puesto}${datos.fuente?' · '+datos.fuente:''}${datos.notas?' · '+datos.notas:''}`,
          horas:null, notas:datos.estado
        });
        addLog(`CV recibido: ${nombre} (${datos.puesto})`, 'info');
      }
      candidatoFormOpen = false; candidatoEditingId = null;
      renderConductoresScreen();
    };
    if(file){
      const reader = new FileReader();
      reader.onload = ev=>guardar(ev.target.result);
      reader.readAsDataURL(file);
    } else guardar(null);
  };
}


// ============ PANTALLA: INFORMES ============
function renderInformesScreen(){
  const content = document.getElementById('content');
  content.classList.remove('no-pad');

  const eur = n => `${Math.round(n).toLocaleString('es-ES')} €`;
  const sum = (arr,f) => arr.reduce((s,x)=>s+(f?f(x):x),0);

  // --- Económico por coche ---
  const porCoche = vehicles.map(v=>{
    const ing = sum(v.ingresos||[], x=>x.importe);
    const gas = sum(v.gastos||[], x=>x.importe);
    return {v, ing, gas, margen: ing-gas};
  });
  const totalIng = sum(porCoche, x=>x.ing);
  const totalGas = sum(porCoche, x=>x.gas);

  // --- Económico por flota ---
  const flotasMap = {};
  porCoche.forEach(r=>{
    const f = r.v.flota || 'Sin flota';
    flotasMap[f] = flotasMap[f] || {ing:0, gas:0, coches:0, danos:0};
    flotasMap[f].ing += r.ing; flotasMap[f].gas += r.gas;
    flotasMap[f].coches++; flotasMap[f].danos += r.v.damagePoints.length;
  });

  // --- Daños por conductor (se imputan al conductor asignado al coche) ---
  const danosPorConductor = conductores().map(d=>{
    const veh = vehicles.find(v=>v.id===d.vehicleId);
    return {nombre:d.nombre, plate: veh?veh.plate:'—', danos: veh?veh.damagePoints.length:0};
  }).sort((a,b)=>b.danos-a.danos);

  const barra = (valor, max, color)=>{
    const pct = max>0 ? Math.round((valor/max)*100) : 0;
    return `<div class="inf-bar"><span style="width:${pct}%;background:${color};"></span></div>`;
  };

  const maxIng = Math.max(1, ...porCoche.map(r=>r.ing));
  const maxDanoCoche = Math.max(1, ...vehicles.map(v=>v.damagePoints.length));
  const maxDanoCond = Math.max(1, ...danosPorConductor.map(r=>r.danos));

  const statCard = (label, value, color)=>`
    <div class="inf-stat">
      <div class="inf-stat-v" style="color:${color||'var(--text)'};">${value}</div>
      <div class="inf-stat-l">${label}</div>
    </div>`;

  content.innerHTML = `
    <div class="sub-header">
      <button class="back-btn" id="backBtn">← Volver</button>
      <div class="sub-title">Informes</div>
    </div>
    <div style="padding:16px;">

      <div class="section-label" style="margin-bottom:9px;">Resumen económico · últimos 6 meses</div>
      <div class="inf-stats">
        ${statCard('Ingresos', eur(totalIng), 'var(--green)')}
        ${statCard('Gastos', eur(totalGas), 'var(--red)')}
        ${statCard('Margen', eur(totalIng-totalGas), totalIng-totalGas>=0?'var(--green)':'var(--red)')}
      </div>

      <div class="section-label" style="margin:20px 0 9px;">Por vehículo</div>
      <div class="inf-table-wrap">
        <table class="inf-table">
          <thead><tr><th>Matrícula</th><th>Flota</th><th>Ingresos</th><th>Gastos</th><th>Margen</th><th>Daños</th></tr></thead>
          <tbody>
            ${porCoche.sort((a,b)=>b.margen-a.margen).map(r=>`
              <tr>
                <td class="mono">${r.v.plate}</td>
                <td>${r.v.flota||'—'}</td>
                <td>${eur(r.ing)}${barra(r.ing, maxIng, 'var(--green)')}</td>
                <td>${eur(r.gas)}</td>
                <td style="color:${r.margen>=0?'var(--green)':'var(--red)'};font-weight:600;">${eur(r.margen)}</td>
                <td>${r.v.damagePoints.length}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>

      <div class="section-label" style="margin:20px 0 9px;">Por flota</div>
      <div class="inf-table-wrap">
        <table class="inf-table">
          <thead><tr><th>Flota</th><th>Coches</th><th>Ingresos</th><th>Gastos</th><th>Margen</th><th>Daños</th></tr></thead>
          <tbody>
            ${Object.keys(flotasMap).map(f=>{
              const x = flotasMap[f];
              return `<tr>
                <td style="font-weight:600;">${f}</td>
                <td>${x.coches}</td>
                <td>${eur(x.ing)}</td>
                <td>${eur(x.gas)}</td>
                <td style="color:${x.ing-x.gas>=0?'var(--green)':'var(--red)'};font-weight:600;">${eur(x.ing-x.gas)}</td>
                <td>${x.danos}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>

      <div class="section-label" style="margin:20px 0 9px;">Daños por vehículo</div>
      ${vehicles.slice().sort((a,b)=>b.damagePoints.length-a.damagePoints.length).map(v=>`
