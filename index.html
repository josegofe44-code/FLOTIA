<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>FLOTIA — App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=VT323&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#EEF1F5;
    --panel:#FFFFFF;
    --panel-alt:#F4F6F9;
    --border:#D7DCE3;
    --text:#22303F;
    --muted:#69758A;
    --orange:#0A6ED1;
    --red:#B00020;
    --green:#0E7D3C;
    --taxi-accent:#E9730C;
    --lcd-bg:#9FB08C;
    --lcd-bg-dark:#8CA079;
    --lcd-text:#243318;
    --font-display:'Inter',sans-serif;
    --font-lcd:'VT323',monospace;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:#DCE1E8;
    color:var(--text);
    font-family:var(--font-display);
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:440px;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    box-shadow:0 0 1px rgba(0,0,0,0.15);
  }
  header{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:space-between;
    padding:13px 16px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700;letter-spacing:0.3px;color:var(--text);}
  .brand .dot{width:7px;height:7px;border-radius:1px;background:var(--taxi-accent);}
  .header-right{display:flex;align-items:center;gap:10px;}
  .user-chip{font-size:11px;color:var(--muted);background:var(--panel-alt);border:1px solid var(--border);padding:5px 10px;border-radius:4px;white-space:nowrap;}
  .logout-btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:5px 10px;font-size:11px;font-family:var(--font-display);cursor:pointer;}
  .alert-pill{
    display:flex;align-items:center;gap:6px;
    background:rgba(176,0,32,0.08);border:1px solid rgba(176,0,32,0.3);
    color:var(--red);padding:5px 11px;border-radius:4px;font-size:11.5px;font-weight:600;
  }

  #content{flex:1 1 auto;overflow-y:auto;padding:16px;}
  #content.no-pad{padding:0;display:flex;flex-direction:column;}

  #log{
    flex:0 0 118px;
    border-top:1px solid var(--border);
    padding:8px 16px;
    overflow-y:auto;
    font-family:var(--font-mono);
    font-size:11px;
    background:var(--panel-alt);
  }
  #log h2{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:2px 0 6px 0;font-weight:600;}
  .log-line{padding:2px 0;color:var(--muted);border-bottom:1px dashed rgba(0,0,0,0.07);}
  .log-line .t{color:#9aa3b0;margin-right:8px;}
  .log-line.fault .t + span{color:var(--red);}
  .log-line.clear .t + span{color:var(--green);}
  .log-line.share .t + span{color:var(--orange);}

  /* ---- Matrícula ---- */
  .plate-es{display:inline-flex;align-items:stretch;border-radius:3px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,0.5);vertical-align:middle;}
  .plate-es .eu-band{width:13px;background:#003399;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:5px;line-height:1;padding:1px 0;}
  .plate-es .eu-band .stars{font-size:5px;}
  .plate-es .eu-band .cc{font-size:6px;font-weight:700;margin-top:1px;}
  .plate-es .plate-body{background:#fff;color:#111;display:flex;align-items:center;padding:0 6px;font-weight:700;letter-spacing:1.2px;font-family:Arial,'Helvetica Neue',sans-serif;}
  .plate-es.blue .plate-body{background:#0B3C8C;color:#fff;}
  .plate-es.sm{height:20px;}
  .plate-es.sm .plate-body{font-size:12px;}
  .plate-es.md{height:28px;}
  .plate-es.md .eu-band{width:16px;}
  .plate-es.md .plate-body{font-size:15px;}

  /* ---- Pantalla inicio ---- */
  .home-screen{display:flex;flex-direction:column;gap:14px;}
  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);font-weight:600;}
  .dropdown{background:var(--panel);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .dropdown-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 14px;cursor:pointer;
  }
  .dropdown-header .dh-left{display:flex;align-items:center;gap:10px;}
  .dropdown-header .dh-info{font-size:12.5px;color:var(--muted);}
  .chevron{font-size:11px;color:var(--muted);transition:transform 0.15s ease;}
  .chevron.open{transform:rotate(180deg);}
  .dropdown-list{border-top:1px solid var(--border);max-height:280px;overflow-y:auto;background:var(--panel-alt);}
  .search-input{
    width:100%;background:#fff;border:1px solid var(--border);border-radius:4px;
    color:var(--text);padding:9px 11px;font-family:var(--font-display);font-size:13px;margin-bottom:8px;
  }
  .veh-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);
  }
  .veh-row:hover{background:#EAEEF3;}
  .veh-row .vr-left{display:flex;align-items:center;gap:10px;}
  .veh-row .vr-meta{font-size:11.5px;color:var(--muted);}
  .status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .status-ok{background:var(--green);}
  .status-warn{background:var(--taxi-accent);}
  .status-fault{background:var(--red);}
  .appt-flag{font-size:9px;color:var(--orange);border:1px solid var(--orange);padding:0 5px;border-radius:3px;margin-left:6px;}

  /* ---- Previsión de flota — ventana estilo tabla AMOS ---- */
  .amos-window{background:#eef2f8;border-radius:6px;overflow:hidden;border:1px solid #b9c6d6;margin:12px;box-shadow:0 1px 4px rgba(0,0,0,0.1);}
  .amos-titlebar{background:#1e4fa8;color:#fff;padding:10px 14px;font-size:12.5px;font-weight:700;letter-spacing:0.3px;display:flex;align-items:center;gap:8px;}
  .amos-toolbar{padding:9px 10px;background:#dbe4f0;border-bottom:1px solid #b9c6d6;display:flex;gap:8px;flex-wrap:wrap;}
  .amos-toolbar input, .amos-toolbar select{border:1px solid #9fb0c6;border-radius:5px;padding:6px 8px;font-size:12px;background:#fff;color:#1a2b45;font-family:var(--font-display);}
  .amos-toolbar input{flex:1;min-width:120px;}
  .amos-table-wrap{overflow-x:auto;background:#fff;max-height:380px;overflow-y:auto;}
  table.amos-table{width:100%;border-collapse:collapse;font-size:11px;color:#1a2b45;min-width:540px;}
  .amos-table th{background:#c9d6e8;text-align:left;padding:7px 8px;font-size:9.5px;text-transform:uppercase;letter-spacing:0.3px;cursor:pointer;white-space:nowrap;border-bottom:1px solid #9fb0c6;position:sticky;top:0;user-select:none;}
  .amos-table th .arrow{font-size:9px;opacity:0.7;margin-left:3px;}
  .amos-table td{padding:6px 8px;border-bottom:1px solid #e2e8f0;white-space:nowrap;vertical-align:middle;}
  .amos-table tr:nth-child(even) td{background:#f4f7fb;}
  .amos-chip{font-size:9px;font-weight:700;padding:2px 7px;border-radius:9px;}
  .amos-footer{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:#dbe4f0;border-top:1px solid #b9c6d6;gap:8px;}
  .amos-count{font-size:10.5px;color:#41547a;}
  .amos-export-btn{background:#1e7d3c;color:#fff;border:none;border-radius:6px;padding:8px 13px;font-size:11.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:var(--font-display);}
  .amos-plate-cell{transform:scale(0.82);transform-origin:left center;}
  .plain-plate-cell{display:flex;align-items:center;gap:7px;}
  .plain-plate-text{font-family:var(--font-mono);font-weight:700;letter-spacing:0.4px;color:#1a2b45;font-size:11.5px;}

  /* ---- Módulo: Alta de vehículos ---- */
  .add-vehicle-btn{width:100%;background:var(--orange);color:#fff;border:none;border-radius:4px;padding:11px;font-family:var(--font-display);font-weight:600;font-size:13.5px;cursor:pointer;margin-bottom:12px;}
  .reg-form{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:14px;margin-bottom:12px;}
  .form-row{margin-bottom:10px;}
  .form-row label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:4px;}
  .form-row input, .form-row select{width:100%;background:#fff;border:1px solid var(--border);border-radius:4px;color:var(--text);padding:9px 10px;font-family:var(--font-display);font-size:13.5px;}
  .save-btn{width:100%;background:var(--green);color:#fff;border:none;border-radius:4px;padding:11px;font-weight:600;font-family:var(--font-display);cursor:pointer;font-size:13.5px;}
  .reg-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;margin-bottom:10px;overflow:hidden;}
  .reg-card-top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;}
  .reg-card-sub{display:flex;align-items:center;gap:8px;padding:0 14px 12px 14px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
  .date-input{background:#fff;border:1px solid var(--border);border-radius:4px;color:var(--text);padding:5px 8px;font-family:var(--font-mono);font-size:11.5px;}
  .reg-card-body{border-top:1px solid var(--border);padding:14px;}
  .reg-section-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600;margin-bottom:8px;}
  .photo-strip{display:flex;gap:8px;flex-wrap:wrap;}
  .photo-thumb{width:56px;height:56px;object-fit:cover;border-radius:4px;border:1px solid var(--border);}
  .photo-add{width:56px;height:56px;border:1px dashed var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted);cursor:pointer;}
  .doc-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
  .doc-row{background:var(--panel-alt);border:1px solid var(--border);border-radius:4px;padding:8px 10px;font-size:12px;}
  .doc-row.muted{color:var(--muted);}
  .doc-add-btn{display:inline-block;background:var(--panel-alt);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:9px 12px;font-size:12.5px;cursor:pointer;font-family:var(--font-display);}

  /* ---- Módulo: Daños ---- */
  .damage-score-bar{height:10px;background:var(--panel-alt);border-radius:6px;overflow:hidden;margin:14px 0 6px 0;}
  .damage-score-fill{height:100%;transition:width 0.3s ease;}
  .damage-score-label{font-size:13px;font-weight:700;margin-bottom:12px;}
  .damage-hint{font-size:11.5px;color:var(--muted);margin-top:10px;text-align:center;}
  .damage-list{margin-top:12px;font-size:12px;color:var(--muted);}

  /* ---- Módulo: Control de averías ---- */
  .maint-history{margin-top:16px;}
  .maint-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .maint-icon{font-size:20px;}
  .maint-row .mr-tipo{font-size:13px;font-weight:700;}
  .maint-row .mr-detail{font-size:11.5px;color:var(--muted);}

  .nav-buttons{display:flex;flex-direction:column;gap:10px;}

  /* ---- Previsión de flota (tipo AMOS Maintenance Forecast) ---- */
  .forecast-list{display:flex;flex-direction:column;}
  .forecast-row{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--border);}
  .fr-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .fr-meta{min-width:0;}
  .fr-meta .fr-type{font-size:12.5px;font-weight:700;}
  .fr-meta .fr-sub{font-size:10.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fr-right{text-align:right;flex-shrink:0;padding-left:8px;}
  .fr-date{font-family:var(--font-mono);font-size:11.5px;color:var(--text);}
  .fr-chip{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:9px;margin-top:3px;display:inline-block;}
  .nav-btn{
    display:flex;align-items:center;gap:14px;
    background:var(--panel);border:1px solid var(--border);border-radius:6px;
    padding:15px 16px;cursor:pointer;color:var(--text);
    font-family:var(--font-display);font-size:14.5px;font-weight:600;
  }
  .nav-btn .icon{font-size:20px;}
  .nav-btn .nb-sub{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px;}
  .nav-btn:active{background:var(--panel-alt);}
  .home-summary{font-size:12px;color:var(--muted);text-align:center;padding-top:4px;}

  /* ---- Subpantallas (mapa / scanner) ---- */
  .sub-header{
    display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--border);flex:0 0 auto;background:var(--panel);
  }
  .back-btn{
    background:var(--panel-alt);border:1px solid var(--border);color:var(--text);
    border-radius:4px;padding:7px 12px;font-family:var(--font-display);font-size:13px;font-weight:600;cursor:pointer;
  }
  .sub-title{font-size:14.5px;font-weight:700;}

  /* Mapa */
  #mapScreenBody{flex:1 1 auto;position:relative;}
  #leafletMap{position:absolute;inset:0;filter:grayscale(0.35) contrast(1.02);}
  .marker-label{font-family:var(--font-mono) !important;font-size:10px !important;color:#fff !important;background:rgba(34,48,63,0.9) !important;border:1px solid var(--border) !important;padding:1px 5px !important;box-shadow:none !important;}
  .leaflet-tooltip:before{display:none !important;}
  .leaflet-control-attribution{background:rgba(255,255,255,0.75) !important;color:var(--muted) !important;font-size:9px !important;}
  .map-selected-bar{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;border-top:1px solid var(--border);background:var(--panel);
  }
  .map-selected-bar .msb-btn{
    background:var(--orange);color:#fff;border:none;border-radius:4px;
    padding:8px 12px;font-family:var(--font-display);font-weight:600;font-size:12.5px;cursor:pointer;
  }

  /* Scanner */
  #scannerBody{padding:16px;flex:1 1 auto;overflow-y:auto;}
  .scanner{background:linear-gradient(180deg,#3d3e42,#232427);border-radius:8px;padding:13px;box-shadow:inset 0 0 0 1px #000, 0 3px 10px rgba(0,0,0,0.4);border:1px solid #050505;margin-top:4px;}
  .scanner-top{display:flex;align-items:center;justify-content:space-between;padding:0 4px 9px 4px;}
  .scanner-top .st-left{display:flex;align-items:center;gap:9px;}
  .scanner-brand{font-size:10px;letter-spacing:1.5px;color:#9a9ca1;text-transform:uppercase;font-weight:700;}
  .scanner-mil-sm{width:24px;height:16px;display:flex;align-items:center;justify-content:center;}
  .scanner-led{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:ledpulse 1.6s infinite;}
  @keyframes ledpulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
  .lcd-tabs{display:flex;gap:6px;margin:0 4px 8px 4px;}
  .lcd-tab{
    flex:1;text-align:center;padding:8px 4px;
    font-family:var(--font-display);font-size:10.5px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;
    color:#fff;
    background:radial-gradient(circle at 30% 25%, #38393c, #0c0c0d 75%);
    border:1px solid #000;border-radius:8px;cursor:pointer;
    box-shadow:0 3px 0 #000, 0 4px 6px rgba(0,0,0,0.55);
    text-shadow:0 1px 1px rgba(0,0,0,0.6);
  }
  .lcd-tab:active{transform:translateY(3px);box-shadow:inset 0 2px 3px rgba(0,0,0,0.6);}
  .lcd-tab.active{background:radial-gradient(circle at 30% 25%, #4a4b4f, #151516 75%);box-shadow:0 3px 0 #000, 0 0 10px rgba(255,255,255,0.15), inset 0 0 0 1px rgba(255,255,255,0.12);}
  .lcd-page-indicator{position:absolute;top:8px;right:10px;font-size:13px;opacity:0.6;z-index:1;}
  .lcd-screen{background:linear-gradient(180deg,var(--lcd-bg),var(--lcd-bg-dark));border-radius:4px;padding:16px 16px;box-shadow:inset 0 2px 6px rgba(0,0,0,0.35), inset 0 0 0 2px rgba(0,0,0,0.25);font-family:var(--font-lcd);color:var(--lcd-text);position:relative;overflow:hidden;min-height:230px;}
  .lcd-screen::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 1px, transparent 1px, transparent 3px);pointer-events:none;}
  .lcd-live-grid{display:flex;flex-direction:column;gap:2px;position:relative;z-index:1;}
  .lcd-live-row{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px dashed rgba(36,51,24,0.22);padding:3px 0;}
  .lcd-live-row .llr-label{font-size:15px;letter-spacing:0.5px;opacity:0.85;}
  .lcd-live-row .llr-value{font-size:22px;letter-spacing:1px;font-weight:400;}
  .lcd-live-row .llr-value.warn{position:relative;}
  .lcd-line{font-size:19px;letter-spacing:1px;line-height:1.35;position:relative;z-index:1;}
  .lcd-line.small{font-size:14px;opacity:0.85;}
  .lcd-code{font-weight:700;}
  .lcd-cursor{display:inline-block;width:8px;height:15px;background:var(--lcd-text);opacity:0.7;animation:cursorblink 1s infinite;vertical-align:middle;margin-left:2px;}
  @keyframes cursorblink{0%,49%{opacity:0.75;}50%,100%{opacity:0;}}
  .scanner-keys{display:flex;gap:6px;margin-top:10px;}
  .key{
    flex:1;
    background:radial-gradient(circle at 30% 25%, #333437, #0a0a0b 75%);
    border:1px solid #000;border-radius:8px;
    color:#fff;
    font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;
    padding:10px 4px;text-align:center;cursor:pointer;
    box-shadow:0 3px 0 #000, 0 4px 6px rgba(0,0,0,0.55);
    text-shadow:0 1px 1px rgba(0,0,0,0.6);
  }
  .key:active{transform:translateY(3px);box-shadow:inset 0 2px 3px rgba(0,0,0,0.6);}
  .key:disabled{opacity:0.3;cursor:not-allowed;}
  .key.active{background:radial-gradient(circle at 30% 25%, #4a4b4f, #151516 75%);box-shadow:0 3px 0 #000, 0 0 8px rgba(255,255,255,0.15), inset 0 0 0 1px rgba(255,255,255,0.12);}
  .key-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle;}

  /* ---- Asistente IA (Claude) ---- */
  .ai-btn{
    width:100%;margin-top:10px;
    background:radial-gradient(circle at 30% 25%, #333437, #0a0a0b 75%);
    border:1px solid #000;border-radius:8px;
    color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:11.5px;letter-spacing:0.6px;text-transform:uppercase;
    padding:12px 4px;cursor:pointer;
    box-shadow:0 3px 0 #000, 0 4px 6px rgba(0,0,0,0.55);
    text-shadow:0 1px 1px rgba(0,0,0,0.6);
  }
  .ai-btn:active{transform:translateY(3px);box-shadow:inset 0 2px 3px rgba(0,0,0,0.6);}
  .ai-panel{
    margin-top:12px;background:#1a1c22;border:1px solid #35384a;border-radius:12px;padding:14px;
  }
  .ai-panel-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;font-weight:700;color:#a3a8ff;text-transform:uppercase;letter-spacing:0.6px;}
  .ai-severity{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:9px;margin-bottom:8px;}
  .ai-code-block{margin-bottom:12px;}
  .ai-code-block:last-child{margin-bottom:0;}
  .ai-code-title{font-family:var(--font-mono);font-weight:700;font-size:12.5px;color:var(--text);margin-bottom:4px;}
  .ai-advice-text{font-size:12.5px;line-height:1.55;color:#d3d5e0;}
  .ai-disclaimer{font-size:10px;color:var(--muted);margin-top:10px;font-style:italic;}

  /* ---- Login GESTFLOTAS ---- */
  .login-screen{padding:32px 20px 24px;display:flex;flex-direction:column;min-height:100%;background:var(--panel);}
  .login-logo{text-align:center;margin-top:10px;margin-bottom:6px;}
  .login-logo-badge{
    width:48px;height:48px;margin:0 auto 14px;border-radius:4px;

// ---------- Helpers ----------
function statusClass(v){ if(v.dtcs.length>0) return 'fault'; if(v.temp>98) return 'warn'; return 'ok'; }
function statusColor(s){ return s==='fault' ? '#B00020' : (s==='warn' ? '#E9730C' : '#0E7D3C'); }
function daysUntil(date){ return Math.round((date - new Date())/86400000); }
function formatDate(date){ return date.toLocaleDateString('es-ES', {day:'2-digit',month:'short',year:'numeric'}); }
function urgencyInfo(days){
  if(days<0) return {color:'var(--red)', label:`VENCIDA (${Math.abs(days)}d)`};
  if(days<=7) return {color:'var(--red)', label:`en ${days} día${days===1?'':'s'}`};
  if(days<=30) return {color:'var(--orange)', label:`en ${days} días`};
  return {color:'var(--green)', label:`en ${days} días`};
}
function formatKm(km){ return Math.round(km).toLocaleString('es-ES') + ' km'; }
// Para tareas que vencen por km Y por fecha (p.ej. la revisión): calcula cuál de las dos
// se cumple antes, traduciendo los km restantes a "días equivalentes" según el uso medio,
// y usa el peor de los dos casos para decidir la urgencia.
function remanenteFecha(date){
  const daysLeft = daysUntil(date);
  return {
    text: daysLeft<0 ? `VENCIDA (${Math.abs(daysLeft)}d)` : `${daysLeft} días`,
    sortValue: daysLeft,
    info: urgencyInfo(daysLeft)
  };
}
function vehTypeIcon(type){
  if(type==='Taxi') return `<svg width="17" height="17" viewBox="0 0 24 24"><rect x="2" y="10" width="20" height="8" rx="2" fill="#FFC72C" stroke="#8a6d00" stroke-width="0.8"/><rect x="6" y="5" width="12" height="7" rx="2" fill="#FFC72C" stroke="#8a6d00" stroke-width="0.8"/><rect x="9" y="2" width="6" height="3" rx="1" fill="#111"/><circle cx="7" cy="18" r="2" fill="#222"/><circle cx="17" cy="18" r="2" fill="#222"/></svg>`;
  if(type==='VTC') return `<svg width="17" height="17" viewBox="0 0 24 24"><rect x="2" y="10" width="20" height="8" rx="2" fill="#161616" stroke="#000" stroke-width="0.8"/><rect x="6" y="5" width="12" height="7" rx="2" fill="#161616" stroke="#000" stroke-width="0.8"/><circle cx="7" cy="18" r="2" fill="#000"/><circle cx="17" cy="18" r="2" fill="#000"/></svg>`;
  if(type==='Furgoneta') return `<svg width="17" height="17" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="2" fill="#ffffff" stroke="#9aa3ad" stroke-width="1.1"/><circle cx="7" cy="18" r="2" fill="#333"/><circle cx="17" cy="18" r="2" fill="#333"/></svg>`;
  if(type==='Camión') return `<svg width="17" height="17" viewBox="0 0 24 24"><rect x="1" y="8" width="14" height="9" rx="1" fill="#ffffff" stroke="#9aa3ad" stroke-width="1.1"/><rect x="15" y="10" width="8" height="7" rx="1" fill="#dfe4ea" stroke="#9aa3ad" stroke-width="1.1"/><circle cx="6" cy="18" r="2" fill="#333"/><circle cx="18" cy="18" r="2" fill="#333"/></svg>`;
  return `<svg width="17" height="17" viewBox="0 0 24 24"><rect x="2" y="10" width="20" height="8" rx="2" fill="#9aa3ad" stroke="#6b7280" stroke-width="0.8"/><rect x="6" y="5" width="12" height="7" rx="2" fill="#9aa3ad" stroke="#6b7280" stroke-width="0.8"/><circle cx="7" cy="18" r="2" fill="#333"/><circle cx="17" cy="18" r="2" fill="#333"/></svg>`;
}

let newUserForm = {profile:'Particular', username:'', password:'', phone:'', email:''};
function attemptLogin(){
  const username = document.getElementById('loginUsername').value.trim().toLowerCase();
  const password = document.getElementById('loginPassword').value.trim();
  const user = appUsers.find(u=>u.username===username && u.password===password);
  if(user){
    loggedIn = true; currentUser = user; loginError=''; loginView='menu'; screen='home';
    addLog(`Sesión iniciada como ${user.username} (${user.profile})`, 'clear');
    renderScreen();
  } else {
    loginError = 'Usuario o contraseña incorrectos.';
    renderScreen();
  }
}
function attemptCreateUser(){
  const username = document.getElementById('newUsername').value.trim().toLowerCase();
  const password = document.getElementById('newPassword').value.trim();
  const phone = document.getElementById('newPhone').value.trim();
  const email = document.getElementById('newEmail').value.trim();
  if(!username || !password){ loginError = 'Usuario y contraseña son obligatorios.'; renderScreen(); return; }
  if(appUsers.find(u=>u.username===username)){ loginError = 'Ese usuario ya existe.'; renderScreen(); return; }
  const user = {username, password, profile:newUserForm.profile, phone, email};
  appUsers.push(user);
  addLog(`Usuario creado: ${username} (${user.profile})`, 'clear');
  newUserForm = {profile:'Particular', username:'', password:'', phone:'', email:''};
  loginError = '';
  loginView = 'login';
  renderScreen();
}
function attemptAdminAccess(){
  const pass = document.getElementById('adminPassword').value.trim();
  if(pass===ADMIN_PASSWORD){ loginView='adminList'; loginError=''; renderScreen(); }
  else { loginError = 'Contraseña de administrador incorrecta.'; renderScreen(); }
}

// ---- Cuadro de instrumentos estilo BMW (2005) — funcional, no decorativo ----
function carGauge(value, max, unit, redlineFrom, size){
  size = size || 112;
  const cx=size/2, cy=size/2+3, r=size*0.4;
  const sweepStart=-130, sweepEnd=130;
  const frac = Math.max(0, Math.min(1, value/max));
  const needleAngle = sweepStart + frac*(sweepEnd-sweepStart);
  function pt(angleDeg, radius){ const a=(angleDeg-90)*Math.PI/180; return [cx+radius*Math.cos(a), cy+radius*Math.sin(a)]; }
  let ticks = '';
  const nTicks = 10;
  for(let i=0;i<=nTicks;i++){
    const ang = sweepStart + (i/nTicks)*(sweepEnd-sweepStart);
    const isRed = redlineFrom!==undefined && (i/nTicks) >= redlineFrom;
    const [x1,y1] = pt(ang, r);
    const [x2,y2] = pt(ang, r-7);
    ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${isRed?'#E5342E':'#EDEAE0'}" stroke-width="2"/>`;
  }
  const [nx,ny] = pt(needleAngle, r-12);
  return `
  <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r+6}" fill="#040404" stroke="#4a4a4a" stroke-width="2"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#000"/>
    ${ticks}
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#FF7A1A" stroke-width="2.2" stroke-linecap="round" style="filter:drop-shadow(0 0 4px #FF7A1A);"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="#c9cace"/>
    <circle cx="${cx}" cy="${cy}" r="2.2" fill="#1a1a1a"/>
    <text x="${cx}" y="${cy+r-16}" text-anchor="middle" font-size="7.5" fill="#8a8a80" font-family="Arial">${unit}</text>
  </svg>`;
}
// mini reloj analógico de temperatura de refrigerante (zona fría-azul / caliente-roja, como el cuadro real)
function miniTempGauge(temp){
  const size=54, cx=27, cy=30, r=20;
  const sweepStart=-90, sweepEnd=90; // solo medio arco, como los relojes de temperatura reales
  const frac = Math.max(0, Math.min(1, (temp-40)/(120-40)));
  const needleAngle = sweepStart + frac*(sweepEnd-sweepStart);
  function pt(angleDeg, radius){ const a=(angleDeg-90)*Math.PI/180; return [cx+radius*Math.cos(a), cy+radius*Math.sin(a)]; }
  const [nx,ny] = pt(needleAngle, r-6);
  const [cxA,cyA] = pt(sweepStart, r);
  const [cxB,cyB] = pt(sweepEnd, r);
  return `
  <svg width="${size}" height="${size*0.68}" viewBox="0 0 ${size} ${size*0.68}">
    <path d="M ${cxA.toFixed(1)} ${cyA.toFixed(1)} A ${r} ${r} 0 0 1 ${cxB.toFixed(1)} ${cyB.toFixed(1)}" fill="none" stroke="#2a3a55" stroke-width="4"/>
    <path d="M ${pt(sweepStart+ (sweepEnd-sweepStart)*0.72,r)[0].toFixed(1)} ${pt(sweepStart+(sweepEnd-sweepStart)*0.72,r)[1].toFixed(1)} A ${r} ${r} 0 0 1 ${cxB.toFixed(1)} ${cyB.toFixed(1)}" fill="none" stroke="#5a2020" stroke-width="4"/>
    <text x="4" y="${cy+2}" font-size="7" fill="#6a8fc9" font-family="Arial">C</text>
    <text x="${size-9}" y="${cy+2}" font-size="7" fill="#c96a6a" font-family="Arial">H</text>
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#FF7A1A" stroke-width="2" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="2.5" fill="#c9cace"/>
  </svg>`;
}
function engineFaultLightSVG(active, big){
  const color = active ? '#FF7A1A' : '#3a352a';
  const glow = active ? `filter:drop-shadow(0 0 ${big?10:6}px #FF7A1A);` : '';
  const w = big ? 46 : 32, h = big ? 31 : 22;
  return `<svg width="${w}" height="${h}" viewBox="0 0 30 20" style="${glow}">
    <path d="M12,2 L18,2 L18,5 L20,5 L20,7 L22,7 L22,9 L24,9 L24,12 L22,12 L22,15 L20,15 L20,17 L10,17 L10,15 L8,15 L8,12 L10,12 L10,5 L12,5 Z" fill="${color}"/>
    <rect x="6" y="8" width="4" height="2" fill="${color}"/>
    <rect x="6" y="11" width="4" height="2" fill="${color}"/>
  </svg>`;
}
function instantConsumption(v){
  // simulación de consumo instantáneo: sube con RPM/carga, baja a ralentí/parado
  if(v.engineOff) return {value:'0.0', unit:'L/H'};
  if(v.speed===0) return {value: (v.rpm/1400).toFixed(1), unit:'L/H'};
  const base = 3.5 + (v.rpm/7000)*9 + (v.speed>100 ? 1.5 : 0);
  return {value: Math.max(3.2, Math.min(18, base)).toFixed(1), unit:'L/100KM'};
}
// ---- Cuadro de instrumentos (diseño propio: RPM + velocidad analógicos, testigo de motor central,
// mini-reloj de temperatura, y una tira digital con el resto de datos OBD en vivo) ----

// ============ PANTALLA: PREVISIÓN DE FLOTA (tabla tipo AMOS) ============

const MATERIALES_REVISION = {
  A: 'Aceite + 2 filtros',
  B: 'Aceite + 4 filtros'
};
let forecastSearch = '';
let forecastFilter = 'all'; // 'all' | 'overdue' | 'soon'
let forecastShowInactive = false;
let forecastSort = {key:'preaviso', dir:1};

function preavisoSortValue(v,t){
  if(t.fechaPreaviso) return daysUntil(t.fechaPreaviso);
  if(t.limiteType==='km' && t.kmLimite!=null) return Math.round((t.kmLimite - v.estimatedKm)/AVG_KM_PER_DAY);
  if(t.fechaLimite) return daysUntil(t.fechaLimite);
  return 999999;
}
function remanenteTask(v,t){
  if(t.limiteType==='km'){
    const kmLeft = Math.round((t.kmLimite||0) - v.estimatedKm);
    const virtualDays = Math.round(kmLeft/AVG_KM_PER_DAY);
    return {text:`${formatKm(kmLeft)}`, sortValue:virtualDays, info:urgencyInfo(virtualDays)};
  }
  if(!t.fechaLimite) return {text:'—', sortValue:999999, info:{color:'var(--muted)', label:'—'}};
  const daysLeft = daysUntil(t.fechaLimite);
  return {text: daysLeft<0?`VENCIDA (${Math.abs(daysLeft)}d)`:`${daysLeft} días`, sortValue:daysLeft, info:urgencyInfo(daysLeft)};
}
function buildForecastItems(){
  let items = [];
  vehicles.forEach(v=>{
    v.tasks.forEach(t=>{
      items.push({v, t, tarea:t.tipo, remanente:remanenteTask(v,t), preaviso:preavisoSortValue(v,t)});
    });
    if(v.appointment) items.push({v, t:{tipo:'Cita', limiteType:'fecha', fechaLimite:v.appointment.date, fechaPreaviso:null, responsable:'', centro:v.appointment.taller, materiales:null}, tarea:`Cita — ${v.appointment.taller}`, remanente:remanenteFecha(v.appointment.date), preaviso:daysUntil(v.appointment.date)});
  });
  return items;
}

function renderForecastScreen(){
  const content = document.getElementById('content');
  content.classList.add('no-pad');

  let items = buildForecastItems();

  if(!forecastShowInactive) items = items.filter(it => it.v.active!==false);

  // filtro por texto (matrícula, conductor, licencia o tarea)
  if(forecastSearch.trim()!==''){
    const q = forecastSearch.toLowerCase();
    items = items.filter(it => it.v.plate.toLowerCase().includes(q) || it.v.driver.toLowerCase().includes(q) || (it.v.licencia||'').toLowerCase().includes(q) || it.tarea.toLowerCase().includes(q));
  }
  // filtro por estado
  if(forecastFilter==='overdue') items = items.filter(it => it.remanente.sortValue < 0);
  if(forecastFilter==='soon') items = items.filter(it => it.remanente.sortValue >= 0 && it.remanente.sortValue <= 30);

  // orden por columna (por defecto: preaviso, de menor a mayor)
  items.sort((a,b)=>{
    let av, bv;
    if(forecastSort.key==='plate'){ av=a.v.plate; bv=b.v.plate; }
    else if(forecastSort.key==='tarea'){ av=a.tarea; bv=b.tarea; }
    else if(forecastSort.key==='licencia'){ av=a.v.licencia||''; bv=b.v.licencia||''; }
    else if(forecastSort.key==='responsable'){ av=a.t.responsable||''; bv=b.t.responsable||''; }
    else if(forecastSort.key==='centro'){ av=a.t.centro||''; bv=b.t.centro||''; }
    else if(forecastSort.key==='remanente'){ av=a.remanente.sortValue; bv=b.remanente.sortValue; }
    else { av=a.preaviso; bv=b.preaviso; }
    if(av<bv) return -1*forecastSort.dir;
    if(av>bv) return 1*forecastSort.dir;
    return 0;
  });

  function arrow(key){ return forecastSort.key===key ? `<span class="arrow">${forecastSort.dir===1?'▲':'▼'}</span>` : ''; }

  const rows = items.map(it=>{
    const info = it.remanente.info;
    const t = it.t;
    const materialesCell = t.tipo==='Revisión'
      ? `<select class="mat-select" data-vid="${it.v.id}" data-tid="${t.id}">
           <option value="A" ${t.materiales==='A'?'selected':''}>${MATERIALES_REVISION.A}</option>
           <option value="B" ${t.materiales==='B'?'selected':''}>${MATERIALES_REVISION.B}</option>
         </select>`
      : '—';
    return `
      <tr class="${it.v.active===false?'amos-inactive-row':''}">
        <td><span class="plain-plate-cell">${vehTypeIcon(it.v.type)}<span class="plain-plate-text">${it.v.plate}</span></span></td>
        <td>${it.v.licencia || '—'}</td>
        <td>${it.tarea}</td>
        <td>${materialesCell}</td>
        <td>${t.fechaLimite ? formatDate(t.fechaLimite) : (t.kmLimite!=null ? formatKm(t.kmLimite) : '—')}</td>
        <td>${t.fechaPreaviso ? formatDate(t.fechaPreaviso) : '—'}</td>
        <td style="color:${info.color};font-weight:700;">${it.remanente.text}</td>
        <td>
          <select class="resp-select" data-vid="${it.v.id}" data-tid="${t.id}">
            <option value="">—</option>
            ${responsablesList.map(r=>`<option value="${r}" ${t.responsable===r?'selected':''}>${r}</option>`).join('')}
          </select>
        </td>
        <td>
          <select class="centro-select" data-vid="${it.v.id}" data-tid="${t.id}">
            <option value="">—</option>
            ${centrosList.map(c=>`<option value="${c}" ${t.centro===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </td>
        <td><span class="amos-chip" style="color:${info.color};background:${info.color}22;border:1px solid ${info.color}55;">${info.label}</span></td>
      </tr>
    `;
  }).join('');

  content.innerHTML = `
    <div class="sub-header">
      <button class="back-btn" id="backBtn">← Volver</button>
      <div class="sub-title">Previsión de flota</div>
    </div>
    <div class="amos-window">
      <div class="amos-titlebar">📋 Tabla de previsión — Tareas de flota</div>
      <div class="amos-toolbar">
        <input type="text" id="forecastSearchInput" placeholder="Buscar por matrícula, licencia o tarea..." value="${forecastSearch}">
        <select id="forecastFilterSelect">
          <option value="all" ${forecastFilter==='all'?'selected':''}>Todas</option>
          <option value="overdue" ${forecastFilter==='overdue'?'selected':''}>Vencidas</option>
          <option value="soon" ${forecastFilter==='soon'?'selected':''}>Próximas 30 días</option>
        </select>
        <button class="toggle-inactive-btn ${forecastShowInactive?'is-inactive':''}" id="toggleInactiveBtn">${forecastShowInactive?'Ocultar inactivos':'Mostrar inactivos'}</button>
      </div>
      <div class="amos-toolbar" style="flex-direction:column;align-items:stretch;">
        <div style="display:flex;gap:8px;">
          <div style="flex:1;">
            <div style="font-size:9.5px;color:#41547a;margin-bottom:3px;">Añadir responsable</div>
            <div class="toolbar-addrow"><input type="text" id="newRespInput" placeholder="Nombre"><button id="addRespBtn">+</button></div>
          </div>
          <div style="flex:1;">
            <div style="font-size:9.5px;color:#41547a;margin-bottom:3px;">Añadir centro / taller</div>
            <div class="toolbar-addrow"><input type="text" id="newCentroInput" placeholder="Nombre"><button id="addCentroBtn">+</button></div>
          </div>
        </div>
      </div>
      <div class="amos-table-wrap">
        <table class="amos-table">
          <thead>
            <tr>
              <th data-key="plate">Matrícula${arrow('plate')}</th>
              <th data-key="licencia">Licencia/VTC${arrow('licencia')}</th>
              <th data-key="tarea">Tarea${arrow('tarea')}</th>
              <th>Materiales</th>
              <th>Fecha límite</th>
              <th>Preaviso</th>
              <th data-key="remanente">Remanente${arrow('remanente')}</th>
              <th data-key="responsable">Responsable${arrow('responsable')}</th>
              <th data-key="centro">Centro${arrow('centro')}</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>${rows || `<tr><td colspan="10" style="text-align:center;color:#7a8aa5;padding:18px;">Sin resultados</td></tr>`}</tbody>
        </table>
      </div>
      <div class="amos-footer">
        <div class="amos-count">${items.length} tarea${items.length===1?'':'s'}</div>
        <div style="display:flex;gap:8px;">
          <button class="amos-export-btn" id="exportExcelBtn">⬇ Excel</button>
          <button class="amos-export-btn" id="exportPdfBtn" style="background:#1e4fa8;">⬇ PDF</button>
        </div>
      </div>
    </div>
    <div id="printArea" style="display:none;"></div>
  `;

  document.getElementById('backBtn').onclick = ()=>{ screen='home'; renderScreen(); };
  document.getElementById('forecastSearchInput').oninput = (e)=>{ forecastSearch = e.target.value; renderScreen(); };
  document.getElementById('forecastFilterSelect').onchange = (e)=>{ forecastFilter = e.target.value; renderScreen(); };
  document.getElementById('toggleInactiveBtn').onclick = ()=>{ forecastShowInactive = !forecastShowInactive; renderScreen(); };
  document.getElementById('addRespBtn').onclick = ()=>{
    const val = document.getElementById('newRespInput').value.trim();
    if(val && !responsablesList.includes(val)){ responsablesList.push(val); renderScreen(); }
  };
  document.getElementById('addCentroBtn').onclick = ()=>{
    const val = document.getElementById('newCentroInput').value.trim();
    if(val && !centrosList.includes(val)){ centrosList.push(val); renderScreen(); }
  };
  content.querySelectorAll('.amos-table th[data-key]').forEach(th=>{
    th.onclick = ()=>{
      const key = th.dataset.key;
      if(forecastSort.key===key) forecastSort.dir *= -1;
      else forecastSort = {key, dir:1};
      renderScreen();
    };
  });
  content.querySelectorAll('.resp-select').forEach(sel=>{
    sel.onchange = (e)=>{
      const v = vehicles.find(x=>x.id===parseInt(sel.dataset.vid));
      const t = v.tasks.find(x=>x.id===parseInt(sel.dataset.tid)) || (v.appointment && {});
      if(t) t.responsable = e.target.value;
    };
  });
  content.querySelectorAll('.centro-select').forEach(sel=>{
    sel.onchange = (e)=>{
      const v = vehicles.find(x=>x.id===parseInt(sel.dataset.vid));
      const t = v.tasks.find(x=>x.id===parseInt(sel.dataset.tid));

  content.querySelectorAll('.mat-select').forEach(sel=>{

function exportForecastToExcel(items){
  const data = items.map(it=>({
    'Matrícula': it.v.plate,
    'Licencia/VTC': it.v.licencia || '',
    'Tipo de vehículo': it.v.type,
    'Tarea': it.tarea,
    'Materiales': it.t.tipo==='Revisión' ? MATERIALES_REVISION[it.t.materiales||'A'] : '',
    'Fecha límite': it.t.fechaLimite ? formatDate(it.t.fechaLimite) : (it.t.kmLimite!=null ? formatKm(it.t.kmLimite) : ''),
    'Preaviso': it.t.fechaPreaviso ? formatDate(it.t.fechaPreaviso) : '',
    'Remanente': it.remanente.text,
    'Responsable': it.t.responsable || '',
    'Centro': it.t.centro || '',
    'Estado': it.remanente.sortValue < 0 ? 'VENCIDA' : (it.remanente.sortValue <= 30 ? 'PRÓXIMA' : 'OK'),
    'Activo': it.v.active===false ? 'NO' : 'SÍ'
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Previsión flota');
  XLSX.writeFile(wb, `prevision_flota_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function exportForecastToPdf(items){
  const rows = items.map(it=>`
    <tr>
      <td>${it.v.plate}</td><td>${it.v.licencia||'—'}</td><td>${it.tarea}</td>

// ============ PANTALLA: VEHÍCULOS (buscar matrícula → tareas, o dar de alta) ============
function toIsoDate(d){ return d.toISOString().slice(0,10); }

const TASK_TIPOS = ['ITV caducidad','Seguro caducidad','Revisión','Cita programada en taller','Otros'];
let vehiculosPlateInput = '';
let vehiculosMode = 'lookup';   // 'lookup' | 'tasks' | 'create'
let vehiculosFoundId = null;
let vehiculosNewTaskOpen = false;
let vehiculosNewTask = {tipo:'ITV caducidad', limiteType:'fecha', fechaLimite:'', fechaPreaviso:'', kmLimite:''};
let vehiculosInactivating = false;
let vehiculosDraft = {plate:'', type:'Taxi', licencia:'', otros:'', itv:'', seguro:'', photosByTipo:{fichaTecnica:[],permisoCirculacion:[],licenciaVtc:[],otros:[]}};

function resetVehiculosDraft(plate){
  vehiculosDraft = {plate:plate||'', type:'Taxi', licencia:'', otros:'', itv:'', seguro:'', photosByTipo:{fichaTecnica:[],permisoCirculacion:[],licenciaVtc:[],otros:[]}};
}

function renderVehiculosScreen(){

  content.classList.remove('no-pad');

  if(vehiculosMode==='lookup'){
    inner = `

        ${d.photosByTipo[key].map(p=>`<img src="${p.url}" class="photo-thumb">`).join('')}

    inner = `
      <button class="login-back" id="backToLookup">← Cambiar matrícula</button>
      <div class="section-label" style="margin:6px 0 8px 2px;">Nuevo vehículo — ${d.plate}</div>
      <div class="reg-form">
        ${photoSlot('fichaTecnica','Ficha técnica')}
        ${photoSlot('permisoCirculacion','Permiso de circulación')}
        ${photoSlot('licenciaVtc','Licencia / autorización VTC')}
        ${photoSlot('otros','Otros documentos')}

        <div class="form-row" style="margin-top:14px;"><label>Tipo de vehículo</label>
          <select id="draftType">
            ${['Taxi','VTC','Particular','Furgoneta','Camión'].map(t=>`<option ${d.type===t?'selected':''}>${t}</option>`).join('')}

        <div class="form-row"><label>Licencia o autorización VTC</label><input type="text" id="draftLicencia" value="${d.licencia}" placeholder="Nº de licencia (si aplica)"></div>
        <div class="form-row"><label>Otros</label><input type="text" id="draftOtros" value="${d.otros}" placeholder="Notas adicionales"></div>
        <div class="form-row"><label>Fecha de caducidad ITV</label><input type="date" id="draftItv" value="${d.itv}"></div>
        <div class="form-row"><label>Fecha de caducidad del seguro</label><input type="date" id="draftSeguro" value="${d.seguro}"></div>
        <button class="save-btn" id="saveDraftVehicle">Guardar vehículo</button>
      </div>

  } else if(vehiculosMode==='tasks'){
    const v = vehicles.find(x=>x.id===vehiculosFoundId);
    const taskFormHTML = !vehiculosNewTaskOpen ? '' : `
      <div class="reg-form">
        <div class="form-row"><label>Tarea</label>
          <select id="taskTipoSelect">
            ${TASK_TIPOS.map(t=>`<option ${vehiculosNewTask.tipo===t?'selected':''}>${t}</option>`).join('')}

        </div>
        <div class="form-row">
          <label>Límite por</label>
          <div class="radio-toggle">
            <div class="radio-opt ${vehiculosNewTask.limiteType==='fecha'?'selected':''}" data-limite="fecha">Fecha</div>
            <div class="radio-opt ${vehiculosNewTask.limiteType==='km'?'selected':''}" data-limite="km">Km</div>
          </div>
        </div>

          <div class="form-row"><label>Fecha límite</label><input type="date" id="taskFechaLimite" value="${vehiculosNewTask.fechaLimite}"></div>
          <div class="form-row"><label>Fecha de preaviso</label><input type="date" id="taskFechaPreaviso" value="${vehiculosNewTask.fechaPreaviso}"></div>

      </div>

        <div class="reg-form">

      document.getElementById('taskTipoSelect').onchange = (e)=>{ vehiculosNewTask.tipo = e.target.value; renderScreen(); };

        if(limiteType==='fecha'){
          const fl = document.getElementById('taskFechaLimite').value;
          const fp = document.getElementById('taskFechaPreaviso').value;
          opts.fechaLimite = fl ? new Date(fl) : null;
          opts.fechaPreaviso = fp ? new Date(fp) : null;
        } else {
          opts.kmLimite = parseInt(document.getElementById('taskKmLimite').value) || 0;
        }
        if(tipo==='Revisión') opts.materiales = 'A';
        v.tasks.push(makeTask(tipo, opts));
        addLog(`${v.plate} → tarea añadida: ${tipo}`, 'clear');
        vehiculosNewTaskOpen = false;
        renderScreen();
      };
    }
  }
}

  <svg viewBox="0 0 200 110" id="carSvg" style="width:100%;height:auto;background:#101012;border-radius:12px;border:1px solid var(--border);touch-action:none;">

    <rect x="20" y="25" width="160" height="60" rx="20" fill="#2a2b2f" stroke="#4a4a50" stroke-width="1.5"/>
    <rect x="62" y="16" width="76" height="34" rx="10" fill="#35363c" stroke="#4a4a50" stroke-width="1.2"/>
    <line x1="100" y1="16" x2="100" y2="50" stroke="#4a4a50" stroke-width="1"/>
    <circle cx="40" cy="27" r="7" fill="#0a0a0b" stroke="#4a4a50"/>
    <circle cx="160" cy="27" r="7" fill="#0a0a0b" stroke="#4a4a50"/>
    <circle cx="40" cy="83" r="7" fill="#0a0a0b" stroke="#4a4a50"/>

  </svg>`;
}
function renderDamageScreen(){
  const content = document.getElementById('content');
  content.classList.remove('no-pad');
  const v = vehicles.find(x=>x.id===selectedId);
  const score = Math.max(0, 100 - v.damagePoints.length*12);
  const scoreColor = score>=70 ? 'var(--green)' : (score>=40 ? 'var(--orange)' : 'var(--red)');
  const scoreText = score>=70 ? 'buen estado' : (score>=40 ? 'estado regular' : 'mal estado');

  content.innerHTML = `
    <div class="sub-header">
      <button class="back-btn" id="backBtn">← Volver</button>
      <div class="sub-title">Daños</div>
    </div>
    <div style="padding:16px;">
      ${vehiclePickerHTML('damage')}

      <div class="damage-score-bar"><div class="damage-score-fill" style="width:${score}%;background:${scoreColor};"></div></div>
      <div class="damage-score-label" style="color:${scoreColor};">${score}% — ${scoreText}</div>

      ${carDiagramSVG(v)}
      <div class="damage-hint">Toca el diagrama para marcar un golpe. Toca un punto rojo para borrarlo.</div>
      <div class="damage-list">${v.damagePoints.length===0 ? 'Sin daños registrados en este vehículo.' : `${v.damagePoints.length} golpe(s) marcado(s).`}</div>
    </div>
  `;

  document.getElementById('backBtn').onclick = ()=>{ screen='home'; renderScreen(); };
  wireVehiclePicker('damage');

  const svg = document.getElementById('carSvg');
  svg.addEventListener('click', (e)=>{
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
    if(e.target.classList.contains('damage-dot')){
      const idx = parseInt(e.target.dataset.idx);
      v.damagePoints.splice(idx,1);
    } else {
      v.damagePoints.push({x:Math.round(loc.x), y:Math.round(loc.y)});
    }
    addLog(`${v.plate} → daños actualizados (${v.damagePoints.length} marcados)`, 'fault');
    renderScreen();
  });
}

// ============ Router ============
function renderScreen(){
  const logEl = document.getElementById('log');
  if(logEl) logEl.style.display = (screen==='login') ? 'none' : 'flex';
  renderHeader();
  if(screen==='login') renderLoginScreen();
  else if(screen==='home') renderHome();
  else if(screen==='map') renderMapScreen();
  else if(screen==='mantenimiento') renderMantenimientoScreen();
  else if(screen==='forecast') renderForecastScreen();
  else if(screen==='vehiculos') renderVehiculosScreen();
  else if(screen==='damage') renderDamageScreen();
  else if(screen==='materiales') renderMaterialesScreen();
  refreshAlertPill();
}

// ---------- Acciones ----------
function shareToWorkshop(v){
  addLog(`${v.plate} → diagnóstico compartido con Taller Central`, 'share');
  showToast('Compartido con el taller', `El diagnóstico de ${v.plate} (${v.dtcs.map(d=>d.code).join(', ')}) se ha enviado al taller.`);
}
function requestAppointment(v){
  const horas = ['09:30', '10:15', '12:00', '16:30', '17:45'];
  const date = new Date(Date.now() + Math.round(randRange(1,5))*86400000);
  v.appointment = { taller: pick(TALLERES), date, hora: pick(horas) };
  addLog(`${v.plate} → cita solicitada automáticamente en ${v.appointment.taller} (${formatDate(date)})`, 'share');
  showToast('Cita solicitada', `${v.plate} ha pedido cita en ${v.appointment.taller} para ${formatDate(date)} a las ${v.appointment.hora}.`);
  renderScreen();
}
function confirmClear(v){
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `<div class="modal"><h3>¿Borrar código de avería?</h3><p>Se enviará el comando de borrado (modo 04) al vehículo ${v.plate}.</p><div class="modal-buttons"><button class="btn-cancel">Cancelar</button><button class="btn-confirm">Borrar</button></div></div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('.btn-cancel').onclick = ()=>overlay.remove();
  overlay.querySelector('.btn-confirm').onclick = ()=>{
    const codes = v.dtcs.map(d=>d.code).join(', ');
    v.dtcs = []; v.appointment=null; overlay.remove();
    addLog(`${v.plate} → códigos borrados remotamente (${codes})`, 'clear');
    renderScreen();
  };
}
function showToast(title,text){
  const toast = document.createElement('div');
  toast.className='toast';
  toast.innerHTML = `<strong>${title}</strong>${text}`;
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 4200);
}

// ---------- Simulación en vivo ----------
function tick(){
  vehicles.forEach(v=>{
    v.lat += randRange(-0.0009,0.0009);
    v.lng += randRange(-0.0009,0.0009);
    if(v.engineOff){
      v.speed = 0;
      v.rpm = 0;
      v.voltage = Math.round(randRange(122,128))/10; // solo batería, motor parado
    } else {
      v.speed = Math.round(randRange(0,90));
      v.rpm = Math.round(randRange(750,3200));
      v.voltage = Math.round(randRange(133,144))/10;
      v.estimatedKm += v.speed * (2.2*SIM_KM_TIME_ACCEL/3600);
    }
    v.temp = Math.round(v.temp + randRange(-0.4,0.4));
    if(!v.engineOff && v.dtcs.length===0 && Math.random() < 0.012){
      const dtc = pick(DTC_LIBRARY);
      v.dtcs.push(dtc);
      addLog(`${v.plate} → nuevo código detectado: ${dtc.code} (${dtc.desc})`, 'fault');
    }
  });
  refreshMapMarkers();
  if(screen==='map') renderMapSelectedBar();
  if(screen==='mantenimiento') renderScreen();
  if(screen==='home') renderHome();
  refreshAlertPill();
}

addLog('Sesión de demo iniciada — datos simulados, sin conexión a vehículos reales.', 'info');
renderScreen();
setInterval(tick, 2200);
</script>
</body>
