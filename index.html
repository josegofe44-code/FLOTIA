// Franjas horarias de cada turno (jornadas de 12 h). La Tarde y la Noche cruzan medianoche.
const TURNO_FRANJAS = {
  'M': [[6,18]],
  'T': [[18,24],[0,6]],
  'N': [[22,24],[0,6]],
  'P': [[6,10],[18,22]],
};
function turnoCubreHora(turno, hora){
  const franjas = TURNO_FRANJAS[turno];
  if(!franjas) return false;
  return franjas.some(([ini,fin]) => hora>=ini && hora<fin);
}
// ¿Estaba el coche en un taller/centro ese día? Se mira en sus eventos planificados o vencidos ese día.
function tallerEseDia(v, fechaStr){
  if(!v) return null;
  const mismoDia = (d)=> d && toDateInputValue(d)===fechaStr;
  const t = (v.tasks||[]).find(t => !t.isObd && t.centro && (mismoDia(t.planificado) || mismoDia(t.fechaLimite)));
  return t ? {centro: t.centro, evento: t.tipo} : null;
}
// Determina quién respondía por el coche en esa fecha y hora
function responsableDeMulta(vehicleId, fechaStr, horaStr){
  const v = vehicles.find(x=>x.id===vehicleId);
  const hora = parseInt((horaStr||'00:00').split(':')[0]) || 0;

  const taller = tallerEseDia(v, fechaStr);
  if(taller){
    return {tipo:'taller', nombre: taller.centro, detalle: `El coche estaba en ${taller.centro} por ${taller.evento}`};
  }

  // Turno que cubre esa hora ese día
  for(const d of conductores()){
    const s = shifts[shiftKey(d.id, fechaStr)];
    if(!s || s.vehicleId!==vehicleId) continue;
    if(s.turno==='L' || s.turno==='—') continue;
    if(turnoCubreHora(s.turno, hora)){
      return {tipo:'conductor', nombre:d.nombre, driverId:d.id, detalle:`Turno de ${TURNO_NOMBRE[s.turno]} ese día`};
    }
  }
  // Si la hora es de madrugada, el turno de tarde/noche puede venir del día anterior
  if(hora < 6){
    const ayer = new Date(fechaStr+'T12:00:00');
    ayer.setDate(ayer.getDate()-1);
    const ayerStr = toDateInputValue(ayer);
    for(const d of conductores()){
      const s = shifts[shiftKey(d.id, ayerStr)];
      if(!s || s.vehicleId!==vehicleId) continue;
      if(s.turno==='T' || s.turno==='N'){
        return {tipo:'conductor', nombre:d.nombre, driverId:d.id, detalle:`Turno de ${TURNO_NOMBRE[s.turno]} iniciado el día anterior`};
      }
    }
  }
  // Sin cuadrante para ese día: se cae al conductor asignado al coche
  const asignado = conductores().find(d=>d.vehicleId===vehicleId);
  if(asignado){
    return {tipo:'conductor', nombre:asignado.nombre, driverId:asignado.id, detalle:'Sin turno registrado ese día; conductor asignado al coche'};
  }
  return {tipo:'desconocido', nombre:'Sin determinar', detalle:'No hay turno ni conductor asignado para ese coche'};
}

// Une el historial propio con las multas registradas, para verlo todo en una sola consola
function buildHistorialItems(){
  const items = historial.map(h=>({
    fecha: h.fecha, tipo: h.tipo, ambito: h.ambito, vehicleId: h.vehicleId,
    driverId: h.driverId, centro: h.centro||'', importe: h.importe||0,
    descripcion: h.descripcion||'', horas: h.horas, notas: h.notas||'',
    // un evento de coche NO es un evento del conductor y viceversa
    candidatoId: h.candidatoId || null,
    scopes: h.ambito==='candidato' ? ['candidato'] : (h.ambito==='conductor' ? ['conductor'] : ['vehiculo'])
  }));
  fines.forEach(m=>{
    items.push({
      fecha: new Date(m.fecha+'T'+(m.hora||'00:00')),
      tipo: 'Multa',
      ambito: m.responsableTipo==='taller' ? 'vehiculo' : 'conductor',
      vehicleId: m.vehicleId,
      driverId: m.driverId || null,
      centro: m.responsableTipo==='taller' ? m.responsableNombre : '',
      importe: m.importe||0,
      descripcion: `${m.concepto||'Multa'}${m.lugar?' · '+m.lugar:''} · responsable: ${m.responsableNombre}${m.puntos?` · −${m.puntos} pts`:''}`,
      horas: null, notas: m.pagada?'Pagada':'Pendiente',
      // una multa aparece tanto en la ficha del coche como en la del conductor
      scopes: m.driverId ? ['vehiculo','conductor'] : ['vehiculo']
    });
  });
  return items.filter(it=>it.fecha <= new Date());
}

function histTiposDisponibles(items){
  return [...new Set(items.map(i=>i.tipo))].sort();
}

function filtrarHistorial(items){
  let out = items.slice();
  if(histAmbito!=='todos') out = out.filter(i=>(i.scopes||[]).includes(histAmbito));
  // al filtrar por coche solo salen eventos del coche; al filtrar por conductor, solo los suyos
  if(histVehicleId!=='all'){
    out = out.filter(i=>(i.scopes||[]).includes('vehiculo') && String(i.vehicleId)===String(histVehicleId));
  }
  if(histDriverId!=='all'){
    out = out.filter(i=>(i.scopes||[]).includes('conductor') && String(i.driverId)===String(histDriverId));
  }
  if(histCentro!=='all') out = out.filter(i=>(i.centro||'—')===histCentro);
  if(histRango!=='all'){
    const desdeRango = new Date();
    desdeRango.setDate(desdeRango.getDate() - parseInt(histRango));
    out = out.filter(i=>i.fecha >= desdeRango);
  }
  if(histDesde) out = out.filter(i=>i.fecha >= new Date(histDesde+'T00:00:00'));
  if(histHasta) out = out.filter(i=>i.fecha <= new Date(histHasta+'T23:59:59'));
  out = out.filter(i=>!histTipos.has(i.tipo));
  if(histSearch.trim()){
    const q = histSearch.toLowerCase();
    out = out.filter(i=>{
      const v = vehicles.find(x=>x.id===i.vehicleId);
      const d = drivers.find(x=>x.id===i.driverId);
      return (i.tipo+' '+i.descripcion+' '+(i.centro||'')+' '+(v?v.plate:'')+' '+(d?d.nombre:'')).toLowerCase().includes(q);
    });
  }
  return out.sort((a,b)=>b.fecha-a.fecha);
}

    };
    th.ondragend = ()=>{
      th.classList.remove('th-dragging');
      content.querySelectorAll('[data-histdragcol]').forEach(x=>x.classList.remove('th-drop-left','th-drop-right'));
    };
    th.ondragover = e=>{
      e.preventDefault(); e.dataTransfer.dropEffect='move';
      if(!histDragKey || histDragKey===th.dataset.histdragcol) return;
      const from = histColOrder.indexOf(histDragKey);
      const to = histColOrder.indexOf(th.dataset.histdragcol);
      th.classList.remove('th-drop-left','th-drop-right');
      th.classList.add(to<from ? 'th-drop-left' : 'th-drop-right');
    };
    th.ondragleave = ()=>{ th.classList.remove('th-drop-left','th-drop-right'); };
    th.ondrop = e=>{
      e.preventDefault();
      th.classList.remove('th-drop-left','th-drop-right');
      const target = th.dataset.histdragcol;
      const src = histDragKey || (e.dataTransfer? e.dataTransfer.getData('text/plain') : null);
      if(!src || src===target) return;
      const from = histColOrder.indexOf(src), to = histColOrder.indexOf(target);
      if(from<0||to<0) return;
      histColOrder.splice(from,1);
      histColOrder.splice(to,0,src);
      histDragKey=null; histSaveColConfig(); renderHistorialScreen();
    };
  });
}

function historialToRows(items){
  return items.map(it=>{
    const v = vehicles.find(x=>x.id===it.vehicleId);
    const d = drivers.find(x=>x.id===it.driverId);
    return {
      'Fecha': formatDate(it.fecha),
      'Evento': it.tipo,
      'Matrícula': v?v.plate:'',
      'Flota': v?(v.flota||''):'',
      'Conductor': d?d.nombre:'',
      'Taller/centro': it.centro||'',
      'Importe (€)': it.importe||0,
      'Horas parado': it.horas!=null?it.horas:'',
      'Detalle': it.descripcion||'',
      'Notas': it.notas||''
    };
  });
}
function exportHistorialExcel(items){
  const ws = XLSX.utils.json_to_sheet(historialToRows(items));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Historial');
  XLSX.writeFile(wb, `historial_flotia_${new Date().toISOString().slice(0,10)}.xlsx`);
}
function exportHistorialPdf(items){
  const rows = historialToRows(items);
  const cols = rows.length ? Object.keys(rows[0]) : [];
  let titulo = 'Historial de eventos';
  if(histVehicleId!=='all'){
    const v = vehicles.find(x=>String(x.id)===String(histVehicleId));
    if(v) titulo += ` · ${v.plate}`;
  }
  if(histDriverId!=='all'){
    const d = drivers.find(x=>String(x.id)===String(histDriverId));
    if(d) titulo += ` · ${d.nombre}`;
  }
  if(histDesde || histHasta) titulo += ` · ${histDesde||'inicio'} a ${histHasta||'hoy'}`;
  document.getElementById('printArea').innerHTML = `
    <h2 style="font-family:Arial;font-size:15px;margin:0 0 4px;">${titulo}</h2>
    <div style="font-family:Arial;font-size:10px;color:#555;margin-bottom:10px;">
      ${rows.length} evento(s) · generado el ${new Date().toLocaleDateString('es-ES')}
    </div>
    <table style="width:100%;border-collapse:collapse;font-family:Arial;font-size:9px;">
      <thead><tr>${cols.map(c=>`<th style="border:1px solid #999;background:#e8edf5;padding:3px;text-align:left;">${c}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td style="border:1px solid #ccc;padding:3px;">${r[c]}</td>`).join('')}</tr>`).join('')}</tbody>
    </table>
  `;
  window.print();
}

            <span class="amos-chip" style="color:${m.pagada?'var(--green)':'var(--red)'};background:${m.pagada?'var(--green)':'var(--red)'}22;">${m.pagada?'PAGADA':'PENDIENTE'}</span>

  ['mtVehicle','mtFecha','mtHora','mtImporte','mtPuntos','mtConcepto','mtLugar'].forEach(id=>{
    document.getElementById(id).onchange = leerForm;
  });
  document.getElementById('mtBuscarBtn').onclick = ()=>{
    leerForm();
    if(!multasForm.vehicleId || !multasForm.fecha || !multasForm.hora){
      showToast('Faltan datos', 'Indica coche, fecha y hora para poder buscar al responsable.');
      return;
    }
    multasResuelto = responsableDeMulta(parseInt(multasForm.vehicleId), multasForm.fecha, multasForm.hora);

  document.getElementById('mtGuardarBtn').onclick = ()=>{

let nextCentroId = 1;
let centros = [

  {id:nextCentroId++, nombre:'AutoRápido Norte', tipo:'Taller', direccion:'C/ Bravo Murillo 240, Madrid', telefono:'915 444 555', contacto:'Ana P.', propio:false, notas:''},
  {id:nextCentroId++, nombre:'Mecánica Sur', tipo:'Taller', direccion:'Av. Córdoba 15, Madrid', telefono:'914 666 777', contacto:'', propio:false, notas:''},
];
let centroFormOpen = false;
let centroEditingId = null;
let centrosFiltroTipo = 'all';
let centrosBusqueda = '';

// La lista de centros de los eventos se alimenta de esta pantalla
function sincronizarCentrosList(){
  centrosList = centros.map(c=>c.nombre);
}

function renderCentrosScreen(){
  const content = document.getElementById('content');
  content.classList.remove('no-pad');
  const qc = centrosBusqueda.trim().toLowerCase();
  const lista = centros.filter(c=>{
    if(centrosFiltroTipo!=='all' && c.tipo!==centrosFiltroTipo) return false;
    if(!qc) return true;
    return `${c.nombre} ${c.tipo} ${c.direccion} ${c.telefono} ${c.contacto} ${c.notas}`.toLowerCase().includes(qc);
  });
  const editing = centroEditingId ? centros.find(c=>c.id===centroEditingId) : null;

  // cuántos eventos y qué gasto acumula cada centro
  const usoDe = (nombre)=>{
    const eventos = vehicles.reduce((n,v)=>n + (v.tasks||[]).filter(t=>t.centro===nombre).length, 0);
    const hist = historial.filter(h=>h.centro===nombre);
    const gasto = hist.reduce((s,h)=>s+(h.importe||0),0);
    return {eventos, cerrados:hist.length, gasto};
  };

  const formHTML = !centroFormOpen ? '' : `
    <div class="reg-form">
      <div class="multas-grid">
        <div class="form-row"><label>Nombre</label><input type="text" id="ctNombre" value="${editing?editing.nombre:''}" placeholder="Ej: Taller Central"></div>
        <div class="form-row"><label>Tipo</label>
          <select id="ctTipo">${TIPOS_CENTRO.map(t=>`<option ${editing&&editing.tipo===t?'selected':''}>${t}</option>`).join('')}</select>
        </div>
        <div class="form-row"><label>Teléfono</label><input type="tel" id="ctTelefono" value="${editing?editing.telefono:''}" placeholder="900 000 000"></div>
        <div class="form-row"><label>Persona de contacto</label><input type="text" id="ctContacto" value="${editing?editing.contacto:''}" placeholder="Nombre"></div>
        <div class="form-row" style="grid-column:1/-1;"><label>Dirección</label><input type="text" id="ctDireccion" value="${editing?editing.direccion:''}" placeholder="Calle, número, ciudad"></div>
        <div class="form-row" style="grid-column:1/-1;"><label>Notas</label><input type="text" id="ctNotas" value="${editing?editing.notas:''}" placeholder="Horario, condiciones, tarifas..."></div>
        <div class="form-row"><label>¿Es centro propio?</label>
          <select id="ctPropio">
            <option value="no" ${editing&&!editing.propio?'selected':''}>No</option>
            <option value="si" ${editing&&editing.propio?'selected':''}>Sí</option>
          </select>
        </div>
      </div>
      <div id="ctError" style="color:var(--red);font-size:11.5px;display:none;margin-bottom:8px;"></div>
      <button class="save-btn" id="ctSaveBtn">${editing?'Guardar cambios':'Dar de alta'}</button>
    </div>
  `;

  content.innerHTML = `
    <div class="sub-header">
      <button class="back-btn" id="backBtn">← Menú</button>
      <div class="sub-title">Centros</div>
    </div>
    <div style="padding:14px 16px;">
      <div style="font-size:11.5px;color:var(--muted);margin-bottom:10px;">Talleres, estaciones de ITV y cualquier otro proveedor al que lleves los coches. Los que des de alta aquí aparecen como opción de "Centro" al planificar eventos.</div>
      <button class="add-vehicle-btn" id="ctToggleForm">${centroFormOpen?'✕ Cancelar':'+ Dar de alta centro'}</button>
      ${formHTML}
      <div class="plate-lookup" style="margin:12px 0 10px;">
        <input type="text" id="ctBuscar" placeholder="Buscar por nombre, dirección, contacto..." value="${centrosBusqueda}">
        <button id="ctBuscarBtn">Buscar</button>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;">
        <span class="filter-chip ${centrosFiltroTipo==='all'?'':'off'}" data-ctfiltro="all" style="--chip-color:#41547a;">TODOS (${centros.length})</span>
        ${TIPOS_CENTRO.filter(t=>centros.some(c=>c.tipo===t)).map((t,i)=>
          `<span class="filter-chip ${centrosFiltroTipo===t?'':'off'}" data-ctfiltro="${t}" style="--chip-color:${paletteFor(i)};">${t.toUpperCase()} (${centros.filter(c=>c.tipo===t).length})</span>`).join('')}
      </div>
      ${lista.length===0 ? '<div style="color:var(--muted);font-size:12.5px;">Sin centros de este tipo.</div>' : lista.map(c=>{
        const uso = usoDe(c.nombre);
        return `
        <div class="task-row">
          <div class="task-row-top">
            <span class="task-tipo">${c.nombre}${c.propio?' <span class="amos-chip" style="color:var(--green);background:#0B7A5522;">PROPIO</span>':''}</span>
            <span class="amos-chip" style="color:var(--muted);background:var(--panel-alt);border:1px solid var(--border);">${c.tipo}</span>
          </div>
          <div class="task-meta">
            ${c.direccion || 'Sin dirección'}${c.telefono?' · '+c.telefono:''}${c.contacto?' · '+c.contacto:''}
            ${c.notas?`<br><span style="color:var(--muted);">${c.notas}</span>`:''}
            <br><span style="color:var(--muted);">${uso.eventos} evento(s) planificados · ${uso.cerrados} cerrados · ${Math.round(uso.gasto).toLocaleString('es-ES')} € facturados</span>
          </div>
          <div style="display:flex;gap:8px;margin-top:8px;">
            <button class="toggle-inactive-btn" data-ctedit="${c.id}">Editar</button>
            <button class="toggle-inactive-btn" data-cthist="${c.nombre}">Ver historial</button>
            <button class="task-del" data-ctdel="${c.id}">✕</button>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;

  document.getElementById('backBtn').onclick = ()=>{ screen='home'; renderScreen(); };
  document.getElementById('ctToggleForm').onclick = ()=>{
    centroFormOpen = !centroFormOpen; centroEditingId = null; renderCentrosScreen();
  };
  const buscarCentro = ()=>{ centrosBusqueda = document.getElementById('ctBuscar').value; renderCentrosScreen(); };
  document.getElementById('ctBuscarBtn').onclick = buscarCentro;
  document.getElementById('ctBuscar').onkeydown = e=>{ if(e.key==='Enter') buscarCentro(); };
  content.querySelectorAll('[data-ctfiltro]').forEach(el=>{
    el.onclick = ()=>{ centrosFiltroTipo = el.dataset.ctfiltro; renderCentrosScreen(); };
  });
  content.querySelectorAll('[data-ctedit]').forEach(el=>{
    el.onclick = ()=>{ centroEditingId = parseInt(el.dataset.ctedit); centroFormOpen = true; renderCentrosScreen(); };
  });
  content.querySelectorAll('[data-cthist]').forEach(el=>{
    el.onclick = ()=>{
      histCentro = el.dataset.cthist;
      histAmbito='todos'; histVehicleId='all'; histDriverId='all';
      screen='historial'; renderScreen();
    };
  });
  content.querySelectorAll('[data-ctdel]').forEach(el=>{
    el.onclick = ()=>{
      const c = centros.find(x=>x.id===parseInt(el.dataset.ctdel));
      const enUso = c && vehicles.some(v=>(v.tasks||[]).some(t=>t.centro===c.nombre));
      if(enUso){
        showToast('Centro en uso', `${c.nombre} tiene eventos asignados. Cámbialos de centro antes de borrarlo.`);
        return;
      }
      centros = centros.filter(x=>x.id!==parseInt(el.dataset.ctdel));
      sincronizarCentrosList();
      renderCentrosScreen();
    };
  });
  if(centroFormOpen){
    document.getElementById('ctSaveBtn').onclick = ()=>{
      const nombre = document.getElementById('ctNombre').value.trim();
      const err = document.getElementById('ctError');
      if(!nombre){ err.textContent = 'El nombre es obligatorio.'; err.style.display='block'; return; }
      const dup = centros.find(c=>c.nombre.toLowerCase()===nombre.toLowerCase() && c.id!==centroEditingId);
      if(dup){ err.textContent = 'Ya existe un centro con ese nombre.'; err.style.display='block'; return; }
      const datos = {
        nombre,
        tipo: document.getElementById('ctTipo').value,
        telefono: document.getElementById('ctTelefono').value.trim(),
        contacto: document.getElementById('ctContacto').value.trim(),
        direccion: document.getElementById('ctDireccion').value.trim(),
        notas: document.getElementById('ctNotas').value.trim(),
        propio: document.getElementById('ctPropio').value==='si',
      };
      if(centroEditingId){
        const c = centros.find(x=>x.id===centroEditingId);
        const anterior = c.nombre;
        Object.assign(c, datos);
        // si cambia el nombre, se actualiza en los eventos que ya lo usaban
        if(anterior!==datos.nombre){
          vehicles.forEach(v=>(v.tasks||[]).forEach(t=>{ if(t.centro===anterior) t.centro = datos.nombre; }));
          historial.forEach(h=>{ if(h.centro===anterior) h.centro = datos.nombre; });
        }
        addLog(`Centro actualizado: ${datos.nombre}`, 'clear');
      } else {
        centros.push(Object.assign({id: nextCentroId++}, datos));
        addLog(`Centro dado de alta: ${datos.nombre}`, 'clear');
      }
      sincronizarCentrosList();
      centroFormOpen = false; centroEditingId = null;
      renderCentrosScreen();
    };
  }
}

let turnosMes = new Date().getMonth();

let turnosFilters = {conductor:new Set(), matricula:new Set(), flota:new Set()};
function turnoChip(col, value, label, color, icon){
  const off = turnosFilters[col].has(value);

    return s && s.nota && s.nota.trim() && k.split('|')[1].startsWith(`${turnosAnio}-${String(turnosMes+1).padStart(2,'0')}`);
  }).length;

  // filas de conductores; si el filtro de notas está activo, solo los que tengan alguna
  const filas = conductores().filter(d=>{
    const info = turnosDatosDe(d);
    if(turnosFilters.conductor.has(d.nombre)) return false;
    if(turnosFilters.matricula.has(info.matricula)) return false;
    if(turnosFilters.flota.has(info.flota)) return false;
    if(!turnosSoloNotas) return true;
    return dias.some(day=>{

      return row;

    const ws = XLSX.utils.json_to_sheet(data);

    XLSX.writeFile(wb, `turnos_${turnosAnio}_${String(turnosMes+1).padStart(2,'0')}.xlsx`);
  };

// Genera el cuadrante del mes para un coche con uno o dos conductores en jornadas de 12 h
function generarTurnosMes(){
  const d1 = drivers.find(x=>String(x.id)===String(turnosGen.d1));
  if(!turnosGen.vehicleId || !d1){
    showToast('Faltan datos', 'Elige al menos el coche y el conductor 1.');
    return null;
  }
  const d2 = drivers.find(x=>String(x.id)===String(turnosGen.d2));
  const vehicleId = parseInt(turnosGen.vehicleId);
  const libresPorSemana = turnosGen.libres;
  const nDias = diasDelMes(turnosAnio, turnosMes);
  const otro = t => t==='M' ? 'T' : 'M';

  // Los días libres se reparten dentro de cada semana, escalonados entre los dos
  // conductores para que el coche siga saliendo cuando uno libra.
  const libraEseDia = (indiceEnSemana, offset)=>{
    if(libresPorSemana<=0) return false;
    if(libresPorSemana>=7) return true;
    for(let i=0;i<libresPorSemana;i++){
      const diaLibre = (6 - i - offset + 7) % 7;  // empieza por el final de la semana
      if(indiceEnSemana===diaLibre) return true;
    }
    return false;
  };

  for(let day=1; day<=nDias; day++){
    const fecha = new Date(turnosAnio, turnosMes, day);
    const ds = dateStrOf(turnosAnio, turnosMes, day);
    const semana = Math.floor((day-1)/7);          // las parejas alternan turno cada semana
    const indiceEnSemana = (fecha.getDay()+6)%7;   // 0 = lunes
    const turno1 = semana%2===0 ? turnosGen.inicio : otro(turnosGen.inicio);

    const libre1 = libraEseDia(indiceEnSemana, 0);
    shifts[shiftKey(d1.id, ds)] = Object.assign({}, shifts[shiftKey(d1.id, ds)] || {nota:''}, {
      turno: libre1 ? 'L' : turno1,
      vehicleId
    });

    if(d2){
      // el segundo conductor libra en días distintos al primero siempre que quepan en la semana
      const offset2 = (libresPorSemana>=7 || libresPorSemana*2>7) ? 1 : libresPorSemana;
      const libre2 = libraEseDia(indiceEnSemana, offset2);
      shifts[shiftKey(d2.id, ds)] = Object.assign({}, shifts[shiftKey(d2.id, ds)] || {nota:''}, {
        turno: libre2 ? 'L' : otro(turno1),
        vehicleId
      });
    }
  }
  const veh = vehicles.find(v=>v.id===vehicleId);
  return `${veh?veh.plate:''} · ${d1.nombre}${d2?' y '+d2.nombre:''} · ${libresPorSemana} día(s) libre(s)/semana`;
}

  renderHeader();

  else if(screen==='home') renderHome();
  else if(screen==='map') renderMapScreen();
  else if(screen==='mantenimiento') renderMantenimientoScreen();
  else if(screen==='forecast') renderForecastScreen();
  else if(screen==='vehiculos') renderVehiculosScreen();
  else if(screen==='damage') renderDamageScreen();
  else if(screen==='conductores') renderConductoresScreen();
  else if(screen==='informes') renderInformesScreen();
  else if(screen==='eventos') renderEventosScreen();
  else if(screen==='turnos') renderTurnosScreen();
  else if(screen==='eventoslive') renderEventosLiveScreen();
  else if(screen==='multas') renderMultasScreen();
  else if(screen==='historial') renderHistorialScreen();
  else if(screen==='centros') renderCentrosScreen();
  refreshAlertPill();
}

}
function requestAppointment(v){
  const horas = ['09:30', '10:15', '12:00', '16:30', '17:45'];
  const date = new Date(Date.now() + Math.round(randRange(1,5))*86400000);
  v.appointment = { taller: pick(TALLERES), date, hora: pick(horas) };
  addLog(`${v.plate} → cita solicitada automáticamente en ${v.appointment.taller} (${formatDate(date)})`, 'share');
  showToast('Cita solicitada', `${v.plate} ha pedido cita en ${v.appointment.taller} para ${formatDate(date)} a las ${v.appointment.hora}.`);
  renderScreen();
}
function confirmClear(v){
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `<div class="modal"><h3>¿Borrar código de avería?</h3><p>Se enviará el comando de borrado (modo 04) al vehículo ${v.plate}.</p><div class="modal-buttons"><button class="btn-cancel">Cancelar</button><button class="btn-confirm">Borrar</button></div></div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('.btn-cancel').onclick = ()=>overlay.remove();
  overlay.querySelector('.btn-confirm').onclick = ()=>{
    const codes = v.dtcs.map(d=>d.code).join(', ');
    v.dtcs = []; v.appointment=null; v.kmSinceClear = 0; v.kmWithMil = 0; overlay.remove();
    addLog(`${v.plate} → códigos borrados remotamente (${codes})`, 'clear');
    renderScreen();
  };
}
function showToast(title,text){
  const toast = document.createElement('div');
  toast.className='toast';
  toast.innerHTML = `<strong>${title}</strong>${text}`;
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 4200);
}

// ---------- Simulación en vivo ----------
function tick(){
  vehicles.forEach(v=>{
    v.lat += randRange(-0.0009,0.0009);
    v.lng += randRange(-0.0009,0.0009);
    if(v.engineOff){
      v.speed = 0;
      v.rpm = 0;
      v.voltage = Math.round(randRange(122,128))/10; // solo batería, motor parado
      v.runtimeSec = 0;
    } else {
      v.speed = Math.round(randRange(0,90));
      v.rpm = Math.round(randRange(750,3200));
      v.voltage = Math.round(randRange(133,144))/10;
      v.estimatedKm += v.speed * (2.2*SIM_KM_TIME_ACCEL/3600);
      v.runtimeSec = (v.runtimeSec||0) + Math.round(2.2*SIM_KM_TIME_ACCEL);
      v.kmSinceClear += v.speed * (2.2*SIM_KM_TIME_ACCEL/3600);
      if(v.dtcs.length>0) v.kmWithMil += v.speed * (2.2*SIM_KM_TIME_ACCEL/3600);
    }
    v.temp = Math.round(v.temp + randRange(-0.4,0.4));
    v.fuelLevel = Math.max(5, Math.round((v.fuelLevel - randRange(0,0.15))*10)/10);
    if(v.fuelLevel<=6 && Math.random()<0.05) v.fuelLevel = Math.round(randRange(70,95)); // repostaje simulado
    v.engineLoad = v.engineOff ? 0 : Math.max(0, Math.round(15 + v.speed*0.5 + randRange(-5,5)));
    v.throttlePos = v.engineOff ? 0 : Math.max(0, Math.round(8 + v.speed*0.4 + randRange(-4,4)));
    v.intakeAirTemp = Math.round(v.ambientTemp + randRange(2,10));
    v.maf = v.engineOff ? 0 : Math.round((3 + v.rpm/500 + randRange(-1,1))*10)/10;
    v.timingAdvance = v.engineOff ? 0 : Math.round(10 + randRange(-3,5));
    v.intakeManifoldPressure = v.engineOff ? Math.round(randRange(99,101)) : Math.round(30 + v.throttlePos*0.5 + randRange(-2,2));
    v.baroPressure = Math.round((v.baroPressure + randRange(-0.2,0.2))*10)/10;
    v.ambientTemp = Math.round((v.ambientTemp + randRange(-0.1,0.1))*10)/10;
    v.fuelTrimShort = Math.round((v.fuelTrimShort + randRange(-0.6,0.6))*10)/10;
    v.fuelTrimLong = Math.round((v.fuelTrimLong + randRange(-0.3,0.3))*10)/10;
    v.oilTemp = Math.round(v.oilTemp + randRange(-0.3,0.3));
    if(!v.engineOff && v.dtcs.length===0 && Math.random() < 0.012){
      const dtc = pick(DTC_LIBRARY);
      v.dtcs.push(dtc);
      addLog(`${v.plate} → nuevo código detectado: ${dtc.code} (${dtc.desc})`, 'fault');
    }
  });
  refreshMapMarkers();
  if(screen==='map') renderMapSelectedBar();
  if(screen==='mantenimiento') renderScreen();
  if(screen==='home') refreshHomeIfChanged();
  refreshAlertPill();
}

addLog('Sesión de demo iniciada — datos simulados, sin conexión a vehículos reales.', 'info');
renderScreen();
document.getElementById('logToggle').onclick = ()=>{
  document.getElementById('log').classList.toggle('open');
  renderLog();
};
loadColConfig();
histLoadColConfig();
sincronizarCentrosList();
setInterval(tick, 2200);
</script>
