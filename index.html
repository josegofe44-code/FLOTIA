<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>FLOTIA — App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=VT323&family=JetBrains+Mono:wght@500;700&family=Oswald:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F7F8FA;
    --panel:#FFFFFF;
    --panel-alt:#F2F4F7;
    --border:#E6E9EF;
    --border-strong:#D4D9E2;
    --text:#111827;
    --muted:#6B7480;
    --orange:#1B4DE4;
    --red:#C0223B;
    --green:#0B7A55;
    --taxi-accent:#C8841C;
    --shadow-sm:0 1px 2px rgba(16,24,40,0.05);
    --shadow-md:0 2px 8px rgba(16,24,40,0.07), 0 1px 2px rgba(16,24,40,0.04);
    --shadow-lg:0 8px 28px rgba(16,24,40,0.10), 0 2px 6px rgba(16,24,40,0.04);
    --radius:10px;
    --lcd-bg:#9FB08C;
    --lcd-bg-dark:#8CA079;
    --lcd-text:#243318;
    --font-display:'Inter',sans-serif;
    --font-lcd:'VT323',monospace;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:#E9EBF0;
    color:var(--text);
    font-family:var(--font-display);
    -webkit-font-smoothing:antialiased;
    letter-spacing:-0.01em;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:440px;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    box-shadow:0 0 0 1px rgba(16,24,40,0.04), 0 12px 40px rgba(16,24,40,0.10);
  }
  header{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:space-between;
    padding:15px 18px;
    background:rgba(255,255,255,0.85);
    backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;letter-spacing:0.02em;color:var(--text);}
  .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px rgba(27,77,228,0.13);}
  .header-right{display:flex;align-items:center;gap:10px;}
  .user-chip{font-size:11px;color:var(--muted);background:var(--panel-alt);border:1px solid var(--border);padding:5px 10px;border-radius:99px;white-space:nowrap;}
  .logout-btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:99px;padding:5px 11px;font-size:11px;font-family:var(--font-display);cursor:pointer;transition:background .15s,color .15s;}
  .logout-btn:hover{background:var(--panel-alt);color:var(--text);}
  .alert-pill{
    display:flex;align-items:center;gap:6px;
    background:rgba(176,0,32,0.08);border:1px solid rgba(176,0,32,0.3);
    color:var(--red);padding:5px 11px;border-radius:4px;font-size:11.5px;font-weight:600;
  }

  #content{flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px;}
  #content.no-pad{padding:0;display:flex;flex-direction:column;min-height:0;}

  /* Consola de eventos en vivo: pestañita abajo que despliega la consola */
  #log{
    flex:0 0 auto;
    display:flex;flex-direction:column;
    height:32px;
    border-top:1px solid var(--border);
    background:var(--panel-alt);
    font-family:var(--font-mono);
    font-size:11px;
    transition:height .24s cubic-bezier(.22,1,.36,1);
    overflow:hidden;
  }
  #log.open{height:172px;}
  #log h2{
    flex:0 0 auto;
    font-size:10px;text-transform:uppercase;letter-spacing:0.09em;color:var(--muted);
    margin:0;padding:0 16px;height:32px;font-weight:600;cursor:pointer;user-select:none;
    display:flex;align-items:center;gap:8px;
    font-family:var(--font-display);
    border-bottom:1px solid transparent;
  }
  #log.open h2{border-bottom-color:var(--border);color:var(--text);background:var(--panel);}
  #log h2:hover{color:var(--text);}
  #logPulse{width:6px;height:6px;border-radius:50%;background:var(--green);flex:0 0 auto;}
  #logCount{margin-left:auto;font-family:var(--font-mono);font-size:9.5px;color:var(--muted);}
  #logCaret{font-size:9px;transition:transform .24s ease;color:var(--muted);}
  #log.open #logCaret{transform:rotate(180deg);}
  #logList{flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px 16px 8px;}
  .log-line{padding:2px 0;color:var(--muted);border-bottom:1px dashed rgba(0,0,0,0.07);}
  .log-line .t{color:#9aa3b0;margin-right:8px;}
  .log-line.fault .t + span{color:var(--red);}
  .log-line.clear .t + span{color:var(--green);}
  .log-line.share .t + span{color:var(--orange);}

  /* ---- Matrícula ---- */
  .plate-es{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:3px;background:#F4F6F9;padding:2px 8px;font-family:var(--font-mono);font-weight:700;letter-spacing:0.6px;color:var(--text);vertical-align:middle;}
  .plate-es.blue{border-left:3px solid var(--orange);}
  .plate-es.sm{font-size:12px;padding:2px 7px;}
  .plate-es.md{font-size:15px;padding:4px 10px;}

  /* ---- Pantalla inicio ---- */
  .home-screen{display:flex;flex-direction:column;gap:14px;}
  .section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.09em;color:var(--muted);font-weight:600;}
  .dropdown{background:var(--panel);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .dropdown-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 14px;cursor:pointer;
  }
  .dropdown-header .dh-left{display:flex;align-items:center;gap:10px;}
  .dropdown-header .dh-info{font-size:12.5px;color:var(--muted);}
  .chevron{font-size:11px;color:var(--muted);transition:transform 0.15s ease;}
  .chevron.open{transform:rotate(180deg);}
  .dropdown-list{border-top:1px solid var(--border);max-height:280px;overflow-y:auto;background:var(--panel-alt);}
  .search-input{
    width:100%;background:#fff;border:1px solid var(--border);border-radius:4px;
    color:var(--text);padding:9px 11px;font-family:var(--font-display);font-size:13px;margin-bottom:8px;
  }
  .veh-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);
  }
  .veh-row:hover{background:#EAEEF3;}
  .veh-row .vr-left{display:flex;align-items:center;gap:10px;}
  .veh-row .vr-meta{font-size:11.5px;color:var(--muted);}
  .status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .status-ok{background:var(--green);}
  .status-warn{background:var(--taxi-accent);}
  .status-fault{background:var(--red);}
  .appt-flag{font-size:9px;color:var(--orange);border:1px solid var(--orange);padding:0 5px;border-radius:3px;margin-left:6px;}

  /* ---- Previsión de flota — ventana estilo tabla AMOS ---- */
  .amos-window{background:var(--panel);border-radius:12px;overflow:hidden;border:1px solid var(--border);margin:12px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;min-height:0;}
  .amos-titlebar{background:linear-gradient(180deg,#1B2333,#141B29);color:#fff;padding:10px 14px;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  .filter-titlebar{background:#c0392b;color:#fff;padding:6px 14px;font-size:11px;font-weight:700;letter-spacing:0.5px;text-align:center;flex:0 0 auto;}
  .filter-bar{display:flex;flex-wrap:wrap;align-items:stretch;background:#eef2f8;padding:8px 6px;border-bottom:1px solid #b9c6d6;overflow-x:auto;gap:2px 0;flex:0 0 auto;}
  .filter-group{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding:3px 12px;border-right:1px solid #c3cedd;flex:0 0 auto;min-height:44px;}
  .filter-group-label{font-size:8.5px;font-weight:700;color:#41547a;text-transform:uppercase;letter-spacing:0.4px;white-space:nowrap;}
  .filter-group-or{font-size:7.5px;color:#9aa5b8;font-style:italic;border-bottom:1px solid #c3cedd;padding:0 10px 2px;margin-bottom:1px;}
  .filter-group-or.clickable{cursor:pointer;user-select:none;transition:color .14s,border-color .14s;}
  .filter-group-or.clickable:hover{color:#B00020;border-bottom-color:#B00020;font-style:normal;font-weight:700;}
  .filter-chip-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:420px;}
  .filter-chip{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:32px;height:25px;padding:0 9px;border-radius:99px;background:var(--chip-color);color:#fff;font-size:9px;font-weight:600;letter-spacing:0.04em;cursor:pointer;border:none;white-space:nowrap;box-shadow:var(--shadow-sm);transition:opacity .15s;}
  .filter-chip-icon{width:13px;height:13px;flex-shrink:0;}
  .filter-chip.off{background:#e4e8ee;color:#9aa5b8;border-color:#d5dae2;}
  .filter-search-input{width:100%;border:1px solid #c3cedd;border-radius:4px;padding:5px 7px;font-size:11px;font-family:var(--font-display);}
  .amos-toolbar{padding:9px 10px;background:#dbe4f0;border-bottom:1px solid #b9c6d6;display:flex;gap:8px;flex-wrap:wrap;}
  .amos-toolbar input, .amos-toolbar select{border:1px solid #9fb0c6;border-radius:5px;padding:6px 8px;font-size:12px;background:#fff;color:#1a2b45;font-family:var(--font-display);}
  .amos-toolbar input{flex:1;min-width:120px;}
  .amos-table-wrap{overflow:auto;background:#fff;max-height:420px;flex:1 1 auto;min-height:0;}
  table.amos-table{width:100%;border-collapse:collapse;font-size:10px;color:#1a2b45;min-width:540px;}
  .amos-table th{background:var(--panel-alt);color:var(--muted);text-align:left;padding:6px 6px;font-size:8.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;cursor:pointer;white-space:nowrap;border:1px solid var(--border);border-top:none;position:sticky;top:0;user-select:none;}
  .amos-table th .arrow{font-size:8px;opacity:0.7;margin-left:2px;}
  .amos-table td{padding:0 5px;border:1px solid var(--border);white-space:nowrap;vertical-align:middle;line-height:1.1;height:15px;font-size:9px;color:var(--text);}
  .amos-veh-row{cursor:pointer;}
  .amos-veh-row:hover{background:#eef2f8;}
  .amos-veh-row:hover td{background:#eef2f8;}
  .row-expand{display:inline-block;width:12px;color:#5a6b85;font-size:10px;}
  .amos-detail-row td{padding:0;white-space:normal;background:#f6f8fb;}
  .amos-detail-wrap{padding:10px 14px;display:flex;flex-direction:column;gap:8px;}
  .amos-detail-wrap .task-row{background:#fff;}
  .refs-toggle{display:inline-block;margin-left:8px;font-size:10.5px;color:var(--orange);cursor:pointer;font-weight:600;}
  .obd-goto-link{color:var(--red);cursor:pointer;font-weight:600;text-decoration:underline;}
  .col-head-row{display:flex;align-items:center;justify-content:space-between;gap:4px;}
  .col-filter-btn{font-size:9px;color:#5a6b85;cursor:pointer;padding:1px 3px;}
  .col-filter-btn.active{color:#fff;background:#1e4fa8;border-radius:2px;}
  .colfilter-panel{background:#fff;border-bottom:1px solid #b9c6d6;padding:10px;}
  .colfilter-head{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;color:#1a2b45;margin-bottom:6px;}
  .colfilter-close{font-size:10px;color:var(--red);cursor:pointer;font-weight:600;}
  .colfilter-search{width:100%;border:1px solid #c3cedd;border-radius:4px;padding:6px 8px;font-size:11.5px;font-family:var(--font-display);margin-bottom:6px;}
  .colfilter-quickrow{display:flex;gap:12px;margin-bottom:6px;}
  .colfilter-quickbtn{font-size:10.5px;color:#1e4fa8;font-weight:700;cursor:pointer;}
  .colfilter-list{max-height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
  .colfilter-item{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:#2a3b55;padding:2px 0;}
  .colfilter-item label{display:flex;align-items:center;gap:6px;cursor:pointer;}
  .colfilter-only{font-size:9.5px;color:#8a97ad;cursor:pointer;white-space:nowrap;text-decoration:underline;}
  .amos-table tr:nth-child(even) td{background:#f4f7fb;}
  .amos-chip{font-size:8.5px;font-weight:600;padding:1px 7px;border-radius:99px;letter-spacing:0.02em;}
  .amos-footer{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:#dbe4f0;border-top:1px solid #b9c6d6;gap:8px;flex:0 0 auto;}
  .amos-count{font-size:10.5px;color:#41547a;}
  .amos-export-btn{background:#1e7d3c;color:#fff;border:none;border-radius:6px;padding:8px 13px;font-size:11.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:var(--font-display);}
  .amos-plate-cell{transform:scale(0.82);transform-origin:left center;}
  .plain-plate-cell{display:flex;align-items:center;gap:7px;}
  .plain-plate-text{font-family:var(--font-mono);font-weight:700;letter-spacing:0.3px;color:#1a2b45;font-size:10.5px;}

  /* ---- Módulo: Alta de vehículos ---- */
  .add-vehicle-btn{width:100%;background:var(--orange);color:#fff;border:none;border-radius:var(--radius);padding:12px;font-family:var(--font-display);font-weight:600;font-size:13.5px;letter-spacing:0.01em;cursor:pointer;margin-bottom:12px;box-shadow:var(--shadow-sm);transition:filter .15s,transform .05s;}
  .add-vehicle-btn:hover{filter:brightness(1.07);}
  .add-vehicle-btn:active{transform:translateY(1px);}
  .reg-form{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-md);}
  .form-row{margin-bottom:12px;}
  .form-row label{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;font-weight:600;margin-bottom:5px;}
  .form-row input, .form-row select{width:100%;background:#fff;border:1px solid var(--border-strong);border-radius:8px;color:var(--text);padding:10px 11px;font-family:var(--font-display);font-size:13.5px;transition:border-color .15s, box-shadow .15s;}
  .form-row input:focus, .form-row select:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(27,77,228,0.12);}
  .save-btn{width:100%;background:var(--text);color:#fff;border:none;border-radius:var(--radius);padding:12px;font-weight:600;font-family:var(--font-display);cursor:pointer;font-size:13.5px;box-shadow:var(--shadow-sm);transition:filter .15s,transform .05s;}
  .save-btn:hover{filter:brightness(1.25);}
  .save-btn:active{transform:translateY(1px);}
  .reg-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;margin-bottom:10px;overflow:hidden;}
  .reg-card-top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;}
  .reg-card-sub{display:flex;align-items:center;gap:8px;padding:0 14px 12px 14px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
  .date-input{background:#fff;border:1px solid var(--border);border-radius:4px;color:var(--text);padding:5px 8px;font-family:var(--font-mono);font-size:11.5px;}
  .reg-card-body{border-top:1px solid var(--border);padding:14px;}
  .reg-section-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600;margin-bottom:8px;}
  .photo-strip{display:flex;gap:8px;flex-wrap:wrap;}
  .photo-thumb{width:56px;height:56px;object-fit:cover;border-radius:4px;border:1px solid var(--border);}
  .photo-add{width:56px;height:56px;border:1px dashed var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;text-align:center;line-height:1.2;color:var(--muted);cursor:pointer;}
  .doc-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
  .doc-row{background:var(--panel-alt);border:1px solid var(--border);border-radius:4px;padding:8px 10px;font-size:12px;}
  .doc-row.muted{color:var(--muted);}
  .doc-add-btn{display:inline-block;background:var(--panel-alt);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:9px 12px;font-size:12.5px;cursor:pointer;font-family:var(--font-display);}

  /* ---- Módulo: Daños ---- */
  .damage-score-bar{height:10px;background:var(--panel-alt);border-radius:6px;overflow:hidden;margin:14px 0 6px 0;}
  .damage-score-fill{height:100%;transition:width 0.3s ease;}
  .damage-score-label{font-size:13px;font-weight:700;margin-bottom:12px;}
  .damage-hint{font-size:11.5px;color:var(--muted);margin-top:10px;text-align:center;}
  .damage-list{margin-top:12px;font-size:12px;color:var(--muted);}

  /* ---- Módulo: Control de averías ---- */
  .maint-history{margin-top:16px;}
  .maint-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .maint-icon{font-size:20px;}
  .maint-row .mr-tipo{font-size:13px;font-weight:700;}
  .maint-row .mr-detail{font-size:11.5px;color:var(--muted);}

  .nav-buttons{display:flex;flex-direction:column;gap:10px;}

  /* ---- Previsión de flota (tipo AMOS Maintenance Forecast) ---- */
  .forecast-list{display:flex;flex-direction:column;}
  .forecast-row{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--border);}
  .fr-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .fr-meta{min-width:0;}
  .fr-meta .fr-type{font-size:12.5px;font-weight:700;}
  .fr-meta .fr-sub{font-size:10.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fr-right{text-align:right;flex-shrink:0;padding-left:8px;}
  .fr-date{font-family:var(--font-mono);font-size:11.5px;color:var(--text);}
  .fr-chip{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:9px;margin-top:3px;display:inline-block;}
  .nav-btn{
    display:flex;align-items:center;gap:14px;
    background:var(--panel);border:1px solid var(--border);border-radius:6px;
    padding:15px 16px;cursor:pointer;color:var(--text);
    font-family:var(--font-display);font-size:14.5px;font-weight:600;
  }
  .nav-btn .icon{font-size:20px;}
  .nav-btn .nb-sub{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px;}
  .nav-btn:active{background:var(--panel-alt);}
  .home-summary{font-size:12px;color:var(--muted);text-align:center;padding-top:4px;}

  .home-hero{background:linear-gradient(145deg,#1B2333,#0D1220);color:#fff;border-radius:16px;padding:22px 20px 20px;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg);}
  .home-hero::after{content:'';position:absolute;top:-70px;right:-50px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(27,77,228,0.55),transparent 68%);}
  .home-hero-title{font-size:21px;font-weight:700;letter-spacing:-0.02em;position:relative;}
  .home-hero-sub{font-size:12.5px;color:rgba(255,255,255,0.62);margin-top:5px;position:relative;letter-spacing:0.005em;}
  .bento-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .bento-card{
    grid-column:span 1;border-radius:14px;background:var(--panel);border:1px solid var(--border);
    padding:16px 15px 14px;cursor:pointer;position:relative;overflow:hidden;
    min-height:94px;display:flex;flex-direction:column;justify-content:flex-end;
    box-shadow:var(--shadow-sm);transition:box-shadow .18s, transform .12s;
  }
  .bento-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--card-accent);opacity:0.9;}
  .bento-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);}
  .bento-card:active{transform:translateY(0);}
  .bento-card.big{grid-column:span 2;min-height:84px;}
  .bento-title{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-0.015em;}
  .bento-sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4;}
  .bento-stat{position:absolute;top:13px;right:15px;font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-0.03em;color:var(--card-accent);}

  /* ---- Inicio: panel de comandos ---- */
  .cmd-screen{padding:16px 16px 24px;}
  .cmd-stats{display:flex;align-items:center;gap:14px;padding:2px 4px 18px;}
  .cmd-stat{display:flex;flex-direction:column;gap:2px;}
  .cmd-stat-n{font-size:25px;font-weight:300;letter-spacing:-0.045em;color:var(--text);line-height:1;}
  .cmd-stat-n.alert{color:var(--red);}
  .cmd-stat-n.warn{color:var(--taxi-accent);}
  .cmd-stat-l{font-size:9.5px;text-transform:uppercase;letter-spacing:0.11em;color:var(--muted);font-weight:500;}
  .cmd-div{width:1px;height:26px;background:var(--border);}
  .cmd-bar{
    display:flex;align-items:center;gap:10px;
    background:var(--panel);border:1px solid var(--border-strong);border-radius:13px;
    padding:13px 14px;box-shadow:var(--shadow-md);transition:border-color .16s, box-shadow .16s;
  }
  .cmd-bar:focus-within{border-color:var(--orange);box-shadow:0 0 0 4px rgba(27,77,228,0.10), var(--shadow-md);}
  .cmd-bar-icon{font-size:17px;color:var(--muted);line-height:1;}
  .cmd-bar input{flex:1;border:none;outline:none;background:transparent;font-family:var(--font-display);font-size:14.5px;color:var(--text);letter-spacing:-0.01em;}
  .cmd-bar input::placeholder{color:#A3ABB8;}
  .cmd-bar-hint{font-family:var(--font-mono);font-size:9px;color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:2px 6px;}
  .cmd-group{font-size:9.5px;text-transform:uppercase;letter-spacing:0.12em;color:var(--muted);font-weight:600;margin:22px 4px 7px;}
  .cmd-item{
    display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:11px;cursor:pointer;
    transition:background .14s;
  }
  .cmd-item:hover{background:var(--panel);box-shadow:var(--shadow-sm);}
  .cmd-item-kind{
    flex:0 0 auto;min-width:30px;height:30px;padding:0 7px;border-radius:8px;
    background:var(--panel-alt);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:0.02em;
  }
  .cmd-item-kind.mono{font-family:var(--font-mono);font-size:10px;color:var(--text);}
  .cmd-item:hover .cmd-item-kind{border-color:var(--orange);color:var(--orange);background:rgba(27,77,228,0.06);}
  .cmd-item-body{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
  .cmd-item-name{font-size:14px;font-weight:500;letter-spacing:-0.012em;color:var(--text);}
  .cmd-item-desc{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cmd-item-go{font-size:12px;color:transparent;flex:0 0 auto;transition:color .14s;}
  .cmd-item:hover .cmd-item-go{color:var(--orange);}
  .cmd-empty{padding:26px 6px;font-size:12.5px;color:var(--muted);text-align:center;}

  /* ---- Inicio: índice editorial ---- */
  .ed-screen{padding:6px 20px 24px;}
  .ed-head{padding:14px 0 22px;border-bottom:1px solid var(--text);}
  .ed-date{font-size:10.5px;text-transform:uppercase;letter-spacing:0.14em;color:var(--muted);font-weight:500;}
  .ed-h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:42px;line-height:1.02;letter-spacing:-0.02em;color:var(--text);margin:12px 0 0;}
  .ed-h1 em{font-style:italic;color:var(--muted);}
  .ed-kpis{display:flex;gap:26px;margin-top:20px;}
  .ed-kpi{display:flex;flex-direction:column;gap:3px;}
  .ed-kpi-n{font-family:var(--font-mono);font-size:19px;font-weight:500;letter-spacing:-0.02em;color:var(--text);line-height:1;}
  .ed-kpi-n.alert{color:var(--red);}
  .ed-kpi-n.warn{color:var(--taxi-accent);}
  .ed-kpi-l{font-size:9.5px;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);}
  .ed-list{margin-top:4px;}
  .ed-row{
    display:flex;align-items:baseline;gap:11px;
    padding:15px 2px;border-bottom:1px solid var(--border);
    cursor:pointer;position:relative;transition:padding-left .22s cubic-bezier(.22,1,.36,1);
  }
  .ed-row:hover{padding-left:9px;}
  .ed-num{font-family:var(--font-mono);font-size:10px;color:var(--muted);font-weight:500;width:17px;flex:0 0 auto;transition:color .2s;}
  .ed-row:hover .ed-num{color:var(--orange);}
  .ed-title{font-size:16.5px;font-weight:500;letter-spacing:-0.015em;color:var(--text);white-space:nowrap;}
  .ed-rule{flex:1 1 auto;height:1px;background:var(--border);align-self:center;}
  .ed-meta{font-size:11px;color:var(--muted);white-space:nowrap;letter-spacing:0.005em;}
  .ed-meta.flag{color:var(--taxi-accent);font-weight:500;}
  .ed-arrow{font-size:13px;color:var(--muted);opacity:0;transform:translateX(-5px);transition:opacity .2s,transform .22s cubic-bezier(.22,1,.36,1);flex:0 0 auto;}
  .ed-row:hover .ed-arrow{opacity:1;transform:translateX(0);color:var(--orange);}

  /* ---- Inicio alternativo: tema "salpicadero" ---- */
  .home-dash-shell{background:radial-gradient(ellipse at top, #34383f, #0c0e11 75%);border-radius:12px;padding:18px 16px 14px;margin-bottom:12px;box-shadow:inset 0 0 24px rgba(0,0,0,0.55), 0 4px 14px rgba(0,0,0,0.3);}
  .home-dash-title{font-family:'Oswald','Arial Narrow',Arial,sans-serif;color:#EFE9D6;font-size:27px;font-weight:600;letter-spacing:7px;text-transform:uppercase;text-align:center;text-shadow:0 1px 0 #000, 0 0 12px rgba(255,255,255,0.12);}
  .home-dash-stats{display:flex;justify-content:space-around;align-items:flex-end;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.08);gap:4px;}
  .dash-stat{text-align:center;flex:1;max-width:110px;}
  .dash-stat-value{font-family:var(--font-lcd);font-size:32px;color:#7CFC9A;text-shadow:0 0 8px rgba(124,252,154,0.55);line-height:1;}
  .dash-stat-value.warn{color:#FF6B4A;text-shadow:0 0 8px rgba(255,107,74,0.6);}
  .dash-stat-label{font-family:'Oswald','Arial Narrow',Arial,sans-serif;font-size:9px;font-weight:500;color:#9aa3ad;text-transform:uppercase;letter-spacing:1.6px;margin-top:4px;}
  .gauge-svg{width:100%;max-width:100px;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.5));}
  .dash-tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .dash-tile{
    grid-column:span 1;background:linear-gradient(180deg,#34373d,#1b1d21);border:1px solid #000;border-radius:8px;
    padding:14px 12px 12px;position:relative;cursor:pointer;min-height:78px;
    box-shadow:0 2px 0 #000, inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .dash-tile:active{transform:translateY(1px);box-shadow:0 1px 0 #000;}
  .dash-tile.big{grid-column:span 2;}
  .dash-tile-led{position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--led-color);box-shadow:0 0 6px var(--led-color),0 0 2px var(--led-color);}
  .dash-tile-title{font-family:'Oswald','Arial Narrow',Arial,sans-serif;font-weight:600;font-size:15px;letter-spacing:1.6px;text-transform:uppercase;color:#EFE9D6;}
  .dash-tile-sub{font-size:10px;color:#8b929b;margin-top:4px;line-height:1.3;}

  /* ---- Subpantallas (mapa / scanner) ---- */
  .sub-header{
    display:flex;align-items:center;gap:12px;
    padding:13px 18px;border-bottom:1px solid var(--border);flex:0 0 auto;
    background:rgba(255,255,255,0.85);backdrop-filter:saturate(180%) blur(12px);
  }
  .back-btn{
    background:var(--panel);border:1px solid var(--border-strong);color:var(--text);
    border-radius:99px;padding:7px 14px;font-family:var(--font-display);font-size:12.5px;font-weight:600;cursor:pointer;
    box-shadow:var(--shadow-sm);transition:background .15s;
  }
  .back-btn:hover{background:var(--panel-alt);}
  .sub-title{font-size:15px;font-weight:700;letter-spacing:-0.01em;}

  /* Mapa */
  #mapScreenBody{flex:1 1 auto;position:relative;}
  #leafletMap{position:absolute;inset:0;filter:grayscale(0.35) contrast(1.02);}
  .marker-label{font-family:var(--font-mono) !important;font-size:10px !important;color:#fff !important;background:rgba(34,48,63,0.9) !important;border:1px solid var(--border) !important;padding:1px 5px !important;box-shadow:none !important;}
  .leaflet-tooltip:before{display:none !important;}
  .leaflet-control-attribution{background:rgba(255,255,255,0.75) !important;color:var(--muted) !important;font-size:9px !important;}
  .map-selected-bar{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;border-top:1px solid var(--border);background:var(--panel);
  }
  .map-selected-bar .msb-btn{
    background:var(--orange);color:#fff;border:none;border-radius:4px;
    padding:8px 12px;font-family:var(--font-display);font-weight:600;font-size:12.5px;cursor:pointer;
  }

  /* Scanner */
  #scannerBody{padding:16px;flex:1 1 auto;overflow-y:auto;}
  .scanner{background:linear-gradient(180deg,#3d3e42,#232427);border-radius:8px;padding:13px;box-shadow:inset 0 0 0 1px #000, 0 3px 10px rgba(0,0,0,0.4);border:1px solid #050505;margin-top:4px;}
  .scanner-top{display:flex;align-items:center;justify-content:space-between;padding:0 4px 9px 4px;}
  .scanner-top .st-left{display:flex;align-items:center;gap:9px;}
  .scanner-brand{font-size:10px;letter-spacing:1.5px;color:#9a9ca1;text-transform:uppercase;font-weight:700;}
  .scanner-mil-sm{width:24px;height:16px;display:flex;align-items:center;justify-content:center;}
  .scanner-led{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:ledpulse 1.6s infinite;}
  @keyframes ledpulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
  .lcd-tabs{display:flex;gap:6px;margin:0 4px 8px 4px;}
  .lcd-tab{
    flex:1;text-align:center;padding:8px 4px;
    font-family:var(--font-display);font-size:10.5px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;
    color:#fff;
    background:radial-gradient(circle at 30% 25%, #38393c, #0c0c0d 75%);
    border:1px solid #000;border-radius:8px;cursor:pointer;
    box-shadow:0 3px 0 #000, 0 4px 6px rgba(0,0,0,0.55);
    text-shadow:0 1px 1px rgba(0,0,0,0.6);
  }
  .lcd-tab:active{transform:translateY(3px);box-shadow:inset 0 2px 3px rgba(0,0,0,0.6);}
  .lcd-tab.active{background:radial-gradient(circle at 30% 25%, #4a4b4f, #151516 75%);box-shadow:0 3px 0 #000, 0 0 10px rgba(255,255,255,0.15), inset 0 0 0 1px rgba(255,255,255,0.12);}
  .veh-tabs{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;margin:14px 0 12px;}
  .veh-tab{flex:1;text-align:center;padding:9px 4px;font-size:11px;font-weight:600;color:var(--muted);background:var(--panel-alt);cursor:pointer;border-right:1px solid var(--border);}
  .veh-tab:last-child{border-right:none;}
  .veh-tab.active{background:var(--orange);color:#fff;}
  .odo-box{display:flex;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:12px 14px;margin-bottom:10px;}
  .odo-item{flex:1;}
  .odo-label{font-size:9.5px;text-transform:uppercase;color:var(--muted);letter-spacing:0.4px;}
  .odo-value{font-family:var(--font-mono);font-size:19px;font-weight:700;color:var(--text);}
  .odo-sub{font-size:10px;color:var(--muted);}
  .mant-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
  .mant-card-title{font-size:13px;font-weight:700;margin-bottom:6px;}
  .mant-card-refs{font-size:11.5px;color:var(--muted);line-height:1.6;margin-bottom:8px;}
  .lcd-page-indicator{position:absolute;top:8px;right:10px;font-size:13px;opacity:0.6;z-index:1;}
  .lcd-screen{background:linear-gradient(180deg,var(--lcd-bg),var(--lcd-bg-dark));border-radius:4px;padding:16px 16px;box-shadow:inset 0 2px 6px rgba(0,0,0,0.35), inset 0 0 0 2px rgba(0,0,0,0.25);font-family:var(--font-lcd);color:var(--lcd-text);position:relative;overflow-y:auto;overflow-x:hidden;min-height:230px;max-height:400px;}
  .lcd-screen::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 1px, transparent 1px, transparent 3px);pointer-events:none;}
  .lcd-live-grid{display:flex;flex-direction:column;gap:2px;position:relative;z-index:1;}
  .lcd-live-row{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px dashed rgba(36,51,24,0.22);padding:3px 0;}
  .lcd-live-row .llr-label{font-size:15px;letter-spacing:0.5px;opacity:0.85;}
  .lcd-live-row .llr-value{font-size:22px;letter-spacing:1px;font-weight:400;}
  .lcd-live-row .llr-value.warn{position:relative;}
  .lcd-line{font-size:19px;letter-spacing:1px;line-height:1.35;position:relative;z-index:1;}
  .lcd-line.small{font-size:14px;opacity:0.85;}
  .lcd-code{font-weight:700;}
  .lcd-cursor{display:inline-block;width:8px;height:15px;background:var(--lcd-text);opacity:0.7;animation:cursorblink 1s infinite;vertical-align:middle;margin-left:2px;}
  @keyframes cursorblink{0%,49%{opacity:0.75;}50%,100%{opacity:0;}}
  .scanner-keys{display:flex;gap:6px;margin-top:10px;}
  .key{
    flex:1;
    background:radial-gradient(circle at 30% 25%, #333437, #0a0a0b 75%);
    border:1px solid #000;border-radius:8px;
    color:#fff;
    font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;
    padding:10px 4px;text-align:center;cursor:pointer;
    box-shadow:0 3px 0 #000, 0 4px 6px rgba(0,0,0,0.55);
    text-shadow:0 1px 1px rgba(0,0,0,0.6);
  }
  .key:active{transform:translateY(3px);box-shadow:inset 0 2px 3px rgba(0,0,0,0.6);}
  .key:disabled{opacity:0.3;cursor:not-allowed;}
  .key.active{background:radial-gradient(circle at 30% 25%, #4a4b4f, #151516 75%);box-shadow:0 3px 0 #000, 0 0 8px rgba(255,255,255,0.15), inset 0 0 0 1px rgba(255,255,255,0.12);}
  .key-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle;}

  /* ---- Asistente IA (Claude) ---- */
  .ai-btn{
    width:100%;margin-top:10px;
    background:radial-gradient(circle at 30% 25%, #333437, #0a0a0b 75%);
    border:1px solid #000;border-radius:8px;
    color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:11.5px;letter-spacing:0.6px;text-transform:uppercase;
    padding:12px 4px;cursor:pointer;
    box-shadow:0 3px 0 #000, 0 4px 6px rgba(0,0,0,0.55);
    text-shadow:0 1px 1px rgba(0,0,0,0.6);
  }
  .ai-btn:active{transform:translateY(3px);box-shadow:inset 0 2px 3px rgba(0,0,0,0.6);}
  .ai-panel{
    margin-top:12px;background:#1a1c22;border:1px solid #35384a;border-radius:12px;padding:14px;
  }
  .ai-panel-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;font-weight:700;color:#a3a8ff;text-transform:uppercase;letter-spacing:0.6px;}
  .ai-severity{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:9px;margin-bottom:8px;}
  .ai-code-block{margin-bottom:12px;}
  .ai-code-block:last-child{margin-bottom:0;}
  .ai-code-title{font-family:var(--font-mono);font-weight:700;font-size:12.5px;color:var(--text);margin-bottom:4px;}
  .ai-advice-text{font-size:12.5px;line-height:1.55;color:#d3d5e0;}
  .ai-disclaimer{font-size:10px;color:var(--muted);margin-top:10px;font-style:italic;}

  /* ---- Login GESTFLOTAS ---- */
  .login-screen{padding:32px 20px 24px;display:flex;flex-direction:column;min-height:100%;background:var(--panel);}
  .login-logo{text-align:center;margin-top:10px;margin-bottom:6px;}
  .login-logo-badge{
    width:48px;height:48px;margin:0 auto 14px;border-radius:4px;
    background:var(--text);color:#fff;font-size:20px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
  }
  .login-title{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:0.3px;color:var(--text);}
  .login-sub{font-size:12px;color:var(--muted);margin-top:4px;}
  .login-users{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
  .login-user-card{
    display:flex;align-items:center;gap:12px;
    background:var(--panel);border:1px solid var(--border);border-radius:6px;
    padding:12px 14px;cursor:pointer;
  }
  .login-user-card.selected{border-color:var(--orange);background:rgba(10,110,209,0.06);}
  .lu-icon{font-size:18px;}
  .lu-label{font-size:13.5px;font-weight:600;}
  .lu-username{font-size:10.5px;color:var(--muted);font-family:var(--font-mono);}
  .login-form{display:flex;flex-direction:column;gap:9px;margin-top:auto;}
  .login-form input{
    background:#fff;border:1px solid var(--border);border-radius:4px;
    color:var(--text);padding:11px 12px;font-family:var(--font-display);font-size:14px;
  }
  .login-error{color:var(--red);font-size:12px;background:rgba(176,0,32,0.06);border:1px solid rgba(176,0,32,0.3);border-radius:4px;padding:8px 10px;}
  .login-btn{
    background:var(--orange);
    color:#fff;border:none;border-radius:4px;padding:13px;
    font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:0.2px;cursor:pointer;
  }
  .login-btn:active{opacity:0.85;}
  .login-hint{text-align:center;font-size:10.5px;color:var(--muted);margin-top:12px;}

  /* ---- Cuadro de instrumentos BMW (Mantenimiento) ---- */
  .bmw-cluster{
    margin:14px;padding:16px 14px;
    background:linear-gradient(180deg,#1c1d1f,#08090a);
    border:1px solid #050505;border-radius:14px;
    display:flex;align-items:center;gap:14px;
    box-shadow:inset 0 0 0 1px #3a3a3a, 0 4px 14px rgba(0,0,0,0.5);
  }
  .bmw-gauge-block{text-align:center;flex:0 0 auto;}
  .bmw-gauge-label{font-family:var(--font-display);font-size:9.5px;letter-spacing:1px;color:#c9c6ba;margin-top:-10px;font-weight:700;}
  .bmw-digital-panel{
    flex:1 1 auto;min-width:0;
    background:#000;border:1px solid #2a2a2a;border-radius:8px;
    padding:10px 12px;
  }
  .bmw-digital-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1c1c1c;}
  .bmw-digital-row:last-child{border-bottom:none;}
  .bmw-digital-label{font-family:var(--font-display);font-size:9.5px;letter-spacing:0.6px;color:#8a8a80;text-transform:uppercase;}
  .bmw-digital-value{font-family:var(--font-mono);font-size:19px;font-weight:700;color:#FF7A1A;text-shadow:0 0 8px rgba(255,122,26,0.45);letter-spacing:1px;}
  .bmw-digital-unit{font-size:10px;color:#8a8a80;margin-left:4px;text-shadow:none;font-weight:400;}
  .bmw-digital-warning{display:flex;align-items:center;gap:7px;font-size:10.5px;}
  .bmw-warning-light-sm{width:26px;height:26px;border-radius:6px;background:#000;border:1px solid #333;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  /* ---- Cuadro de instrumentos propio (Mantenimiento) ---- */
  .car-cluster{
    margin:14px;padding:16px 12px;
    background:linear-gradient(180deg,#1c1d1f,#08090a);
    border:1px solid #050505;border-radius:14px;
    box-shadow:inset 0 0 0 1px #3a3a3a, 0 4px 14px rgba(0,0,0,0.5);
  }
  .cc-gauges-row{display:flex;align-items:center;justify-content:center;gap:8px;}
  .cc-center-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 74px;}
  .cc-mil{width:44px;height:44px;border-radius:9px;background:#000;border:1px solid #333;display:flex;align-items:center;justify-content:center;}
  .cc-mil.on{border-color:#FF7A1A;}
  .cc-mil-text{font-family:var(--font-display);font-size:8.5px;font-weight:800;letter-spacing:0.5px;}
  .cc-digital-strip{
    display:flex;justify-content:space-between;gap:6px;
    margin:14px 4px 0;padding:10px 10px;
    background:#000;border:1px solid #2a2a2a;border-radius:8px;
  }
  .cc-digital-item{flex:1;text-align:center;display:flex;flex-direction:column;gap:2px;}
  .cc-di-label{font-family:var(--font-display);font-size:8.5px;color:#8a8a80;text-transform:uppercase;letter-spacing:0.4px;}
  .cc-di-value{font-family:var(--font-mono);font-size:14px;font-weight:700;color:#FF7A1A;text-shadow:0 0 6px rgba(255,122,26,0.4);}
  .cc-di-value small{font-size:8.5px;color:#8a8a80;font-weight:400;text-shadow:none;}
  .engine-off-btn{
    width:100%;margin-top:14px;
    background:radial-gradient(circle at 30% 25%, #E5342E, #7a0a06 75%);
    border:1px solid #000;border-radius:10px;
    color:#fff;font-family:var(--font-display);font-weight:800;font-size:13.5px;letter-spacing:1px;
    padding:13px;cursor:pointer;text-transform:uppercase;
    box-shadow:0 3px 0 #4a0000, 0 4px 10px rgba(0,0,0,0.5);
    text-shadow:0 1px 2px rgba(0,0,0,0.5);
  }
  .engine-off-btn:active{transform:translateY(3px);box-shadow:none;}
  .engine-off-btn.is-off{
    background:radial-gradient(circle at 30% 25%, #3CCB6E, #0f6b34 75%);
    box-shadow:0 3px 0 #0a4022, 0 4px 10px rgba(0,0,0,0.5);
  }
  .cc-off-note{margin-top:8px;text-align:center;font-size:11px;color:#FF6B6B;font-weight:600;}

  .toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;border-left:3px solid var(--orange);padding:13px 15px;border-radius:6px;max-width:380px;width:88%;font-size:12.5px;font-family:var(--font-display);box-shadow:0 6px 18px rgba(0,0,0,0.25);z-index:2000;}
  .toast strong{display:block;margin-bottom:4px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(20,28,38,0.55);display:flex;align-items:center;justify-content:center;z-index:3000;padding:20px;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:22px;width:100%;max-width:340px;box-shadow:0 12px 32px rgba(0,0,0,0.2);}
  .modal h3{margin:0 0 10px 0;font-size:16px;color:var(--text);}
  .modal p{color:var(--muted);font-size:12.5px;line-height:1.5;margin-bottom:16px;}
  .modal-buttons{display:flex;gap:10px;}
  .modal-buttons button{flex:1;padding:10px;border-radius:4px;border:1px solid var(--border);font-weight:600;cursor:pointer;font-family:var(--font-display);}
  .btn-cancel{background:var(--panel-alt);color:var(--text);}
  .btn-confirm{background:var(--red);color:#fff;border-color:var(--red);}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  /* ---- Login FLOTIA: menú de 3 opciones ---- */
  .login-menu{display:flex;flex-direction:column;gap:10px;margin-top:22px;}
  .login-menu-btn{
    background:var(--panel);border:1px solid var(--border);border-radius:6px;
    padding:15px 16px;text-align:left;cursor:pointer;color:var(--text);
    font-family:var(--font-display);font-size:14.5px;font-weight:600;
  }
  .login-menu-btn .lmb-sub{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px;}
  .login-menu-btn:active{background:var(--panel-alt);}
  .login-back{background:transparent;border:none;color:var(--orange);font-family:var(--font-display);font-size:12.5px;font-weight:600;cursor:pointer;padding:0;margin-bottom:14px;text-align:left;}
  .profile-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:4px;}
  .profile-opt{
    display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:6px;
    padding:11px 13px;cursor:pointer;font-size:13px;font-weight:600;
  }
  .profile-opt.selected{border-color:var(--orange);background:rgba(10,110,209,0.06);}
  .admin-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px;}
  .admin-table th{text-align:left;padding:7px 8px;font-size:10px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);}
  .admin-table td{padding:8px 8px;border-bottom:1px solid var(--border);}
  .admin-del-btn{background:var(--red);color:#fff;border:none;border-radius:4px;padding:5px 9px;font-size:11px;cursor:pointer;font-family:var(--font-display);}

  /* ---- Pantalla: Vehículos ---- */
  .plate-lookup{display:flex;gap:8px;}
  .plate-lookup input{flex:1;background:#fff;border:1px solid var(--border);border-radius:4px;color:var(--text);padding:10px 12px;font-family:var(--font-mono);font-size:14px;text-transform:uppercase;}
  .plate-lookup button{background:var(--orange);color:#fff;border:none;border-radius:4px;padding:0 16px;font-family:var(--font-display);font-weight:600;font-size:13px;cursor:pointer;}
  .task-row{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;margin-bottom:9px;box-shadow:var(--shadow-sm);transition:box-shadow .15s;}
  .task-row:hover{box-shadow:var(--shadow-md);}
  .task-row-top{display:flex;align-items:center;justify-content:space-between;}
  .task-tipo{font-size:13px;font-weight:700;}
  .task-meta{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .task-del, .material-del{background:transparent;border:none;color:var(--red);font-size:16px;cursor:pointer;line-height:1;}
  .veh-status-banner{display:flex;align-items:center;justify-content:space-between;background:var(--panel-alt);border:1px solid var(--border);border-radius:6px;padding:10px 13px;margin-bottom:12px;}
  .toggle-inactive-btn{background:var(--panel);border:1px solid var(--border-strong);color:var(--text);border-radius:8px;padding:8px 13px;font-size:12px;font-family:var(--font-display);cursor:pointer;font-weight:600;box-shadow:var(--shadow-sm);transition:background .15s,border-color .15s;}
  .toggle-inactive-btn:hover{background:var(--panel-alt);border-color:var(--muted);}
  .toggle-inactive-btn.is-inactive{background:rgba(176,0,32,0.08);border-color:var(--red);color:var(--red);}
  .radio-toggle{display:flex;gap:8px;margin-bottom:2px;}
  .radio-opt{flex:1;text-align:center;padding:8px;border:1px solid var(--border);border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);}
  .radio-opt.selected{border-color:var(--orange);color:var(--orange);background:rgba(10,110,209,0.06);}

  /* ---- Pantalla: Materiales ---- */
  .material-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px 13px;margin-bottom:8px;}
  .material-part{font-size:13px;font-weight:700;flex:1;}
  .material-detail{font-size:11.5px;color:var(--muted);}

  /* ---- Toolbar extra en Previsión (responsables / centros) ---- */
  .toolbar-addrow{display:flex;gap:6px;margin-top:6px;}
  .toolbar-addrow input{flex:1;border:1px solid #9fb0c6;border-radius:4px;padding:6px 8px;font-size:11.5px;font-family:var(--font-display);}
  .toolbar-addrow button{background:#1e4fa8;color:#fff;border:none;border-radius:4px;padding:0 10px;font-size:11.5px;cursor:pointer;}
  .amos-table select{font-family:var(--font-display);font-size:9.5px;border:1px solid transparent;border-radius:2px;padding:1px 2px;background:transparent;color:#1a2b45;max-width:90px;cursor:pointer;}
  .amos-table select:hover, .amos-table select:focus{border:1px solid #6d9bdb;background:#fff;box-shadow:0 0 0 1px #6d9bdb inset;outline:none;}
  .cell-input{font-family:var(--font-display);font-size:9px;border:1px solid transparent;border-radius:2px;padding:1px 2px;background:transparent;color:#1a2b45;width:56px;}
  .cell-input:hover, .cell-input:focus{border:1px solid #6d9bdb;background:#fff;box-shadow:0 0 0 1px #6d9bdb inset;outline:none;width:90px;}
  .horas-days-hint{font-size:8px;color:#5a6b85;margin-left:2px;}
  .th-tipo{width:26px;}
  .td-tipo{text-align:center;padding:0 2px;}
  .tipo-badge{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:3px;color:#fff;vertical-align:middle;}
  .tipo-badge svg{width:10px;height:10px;}
  .cell-select{font-family:var(--font-display);font-size:9px;border:1px solid transparent;border-radius:2px;padding:0 1px;background:transparent;color:#1a2b45;max-width:86px;cursor:pointer;}
  .cell-select:hover, .cell-select:focus{border-color:#6d9bdb;background:#fff;outline:none;}
  .date-input{width:66px;font-family:var(--font-display);}
  .date-input:hover, .date-input:focus{width:86px;}
  .fact-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--green);margin-left:3px;vertical-align:middle;}
  .tn-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px;}
  .tn-month{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;letter-spacing:-0.01em;color:var(--text);}
  .tn-nav{width:24px;height:24px;border-radius:6px;border:1px solid var(--border-strong);background:var(--panel);color:var(--text);cursor:pointer;font-size:14px;line-height:1;padding:0;}
  .tn-nav:hover{background:var(--panel-alt);}
  .tn-legend{display:flex;gap:9px;flex-wrap:wrap;margin-left:auto;font-size:9.5px;color:var(--muted);}
  .tn-legend span{display:flex;align-items:center;gap:4px;}
  .tn-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;}
  .tn-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--panel);box-shadow:var(--shadow-sm);max-height:62vh;}
  .tn-table{border-collapse:separate;border-spacing:0;font-size:10px;}
  .tn-table th, .tn-table td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:0;}
  .tn-table th{background:var(--panel-alt);color:var(--muted);font-size:8.5px;text-transform:uppercase;letter-spacing:0.05em;position:sticky;top:0;z-index:3;padding:4px 3px;white-space:nowrap;}
  .tn-day{min-width:30px;text-align:center;}
  .tn-day-n{display:block;font-size:10px;font-weight:700;color:var(--text);}
  .tn-day-d{display:block;font-size:7.5px;}
  .tn-day.finde{background:#E7EBF1;}
  .tn-sticky-1{position:sticky;left:0;z-index:5;min-width:104px;text-align:left;padding-left:9px;}
  .tn-sticky-2{position:sticky;left:104px;z-index:5;min-width:74px;text-align:left;padding-left:9px;}
  .tn-sticky-3{position:sticky;left:178px;z-index:5;min-width:86px;text-align:left;padding-left:9px;}
  .tn-name{position:sticky;left:0;background:var(--panel);z-index:2;font-weight:600;font-size:11px;padding:0 9px;white-space:nowrap;color:var(--text);}
  .tn-plate{position:sticky;left:104px;background:var(--panel);z-index:2;font-family:var(--font-mono);font-size:10px;font-weight:700;padding:0 9px;white-space:nowrap;color:var(--text);}
  .tn-flota{position:sticky;left:178px;background:var(--panel);z-index:2;font-size:10px;padding:0 9px;white-space:nowrap;color:var(--muted);border-right:2px solid var(--border-strong) !important;}
  .tn-sticky-3{border-right:2px solid var(--border-strong) !important;}
  .hist-select{font-family:var(--font-display);font-size:10px;border:1px solid #c3cedd;border-radius:5px;padding:3px 5px;background:#fff;color:#1a2b45;max-width:132px;}
  .hist-select:focus{outline:none;border-color:var(--orange);}
  .rrhh-tabs{display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--border);}
  .rrhh-tab{padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .rrhh-tab:hover{color:var(--text);}
  .rrhh-tab.on{color:var(--orange);border-bottom-color:var(--orange);}
  .multas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px;}
  .multas-result{border-radius:9px;padding:11px 13px;margin:2px 0 11px;border:1px solid;}
  .multas-result.conductor{background:#EFF6FF;border-color:#BFDBFE;}
  .multas-result.taller{background:#FEF6E7;border-color:#FCD9A0;}
  .multas-result.desconocido{background:var(--panel-alt);border-color:var(--border);}
  .multas-result-head{font-size:9.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);font-weight:600;}
  .multas-result-name{font-size:15px;font-weight:700;letter-spacing:-0.015em;color:var(--text);margin-top:2px;}
  .multas-result-detail{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.45;}
  .tn-filters{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;background:#eef2f8;border:1px solid #c3cedd;border-radius:9px;padding:6px 4px;margin-bottom:10px;}
  .tn-cell{position:relative;text-align:center;height:26px;min-width:30px;}
  .tn-cell.finde{background:#F4F6FA;}
  .tn-cell.hoy{box-shadow:inset 0 0 0 2px rgba(27,77,228,0.45);}
  .tn-cell.dim{opacity:0.25;}
  .tn-sel{width:100%;height:100%;border:none;background:transparent;text-align:center;font-family:var(--font-display);font-size:10.5px;font-weight:700;cursor:pointer;-webkit-appearance:none;appearance:none;padding:0;}
  .tn-sel:hover, .tn-sel:focus{outline:none;background:#fff;box-shadow:inset 0 0 0 1px var(--orange);}
  .tn-note-btn{position:absolute;top:1px;right:2px;font-size:11px;line-height:1;color:transparent;cursor:pointer;}
  .tn-cell:hover .tn-note-btn{color:#B6BFCC;}
  .tn-note-btn.has{color:var(--taxi-accent) !important;}
  .tn-total{text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--muted);min-width:28px;background:var(--panel-alt);}
  .tn-total.libre{color:#94A3B8;}
  .tn-gen{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:11px;box-shadow:var(--shadow-sm);}
  .tn-gen-head{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:10px;}
  .tn-gen-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
  .tn-gen-note{font-size:10.5px;color:var(--muted);line-height:1.5;margin:4px 0 11px;}
  .inf-stats{display:flex;gap:9px;}
  .inf-stat{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:13px 10px;text-align:center;box-shadow:var(--shadow-sm);}
  .inf-stat-v{font-size:17px;font-weight:700;letter-spacing:-0.02em;}
  .inf-stat-l{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-top:3px;}
  .inf-table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--panel);box-shadow:var(--shadow-sm);}
  .inf-table{width:100%;border-collapse:collapse;font-size:11px;}
  .inf-table th{background:var(--panel-alt);color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:0.07em;padding:8px 8px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border);}
  .inf-table td{padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
  .inf-table tr:last-child td{border-bottom:none;}
  .inf-table .mono{font-family:var(--font-mono);font-size:10.5px;}
  .inf-bar{height:3px;background:var(--panel-alt);border-radius:99px;overflow:hidden;margin-top:3px;min-width:54px;}
  .inf-bar span{display:block;height:100%;border-radius:99px;}
  .inf-row{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--border);}
  .inf-row-name{font-size:11.5px;font-weight:500;min-width:96px;display:flex;flex-direction:column;}
  .inf-row-sub{font-family:var(--font-mono);font-size:9px;color:var(--muted);}
  .inf-row .inf-bar{flex:1;height:6px;margin-top:0;}
  .inf-row-val{font-family:var(--font-mono);font-size:11px;color:var(--muted);min-width:18px;text-align:right;}
  .gear-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:28px;height:28px;border-radius:7px;border:1px solid #b9c6d6;background:#fff;
    color:#41547a;cursor:pointer;padding:0;transition:background .15s,color .15s,transform .2s;
  }
  .gear-btn:hover{background:#eef2f8;color:#0A6ED1;}
  .gear-btn:active{transform:rotate(35deg);}
  .gear-btn svg{width:16px;height:16px;}
  .settings-overlay{
    position:fixed;inset:0;background:rgba(16,24,40,0.45);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:800;padding:20px;
  }
  .settings-modal{
    background:var(--panel);border-radius:14px;box-shadow:var(--shadow-lg);
    width:100%;max-width:520px;max-height:82vh;display:flex;flex-direction:column;padding:18px 20px;
  }
  .settings-head{display:flex;align-items:center;justify-content:space-between;font-size:14.5px;font-weight:700;letter-spacing:-0.01em;color:var(--text);}
  .settings-close{cursor:pointer;color:var(--muted);font-size:14px;padding:2px 6px;border-radius:6px;}
  .settings-close:hover{background:var(--panel-alt);color:var(--text);}
  .settings-sub{font-size:11.5px;color:var(--muted);margin:6px 0 13px;line-height:1.45;}
  .settings-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px;overflow-y:auto;}
  .settings-item{
    display:flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:8px;
    padding:7px 9px;font-size:12px;cursor:pointer;background:var(--panel);
  }
  .settings-item:hover{background:var(--panel-alt);}
  .settings-item.fixed{background:var(--panel-alt);color:var(--muted);cursor:default;}
  .settings-item span{flex:1;min-width:0;}
  .settings-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;}
  .cols-fixed-tag{font-size:8px;color:#9aa5b8;text-transform:uppercase;letter-spacing:0.05em;flex:0 0 auto !important;}
  .amos-table th[data-dragcol]{cursor:grab;}
  .amos-table th.th-dragging{opacity:0.45;}
  .amos-table th.th-drop-left{box-shadow:inset 3px 0 0 #0A6ED1;}
  .amos-table th.th-drop-right{box-shadow:inset -3px 0 0 #0A6ED1;}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(192,34,59,0.15);margin-left:auto;}
  .live-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px;}
  .live-console{
    background:#0E1117;border:1px solid #1E242E;border-radius:11px;padding:12px 14px;
    font-family:var(--font-mono);font-size:11.5px;line-height:1.65;max-height:62vh;overflow-y:auto;
  }
  .live-line{display:flex;align-items:baseline;gap:9px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
  .live-line:last-child{border-bottom:none;}
  .live-time{color:#5A6472;flex:0 0 auto;font-size:10.5px;}
  .live-tag{width:5px;height:5px;border-radius:50%;flex:0 0 auto;background:#6B7280;}
  .live-line.fault .live-tag{background:#FF5C5C;}
  .live-line.clear .live-tag{background:#5FE07E;}
  .live-line.share .live-tag{background:#4FA8FF;}
  .live-text{color:#C6CDD8;}
  .live-line.fault .live-text{color:#FF9A8F;}
  .live-line.clear .live-text{color:#9BEBB0;}
  .live-line.share .live-text{color:#9CCBFF;}
  .live-empty{color:#5A6472;padding:14px 0;text-align:center;}
  .amos-table td.editable-cell{padding:0 2px;}
  .mat-refs{margin-top:4px;font-size:9.5px;color:#5a6b85;line-height:1.5;}
  .amos-inactive-row td{opacity:0.55;}

  /* ---- Impresión a PDF (previsión de flota) ---- */
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;top:0;left:0;width:100%;}
  }

  /* ---- Vista de escritorio/navegador normal: la app deja de ir "pegada" a ancho móvil ---- */
  @media (min-width: 860px){
    body{padding:0;align-items:stretch;}
    #app{
      max-width:none;
      width:100%;
      height:100vh;
      border-radius:0;
      overflow:hidden;
      box-shadow:none;
    }
    .login-screen{max-width:420px;margin:0 auto;padding-top:48px;}
    .home-screen, .cmd-screen, .ed-screen{max-width:920px;margin:0 auto;width:100%;}
    .nav-buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    /* La previsión de flota aprovecha todo el ancho disponible */
    .amos-window{margin:10px 14px;flex:1 1 auto;min-height:0;}
    .amos-table-wrap{max-height:none;}
    table.amos-table{font-size:11px;}
    .amos-table td{height:20px;font-size:10.5px;padding:0 7px;}
    .amos-table th{font-size:9.5px;padding:8px 7px;}
    .cell-input{width:78px;font-size:10.5px;}
    .cell-input:hover, .cell-input:focus{width:120px;}
    .date-input{width:92px;}
    .date-input:hover, .date-input:focus{width:110px;}
    .cell-select, .amos-table select{font-size:10.5px;max-width:130px;}

// ---------- Helpers ----------
function statusClass(v){ if(v.dtcs.length>0) return 'fault'; if(v.temp>98) return 'warn'; return 'ok'; }
function statusColor(s){ return s==='fault' ? '#B00020' : (s==='warn' ? '#E9730C' : '#0E7D3C'); }
function daysUntil(date){ return Math.round((date - new Date())/86400000); }
function daysSinceDate(date){ return Math.max(0, Math.round((new Date() - date)/86400000)); }
function syncKmManual(v, newKm){ v.kmReal = newKm; v.kmRealDate = new Date(); v.estimatedKm = newKm; }
function syncKmFromLive(v){ v.kmReal = Math.round(v.estimatedKm); v.kmRealDate = new Date(); }
function syncKmFromAvgUsage(v){ v.estimatedKm = Math.round(v.kmReal + v.avgKmDia * daysSinceDate(v.kmRealDate)); }
function formatDate(date){ return date.toLocaleDateString('es-ES', {day:'2-digit',month:'short',year:'numeric'}); }
function urgencyInfo(days){
  if(days<0) return {color:'var(--red)', label:`VENCIDA (${Math.abs(days)}d)`};
  if(days<=7) return {color:'var(--red)', label:`en ${days} día${days===1?'':'s'}`};
  if(days<=30) return {color:'var(--orange)', label:`en ${days} días`};
  return {color:'var(--green)', label:`en ${days} días`};
}
function formatKm(km){ return Math.round(km).toLocaleString('es-ES') + ' km'; }
// Para tareas que vencen por km Y por fecha (p.ej. la revisión): calcula cuál de las dos
// se cumple antes, traduciendo los km restantes a "días equivalentes" según el uso medio,
// y usa el peor de los dos casos para decidir la urgencia.
function remanenteFecha(date){
  const daysLeft = daysUntil(date);
  return {
    text: daysLeft<0 ? `VENCIDA (${Math.abs(daysLeft)}d)` : `${daysLeft} días`,
    sortValue: daysLeft,
    info: urgencyInfo(daysLeft)
  };

function addLog(text,type='info'){
  const time = new Date().toLocaleTimeString('es-ES');
  logEntries.push({time,text,type});
  renderLog();
}
function renderLog(){
  document.getElementById('logList').innerHTML = logEntries.slice(-40).reverse().map(e=>
    `<div class="log-line ${e.type}"><span class="t">${e.time}</span><span>${e.text}</span></div>`).join('');
  const countEl = document.getElementById('logCount');
  if(countEl){
    const last = logEntries[logEntries.length-1];
    const logEl = document.getElementById('log');
    const open = logEl && logEl.classList.contains('open');
    countEl.textContent = open
      ? `${logEntries.length} registro${logEntries.length===1?'':'s'}`
      : (last ? `${last.time} · ${last.text.slice(0,52)}${last.text.length>52?'…':''}` : 'sin actividad');
  }
  if(screen==='eventoslive') renderEventosLiveScreen();
}

let newUserForm = {profile:'Particular', username:'', password:'', phone:'', email:''};
function attemptLogin(){
  const username = document.getElementById('loginUsername').value.trim().toLowerCase();
  const password = document.getElementById('loginPassword').value.trim();
  const user = appUsers.find(u=>u.username===username && u.password===password);
  if(user){
    loggedIn = true; currentUser = user; loginError=''; loginView='menu'; screen='home';
    loadColConfig();  // cada usuario recupera su propia configuración de columnas
    histLoadColConfig();
    addLog(`Sesión iniciada como ${user.username} (${user.profile})`, 'clear');
    renderScreen();
  } else {
    loginError = 'Usuario o contraseña incorrectos.';
    renderScreen();
  }
}
function attemptCreateUser(){
  const username = document.getElementById('newUsername').value.trim().toLowerCase();
  const password = document.getElementById('newPassword').value.trim();
  const phone = document.getElementById('newPhone').value.trim();
  const email = document.getElementById('newEmail').value.trim();
  if(!username || !password){ loginError = 'Usuario y contraseña son obligatorios.'; renderScreen(); return; }
  if(appUsers.find(u=>u.username===username)){ loginError = 'Ese usuario ya existe.'; renderScreen(); return; }
  const user = {username, password, profile:newUserForm.profile, phone, email};
  appUsers.push(user);
  addLog(`Usuario creado: ${username} (${user.profile})`, 'clear');
  newUserForm = {profile:'Particular', username:'', password:'', phone:'', email:''};
  loginError = '';
  loginView = 'login';
  renderScreen();
}
function attemptAdminAccess(){
  const pass = document.getElementById('adminPassword').value.trim();
  if(pass===ADMIN_PASSWORD){ loginView='adminList'; loginError=''; renderScreen(); }
  else { loginError = 'Contraseña de administrador incorrecta.'; renderScreen(); }
}

function gaugeSVG(value, max, dangerFrom, unitLabel, subLabel){
  const v = Math.max(0, Math.min(value, max));
  // Escala como el cuentavueltas del R5 GT Turbo: arranca abajo-izquierda y termina abajo-derecha
  const startA = -125, endA = 125;
  const sweep = endA - startA;
  const uid = 'g' + Math.random().toString(36).slice(2,8);
  const toXY = (r, aDeg)=>{
    const rad = (aDeg-90) * Math.PI/180;
    return {x: 50 + r*Math.cos(rad), y: 50 + r*Math.sin(rad)};
  };
  const RED = '#E01B18';
  const majors = 7;                 // 0..7 como en la esfera original (0,10,...,70)
  const majorStep = max/majors;
  const dangerVal = dangerFrom!=null ? dangerFrom : max*10;

  let ticks = '';
  for(let i=0;i<=majors;i++){
    const val = i*majorStep;
    const a = startA + (val/max)*sweep;
    const inDanger = val >= dangerVal;
    // marca principal: barra gruesa roja
    const p1 = toXY(inDanger?33:35.5, a), p2 = toXY(42.5, a);
    ticks += `<line x1="${p1.x.toFixed(2)}" y1="${p1.y.toFixed(2)}" x2="${p2.x.toFixed(2)}" y2="${p2.y.toFixed(2)}" stroke="${RED}" stroke-width="${inDanger?3.4:2.6}" stroke-linecap="butt"/>`;
    // numeración: por fuera, en rojo, tipografía condensada
    const pt = toXY(26.5, a);
    ticks += `<text x="${pt.x.toFixed(2)}" y="${pt.y.toFixed(2)}" font-size="9.5" fill="${RED}" font-family="Oswald, 'Arial Narrow', Arial" font-weight="500" text-anchor="middle" dominant-baseline="central">${Math.round(val)}</text>`;
    // marcas menores entre principales (más densas y largas en zona roja, como el original)
    if(i<majors){
      const subs = 4;
      for(let m=1;m<subs;m++){
        const mv = val + (majorStep/subs)*m;
        const ma = startA + (mv/max)*sweep;
        const md = mv >= dangerVal;
        const q1 = toXY(md?35:38, ma), q2 = toXY(42.5, ma);
        ticks += `<line x1="${q1.x.toFixed(2)}" y1="${q1.y.toFixed(2)}" x2="${q2.x.toFixed(2)}" y2="${q2.y.toFixed(2)}" stroke="${RED}" stroke-width="${md?2.2:1.5}" stroke-linecap="butt"/>`;
      }
    }
  }

  const needleA = startA + (v/max)*sweep;
  const nTip = toXY(37, needleA);
  const nL = toXY(2.6, needleA-90), nR = toXY(2.6, needleA+90);
  const nBack = toXY(11, needleA+180);

  return `
    <svg viewBox="0 0 100 100" class="gauge-svg">
      <defs>
        <radialGradient id="bez_${uid}" cx="34%" cy="28%" r="78%">
          <stop offset="0%" stop-color="#6a6d73"/><stop offset="45%" stop-color="#2b2d31"/><stop offset="100%" stop-color="#0c0d0f"/>
        </radialGradient>
        <radialGradient id="face_${uid}" cx="50%" cy="40%" r="72%">
          <stop offset="0%" stop-color="#151515"/><stop offset="70%" stop-color="#070707"/><stop offset="100%" stop-color="#000"/>
        </radialGradient>
        <linearGradient id="hub_${uid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#EFE9D6"/><stop offset="100%" stop-color="#BBB49F"/>
        </linearGradient>
      </defs>

      <circle cx="50" cy="50" r="49" fill="url(#bez_${uid})"/>
      <circle cx="50" cy="50" r="45.5" fill="#000" opacity="0.9"/>
      <circle cx="50" cy="50" r="44" fill="url(#face_${uid})"/>

      <g>${ticks}</g>

      <text x="50" y="35.5" font-size="5.4" fill="#C9C2AE" font-family="Oswald, 'Arial Narrow', Arial" font-weight="400" letter-spacing="0.4" text-anchor="middle">${unitLabel||''}</text>
      <text x="50" y="69" font-size="6.2" fill="${RED}" font-family="Oswald, 'Arial Narrow', Arial" font-weight="600" letter-spacing="1.2" text-anchor="middle">${subLabel||''}</text>

      <polygon points="${nL.x.toFixed(2)},${nL.y.toFixed(2)} ${nTip.x.toFixed(2)},${nTip.y.toFixed(2)} ${nR.x.toFixed(2)},${nR.y.toFixed(2)} ${nBack.x.toFixed(2)},${nBack.y.toFixed(2)}" fill="${RED}"/>

      <circle cx="50" cy="50" r="5" fill="url(#hub_${uid})" stroke="#2a2a2a" stroke-width="0.5"/>
      <circle cx="50" cy="79" r="4.2" fill="#0b0b0b" stroke="#262626" stroke-width="0.6"/>
      <circle cx="50" cy="79" r="2.6" fill="#EFE9D6"/>

      <ellipse cx="38" cy="26" rx="26" ry="15" fill="#fff" opacity="0.045"/>
    </svg>
  `;
}

function paintCmdResults(q){
  const box = document.getElementById('cmdResults');
  if(!box) return;
  const norm = s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const term = norm(q.trim());

  const plateMatches = term.length>=2
    ? vehicles.filter(v=>norm(v.plate).replace(/\s/g,'').includes(term.replace(/\s/g,''))).slice(0,4)
    : [];
  const modMatches = term
    ? HOME_MODULES.filter(m=>norm(m.name+' '+m.keys).includes(term))
    : HOME_MODULES;

  const plateHTML = plateMatches.length ? `
    <div class="cmd-group">Vehículos</div>
    ${plateMatches.map(v=>`
      <div class="cmd-item" data-plate="${v.plate}">
        <span class="cmd-item-kind mono">${v.plate}</span>
        <span class="cmd-item-body">
          <span class="cmd-item-name">${v.marca||'—'} ${v.modelo||''}</span>
          <span class="cmd-item-desc">${v.type} · ${v.dtcs.length?v.dtcs.length+' código(s) activo(s)':'sin averías'}</span>
        </span>
        <span class="cmd-item-go">↵</span>
      </div>`).join('')}
  ` : '';

  const modHTML = modMatches.length ? `
    <div class="cmd-group">Secciones</div>
    ${modMatches.map((m,i)=>`
      <div class="cmd-item" data-mod="${m.id}">
        <span class="cmd-item-kind">${String(i+1).padStart(2,'0')}</span>
        <span class="cmd-item-body">
          <span class="cmd-item-name">${m.name}</span>
          <span class="cmd-item-desc">${m.desc}</span>
        </span>
        <span class="cmd-item-go">↵</span>
      </div>`).join('')}
  ` : '';

  box.innerHTML = (plateHTML+modHTML) || `<div class="cmd-empty">Sin resultados para «${q}»</div>`;

  box.querySelectorAll('[data-mod]').forEach(el=>{
    el.onclick = ()=>{ const b=document.getElementById(el.dataset.mod); if(b) b.click(); };
  });
  box.querySelectorAll('[data-plate]').forEach(el=>{
    el.onclick = ()=>{
      const found = vehicles.find(v=>v.plate===el.dataset.plate);
      if(!found) return;
      vehiculosFoundId = found.id; vehiculosMode='tasks'; vehiculosSubTab='tareas';
      vehiculosNewTaskOpen=false; vehiculosInactivating=false;
      screen='vehiculos'; renderScreen();
    };
  });

  // botones reales ocultos, para reutilizar el cableado de navegación existente
  const hidden = document.createElement('div');
  hidden.style.display='none';
  hidden.innerHTML = HOME_MODULES.map(m=>`<div id="${m.id}"></div>`).join('');
  box.appendChild(hidden);
  wireHomeButtons();
}

// ============ PANTALLA: MAPA ============
function makeDivIcon(v){
  const color = statusColor(v.status);
  const sel = v.id===selectedId ? 'outline:2px solid #fff;' : '';
  return L.divIcon({className:'', html:`<div style="width:13px;height:13px;border-radius:50%;background:${color};border:2px solid #0A0A0B;box-shadow:0 0 6px ${color};${sel}"></div>`, iconSize:[13,13], iconAnchor:[7,7]});
}
function initMapScreen(){
  if(leafletMapObj){ leafletMapObj.remove(); leafletMapObj=null; }
  leafletMapObj = L.map('leafletMap', {zoomControl:false, attributionControl:true}).setView(CENTER, 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:18, attribution:'&copy; OpenStreetMap'}).addTo(leafletMapObj);
  L.control.zoom({position:'bottomright'}).addTo(leafletMapObj);
  vehicles.forEach(v=>{
    v.status = statusClass(v);
    v.marker = L.marker([v.lat, v.lng], {icon: makeDivIcon(v)}).addTo(leafletMapObj);
    v.marker.bindTooltip(v.plate, {permanent:true, direction:'top', offset:[0,-6], className:'marker-label'});
    v.marker.on('click', ()=>{ selectedId=v.id; refreshMapMarkers(); renderMapSelectedBar(); });
  });
}
function refreshMapMarkers(){
  if(!leafletMapObj) return;
  vehicles.forEach(v=>{ if(v.marker){ v.marker.setLatLng([v.lat,v.lng]); v.marker.setIcon(makeDivIcon(v)); }});
}
function renderMapSelectedBar(){
  const bar = document.getElementById('mapSelectedBar');
  if(!bar) return;
  const v = vehicles.find(x=>x.id===selectedId);
  if(!v){
    bar.innerHTML = `<div style="font-size:12px;color:var(--muted);">Toca un vehículo en el mapa para ver sus opciones.</div>`;
    return;
  }
  bar.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;">${plateBadge(v,'sm')}<span style="font-size:12px;color:var(--muted);">${v.driver}</span></div>
    <button class="msb-btn" id="openInScanner">Abrir en escáner</button>
  `;
  document.getElementById('openInScanner').onclick = ()=>{ screen='mantenimiento'; pickerOpen.mant=false; scannerMenu='root'; showAssistant=false; renderScreen(); };
}
function renderMapScreen(){
  const content = document.getElementById('content');
  content.classList.add('no-pad');
  content.innerHTML = `
    <div class="sub-header">
      <button class="back-btn" id="backBtn">← Volver</button>
      <div class="sub-title">Mapa en directo</div>
    </div>
    <div id="mapScreenBody"><div id="leafletMap"></div></div>
    <div class="map-selected-bar" id="mapSelectedBar"></div>
  `;
  document.getElementById('backBtn').onclick = ()=>{ screen='home'; renderScreen(); };
  renderMapSelectedBar();
  setTimeout(()=>{ initMapScreen(); leafletMapObj.invalidateSize(); }, 30);
}

// ============ PANTALLA: SCANNER ============
function severityInfo(sev){
  if(sev==='alta') return {color:'var(--red)', label:'⚠ Gravedad alta — recomendable ir al taller pronto'};
  if(sev==='media') return {color:'var(--orange)', label:'◐ Gravedad media — vigilar, no es urgente'};
  return {color:'var(--green)', label:'● Gravedad baja — no supone riesgo inmediato'};
}
function renderAssistantPanel(v){
  if(!showAssistant || v.dtcs.length===0) return '';
  const blocks = v.dtcs.map(d=>{
    const sev = severityInfo(d.severity);
    return `
      <div class="ai-code-block">
        <div class="ai-code-title">${d.code} — ${d.desc}</div>
        <div class="ai-severity" style="color:${sev.color};background:${sev.color}22;">${sev.label}</div>
        <div class="ai-advice-text">${d.advice}</div>
      </div>
    `;
  }).join('<hr style="border:none;border-top:1px solid #2e3040;margin:10px 0;">');
  return `
    <div class="ai-panel">
      <div class="ai-panel-top">CLAUDE · DIAGNÓSTICO ASISTIDO</div>
      ${blocks}
      <div class="ai-disclaimer">Orientativo, no sustituye la revisión de un mecánico. En la versión real, esto lo generaría Claude en el momento a partir de los datos del vehículo.</div>
    </div>
  `;
}

    ['NIVEL COMBUSTIBLE', `${Math.round(v.fuelLevel)} %`],
    ['CARGA MOTOR', `${v.engineLoad} %`],
    ['ACELERADOR', `${v.throttlePos} %`],
    ['AVANCE ENCENDIDO', `${v.timingAdvance}°`],
    ['CAUDAL AIRE (MAF)', `${v.maf} g/s`],
    ['PRESIÓN ADMISIÓN', `${v.intakeManifoldPressure} kPa`],
    ['PRESIÓN BAROMÉTRICA', `${v.baroPressure} kPa`],
    ['TEMP. AIRE ADMISIÓN', `${v.intakeAirTemp} °C`],
    ['TEMP. AMBIENTE', `${Math.round(v.ambientTemp)} °C`],
    ['AJUSTE MEZCLA CORTO', `${v.fuelTrimShort>0?'+':''}${v.fuelTrimShort} %`],
    ['AJUSTE MEZCLA LARGO', `${v.fuelTrimLong>0?'+':''}${v.fuelTrimLong} %`],
    ['BATERÍA', `${v.voltage.toFixed(1)} V`],
    ['TIEMPO EN MARCHA', `${Math.floor((v.runtimeSec||0)/60)} MIN`],
    ['KM (ESTIMADO)', `${Math.round(v.estimatedKm).toLocaleString('es-ES')} KM`],
    ['KM DESDE BORRADO', `${Math.round(v.kmSinceClear||0).toLocaleString('es-ES')} KM`],
    ['KM CON MIL ENCENDIDO', `${Math.round(v.kmWithMil||0).toLocaleString('es-ES')} KM`],

    </div>
  `;
}
// ---- Cuadro de instrumentos estilo BMW (2005) — funcional, no decorativo ----
function carGauge(value, max, unit, redlineFrom, size){
  size = size || 112;
  const cx=size/2, cy=size/2+3, r=size*0.4;
  const sweepStart=-130, sweepEnd=130;
  const frac = Math.max(0, Math.min(1, value/max));
  const needleAngle = sweepStart + frac*(sweepEnd-sweepStart);
  function pt(angleDeg, radius){ const a=(angleDeg-90)*Math.PI/180; return [cx+radius*Math.cos(a), cy+radius*Math.sin(a)]; }
  let ticks = '';
  const nTicks = 10;
  for(let i=0;i<=nTicks;i++){
    const ang = sweepStart + (i/nTicks)*(sweepEnd-sweepStart);
    const isRed = redlineFrom!==undefined && (i/nTicks) >= redlineFrom;
    const [x1,y1] = pt(ang, r);
    const [x2,y2] = pt(ang, r-7);
    ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${isRed?'#E5342E':'#EDEAE0'}" stroke-width="2"/>`;
  }
  const [nx,ny] = pt(needleAngle, r-12);
  return `
  <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r+6}" fill="#040404" stroke="#4a4a4a" stroke-width="2"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#000"/>
    ${ticks}
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#FF7A1A" stroke-width="2.2" stroke-linecap="round" style="filter:drop-shadow(0 0 4px #FF7A1A);"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="#c9cace"/>
    <circle cx="${cx}" cy="${cy}" r="2.2" fill="#1a1a1a"/>
    <text x="${cx}" y="${cy+r-16}" text-anchor="middle" font-size="7.5" fill="#8a8a80" font-family="Arial">${unit}</text>
  </svg>`;
}
// mini reloj analógico de temperatura de refrigerante (zona fría-azul / caliente-roja, como el cuadro real)
function miniTempGauge(temp){
  const size=54, cx=27, cy=30, r=20;
  const sweepStart=-90, sweepEnd=90; // solo medio arco, como los relojes de temperatura reales
  const frac = Math.max(0, Math.min(1, (temp-40)/(120-40)));
  const needleAngle = sweepStart + frac*(sweepEnd-sweepStart);
  function pt(angleDeg, radius){ const a=(angleDeg-90)*Math.PI/180; return [cx+radius*Math.cos(a), cy+radius*Math.sin(a)]; }
  const [nx,ny] = pt(needleAngle, r-6);
  const [cxA,cyA] = pt(sweepStart, r);
  const [cxB,cyB] = pt(sweepEnd, r);
  return `
  <svg width="${size}" height="${size*0.68}" viewBox="0 0 ${size} ${size*0.68}">
    <path d="M ${cxA.toFixed(1)} ${cyA.toFixed(1)} A ${r} ${r} 0 0 1 ${cxB.toFixed(1)} ${cyB.toFixed(1)}" fill="none" stroke="#2a3a55" stroke-width="4"/>
    <path d="M ${pt(sweepStart+ (sweepEnd-sweepStart)*0.72,r)[0].toFixed(1)} ${pt(sweepStart+(sweepEnd-sweepStart)*0.72,r)[1].toFixed(1)} A ${r} ${r} 0 0 1 ${cxB.toFixed(1)} ${cyB.toFixed(1)}" fill="none" stroke="#5a2020" stroke-width="4"/>
    <text x="4" y="${cy+2}" font-size="7" fill="#6a8fc9" font-family="Arial">C</text>
    <text x="${size-9}" y="${cy+2}" font-size="7" fill="#c96a6a" font-family="Arial">H</text>
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#FF7A1A" stroke-width="2" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="2.5" fill="#c9cace"/>
  </svg>`;
}
function engineFaultLightSVG(active, big){
  const color = active ? '#FF7A1A' : '#3a352a';
  const glow = active ? `filter:drop-shadow(0 0 ${big?10:6}px #FF7A1A);` : '';
  const w = big ? 46 : 32, h = big ? 31 : 22;
  return `<svg width="${w}" height="${h}" viewBox="0 0 30 20" style="${glow}">
    <path d="M12,2 L18,2 L18,5 L20,5 L20,7 L22,7 L22,9 L24,9 L24,12 L22,12 L22,15 L20,15 L20,17 L10,17 L10,15 L8,15 L8,12 L10,12 L10,5 L12,5 Z" fill="${color}"/>
    <rect x="6" y="8" width="4" height="2" fill="${color}"/>
    <rect x="6" y="11" width="4" height="2" fill="${color}"/>
  </svg>`;
}
function instantConsumption(v){
  // simulación de consumo instantáneo: sube con RPM/carga, baja a ralentí/parado
  if(v.engineOff) return {value:'0.0', unit:'L/H'};
  if(v.speed===0) return {value: (v.rpm/1400).toFixed(1), unit:'L/H'};
  const base = 3.5 + (v.rpm/7000)*9 + (v.speed>100 ? 1.5 : 0);
  return {value: Math.max(3.2, Math.min(18, base)).toFixed(1), unit:'L/100KM'};
}
// ---- Cuadro de instrumentos (diseño propio: RPM + velocidad analógicos, testigo de motor central,
// mini-reloj de temperatura, y una tira digital con el resto de datos OBD en vivo) ----
function carClusterHTML(v){
  const dtcOn = v.dtcs.length>0;
  const cons = instantConsumption(v);
  return `
    <div class="car-cluster">
      <div class="cc-gauges-row">
        <div class="bmw-gauge-block">
          ${carGauge(v.rpm, 7000, 'x1000 RPM', 0.85)}
          <div class="bmw-gauge-label">RPM</div>
        </div>
        <div class="cc-center-col">
          <div class="cc-mil ${dtcOn?'on':''}" title="Testigo de avería del motor (MIL)">${engineFaultLightSVG(dtcOn, true)}</div>
          <div class="cc-mil-text" style="color:${dtcOn?'#FF7A1A':'#4a463a'};">${dtcOn ? 'CHECK ENGINE' : 'MOTOR OK'}</div>
          ${miniTempGauge(v.temp)}
          <div class="bmw-gauge-label" style="margin-top:-6px;">TEMP</div>
        </div>
